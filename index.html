/* =========================================================
   Fond animé — nuée d'étincelles
   De fines particules dérivent lentement et scintillent derrière
   l'interface. Les couleurs sont reprises du thème actif
   (--spark pour la teinte de base, --accent pour les éclats) :
   applyTheme() appelle refresh() à chaque changement de thème.
   ========================================================= */
const Sparkles = (() => {
  const canvas = document.getElementById("sparklesBg");
  if (!canvas || matchMedia("(prefers-reduced-motion: reduce)").matches) return { refresh(){} };
  const ctx = canvas.getContext("2d");

  const MIN_SIZE = 0.5, MAX_SIZE = 1.5;   /* rayon en px */
  const AREA_PER_PARTICLE = 9000;         /* ~145 particules en 1440×900 */
  const MAX_PARTICLES = 260;
  const ACCENT_SHARE = 0.4;               /* proportion de particules à la couleur d'accent */
  const DRIFT = 0.05;                     /* px par frame */

  let particles = [], w = 0, h = 0, raf = 0, last = 0;
  let baseRgb = "255,255,255", accentRgb = "36,217,122", intensity = 1;

  const rand = (min, max) => min + Math.random() * (max - min);

  /* Lit une variable CSS et renvoie [ "r,g,b", alpha ] — accepte #rrggbb et rgb()/rgba(). */
  function readColor(name, fallbackRgb, fallbackAlpha){
    const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const hex = raw.match(/^#([0-9a-f]{6})$/i);
    if (hex) return [[0,2,4].map(i => parseInt(hex[1].slice(i, i+2), 16)).join(","), 1];
    const fn = raw.match(/rgba?\(([^)]+)\)/i);
    if (fn){
      const parts = fn[1].split(",").map(n => parseFloat(n));
      return [parts.slice(0,3).map(n => Math.round(n)).join(","), parts.length > 3 ? parts[3] : 1];
    }
    return [fallbackRgb, fallbackAlpha];
  }

  /* Recalcule les couleurs depuis le thème courant. */
  function refresh(){
    const [rgb, alpha] = readColor("--spark", "255,255,255", .14);
    baseRgb = rgb;
    accentRgb = readColor("--accent", "36,217,122", 1)[0];
    /* Les thèmes clairs définissent un --spark très discret : on suit cette intensité. */
    intensity = Math.max(.3, Math.min(1, alpha / .14));
  }

  function spawn(){
    const count = Math.min(MAX_PARTICLES, Math.round(w * h / AREA_PER_PARTICLE));
    particles = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: rand(MIN_SIZE, MAX_SIZE),
      vx: rand(-DRIFT, DRIFT),
      vy: rand(-DRIFT, DRIFT),
      phase: Math.random() * Math.PI * 2,
      twinkle: rand(.4, 1.6),
      accent: Math.random() < ACCENT_SHARE
    }));
  }

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    spawn();
  }

  function frame(now){
    const dt = Math.min((now - last) / 1000, .05) || 0;  /* borné après un onglet en veille */
    last = now;
    ctx.clearRect(0, 0, w, h);
    for (const p of particles){
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
      if (p.x < -4) p.x = w + 4; else if (p.x > w + 4) p.x = -4;
      if (p.y < -4) p.y = h + 4; else if (p.y > h + 4) p.y = -4;
      p.phase += p.twinkle * dt;
      const alpha = (.1 + .45 * (1 + Math.sin(p.phase))) * intensity;
      ctx.fillStyle = `rgba(${p.accent ? accentRgb : baseRgb},${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    raf = requestAnimationFrame(frame);
  }

  function play(){ if (!raf){ last = performance.now(); raf = requestAnimationFrame(frame); } }
  function pause(){ cancelAnimationFrame(raf); raf = 0; }

  let resizeTimer = 0;
  addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 180);
  });
  document.addEventListener("visibilitychange", () => document.hidden ? pause() : play());

  refresh(); resize(); play();
  requestAnimationFrame(() => canvas.classList.add("on"));  /* fondu d'apparition */

  return { refresh };
})();

/* =========================================================
   Effet de particules sur le nom "Norya" de l'écran de démo :
   les particules se rassemblent pour former le mot, dérivent
   légèrement au repos et fuient le curseur au survol.
   ========================================================= */
const NoryaFx = (() => {
  const canvas = document.getElementById("noryaFx");
  if (!canvas || matchMedia("(prefers-reduced-motion: reduce)").matches) return { refresh(){} };
  const ctx = canvas.getContext("2d");

  const WORD = "NORYA";
  const GAP = 3;            /* pas d'échantillonnage du texte, en px */
  const EASE = 0.12;
  const FRICTION = 0.82;
  const MOUSE_RADIUS = 46;
  const MOUSE_FORCE = 2.6;

  let particles = [], w = 0, h = 0, raf = 0;
  let mouse = { x: -9999, y: -9999 };
  let accentRgb = "36,217,122";

  class Particle {
    constructor(x, y){
      this.tx = x; this.ty = y;                    /* position cible (forme le texte) */
      this.x = w / 2 + (Math.random() - .5) * w;    /* départ dispersé */
      this.y = h / 2 + (Math.random() - .5) * h;
      this.vx = 0; this.vy = 0;
      this.r = Math.random() * .9 + .6;
      this.alpha = Math.random() * .5 + .5;
    }
    update(){
      const dx = mouse.x - this.x, dy = mouse.y - this.y;
      const dist = Math.hypot(dx, dy);
      if (dist < MOUSE_RADIUS){
        const push = (1 - dist / MOUSE_RADIUS) * MOUSE_FORCE;
        this.vx -= (dx / (dist || 1)) * push;
        this.vy -= (dy / (dist || 1)) * push;
      }
      this.vx += (this.tx - this.x) * EASE;
      this.vy += (this.ty - this.y) * EASE;
      this.vx *= FRICTION; this.vy *= FRICTION;
      this.x += this.vx; this.y += this.vy;
    }
    draw(){
      ctx.fillStyle = `rgba(${accentRgb},${this.alpha})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* Lit --accent depuis le thème courant (accepte #rrggbb et rgb()/rgba()). */
  function readAccent(){
    const raw = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
    const hex = raw.match(/^#([0-9a-f]{6})$/i);
    if (hex){ accentRgb = [0,2,4].map(i => parseInt(hex[1].slice(i, i+2), 16)).join(","); return; }
    const fn = raw.match(/rgba?\(([^)]+)\)/i);
    if (fn) accentRgb = fn[1].split(",").slice(0,3).map(n => Math.round(parseFloat(n))).join(",");
  }

  /* Rasterise "NORYA" hors écran et échantillonne les pixels opaques comme cibles. */
  function buildTargets(){
    const off = document.createElement("canvas");
    off.width = w; off.height = h;
    const octx = off.getContext("2d");
    const fontSize = Math.floor(h * .62);
    octx.fillStyle = "#fff";
    octx.font = `800 ${fontSize}px ${getComputedStyle(document.body).fontFamily}`;
    octx.textAlign = "center";
    octx.textBaseline = "middle";
    octx.fillText(WORD, w / 2, h / 2);
    const data = octx.getImageData(0, 0, w, h).data;
    const targets = [];
    for (let y = 0; y < h; y += GAP){
      for (let x = 0; x < w; x += GAP){
        if (data[(y * w + x) * 4 + 3] > 128) targets.push([x, y]);
      }
    }
    return targets;
  }

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth; h = canvas.clientHeight;
    if (!w || !h) return;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    particles = buildTargets().map(([x, y]) => new Particle(x, y));
  }

  function frame(){
    ctx.clearRect(0, 0, w, h);
    for (const p of particles){ p.update(); p.draw(); }
    raf = requestAnimationFrame(frame);
  }

  canvas.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
  });
  canvas.addEventListener("mouseleave", () => { mouse.x = -9999; mouse.y = -9999; });

  let resizeTimer = 0;
  const scheduleResize = () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 180);
  };
  addEventListener("resize", scheduleResize);
  /* Le canvas est masqué (display:none) tant que l'écran de démo n'est pas
     affiché : on observe sa taille pour (re)générer les particules dès
     qu'il obtient de vraies dimensions, plutôt qu'au chargement du script. */
  new ResizeObserver(scheduleResize).observe(canvas);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden){ cancelAnimationFrame(raf); raf = 0; }
    else if (!raf){ raf = requestAnimationFrame(frame); }
  });

  readAccent();
  raf = requestAnimationFrame(frame);

  return { refresh(){ readAccent(); } };
})();

/* =========================================================
   Fond animé WebGL de l'écran de connexion (bruit simplex,
   dégradé de couleurs, vignette et grain) — adapté du composant
   React "Velaris". La palette suit le thème actif (--accent, --bg).
   ========================================================= */
const VelarisFx = (() => {
  const canvas = document.getElementById("velarisBg");
  if (!canvas || matchMedia("(prefers-reduced-motion: reduce)").matches) return { refresh(){} };
  const gl = canvas.getContext("webgl");
  if (!gl) return { refresh(){} };

  const VERT = `
attribute vec2 position;
varying vec2 vUv;
void main() {
  vUv = position * 0.5 + 0.5;
  gl_Position = vec4(position, 0.0, 1.0);
}
`;
  const FRAG = `
precision highp float;
varying vec2 vUv;
uniform vec2  u_resolution;
uniform float u_time;
uniform float u_grain;
uniform vec3  u_colors[4];
uniform vec3  u_bg;
vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
           -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy) );
  vec2 x0 = v -   i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
  + i.x + vec3(0.0, i1.x, 1.0 ));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
    dot(x12.zw,x12.zw)), 0.0);
  m = m*m ;
  m = m*m ;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}
void main() {
  vec2 uv = vUv;
  float ratio = u_resolution.x / u_resolution.y;
  vec2 p = uv - 0.5;
  p.x *= ratio;
  float t = u_time * 0.1;
  float n1 = snoise(p * 0.4 + vec2(t * 0.2, -t * 0.3));
  float n2 = snoise(p * 0.55 + vec2(-t * 0.15, t * 0.25) + n1 * 0.25);
  float n3 = snoise(p * 0.75 + vec2(t * 0.1, -t * 0.2) + n2 * 0.2);
  vec3 col = u_bg;
  float dist = length(p) * 1.5;
  float vignette = 1.0 - smoothstep(0.3, 1.2, dist);
  col = mix(col, u_colors[0], smoothstep(-0.2, 0.5, n1) * 0.85);
  col = mix(col, u_colors[1], smoothstep(-0.1, 0.6, n2) * 0.7);
  col = mix(col, u_colors[2], smoothstep(-0.3, 0.4, n3) * 0.6);
  col = mix(col, u_colors[3], smoothstep(0.0, 0.7, n1 * n2) * 0.5);
  float glow = smoothstep(0.8, 0.0, dist) * 0.3;
  col += u_colors[1] * glow;
  col = mix(col * 0.2, col, vignette);
  float grain = fract(sin(dot(uv, vec2(12.9898, 78.233))) * 43758.5453 + u_time);
  col += (grain - 0.5) * u_grain * 0.1;
  gl_FragColor = vec4(col, 1.0);
}
`;

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(program);
  gl.useProgram(program);

  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const posLoc = gl.getAttribLocation(program, "position");
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

  const u = {
    res: gl.getUniformLocation(program, "u_resolution"),
    time: gl.getUniformLocation(program, "u_time"),
    grain: gl.getUniformLocation(program, "u_grain"),
    colors: gl.getUniformLocation(program, "u_colors"),
    bg: gl.getUniformLocation(program, "u_bg"),
  };

  const GRAIN = 0.3, SPEED = 2.0;
  let colorsFlat = new Float32Array(12);
  let bgRgb = [0.02, 0.03, 0.02];

  /* Convertit une couleur CSS (#rrggbb ou rgb()/rgba()) en triplet 0-1. */
  function toRgb01(raw){
    const hex = raw.match(/^#([0-9a-f]{6})$/i);
    if (hex) return [0,2,4].map(i => parseInt(hex[1].slice(i, i+2), 16) / 255);
    const fn = raw.match(/rgba?\(([^)]+)\)/i);
    if (fn) return fn[1].split(",").slice(0,3).map(n => parseFloat(n) / 255);
    return [0, 0, 0];
  }
  function readVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  function mix01(a, b, t){ return a.map((v,i) => v + (b[i] - v) * t); }

  /* Reconstruit la palette (4 couleurs + fond) depuis le thème actif. */
  function refresh(){
    const accent = toRgb01(readVar("--accent"));
    const accentDim = toRgb01(readVar("--accent-dim"));
    bgRgb = toRgb01(readVar("--bg"));
    const dark = mix01(accentDim, [0, 0, 0], 0.55);
    colorsFlat = new Float32Array([...accent, ...accentDim, ...dark, 0, 0, 0]);
  }

  let w = 0, h = 0, raf = 0, playing = false;

  function play(){ if (!playing){ playing = true; raf = requestAnimationFrame(frame); } }
  function pause(){ playing = false; cancelAnimationFrame(raf); raf = 0; }

  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth; h = canvas.clientHeight;
    if (!w || !h){ pause(); return; }
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    play();
  }

  function frame(t){
    gl.uniform2f(u.res, canvas.width, canvas.height);
    gl.uniform1f(u.time, t * 0.001 * SPEED);
    gl.uniform1f(u.grain, GRAIN);
    gl.uniform3f(u.bg, bgRgb[0], bgRgb[1], bgRgb[2]);
    gl.uniform3fv(u.colors, colorsFlat);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    raf = requestAnimationFrame(frame);
  }

  /* Le canvas est masqué (display:none) tant que l'écran de connexion n'est
     pas affiché : on observe sa taille pour démarrer/redimensionner dès
     qu'il obtient de vraies dimensions plutôt qu'au chargement du script. */
  new ResizeObserver(resize).observe(canvas);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) pause(); else if (w && h) play();
  });

  refresh();

  return { refresh };
})();

/* Thème retenu d'une visite à l'autre. En démo rien n'est sauvegardé côté
   serveur, et même connecté cela évite d'attendre le réseau pour retrouver
   ses couleurs. */
const THEME_KEY = "noryaTheme";
const storedTheme = () => { try { return localStorage.getItem(THEME_KEY); } catch { return null; } };

/* Le choix local prime en démo, faute de profil persistant ; connecté, c'est
   le profil qui fait foi et le local ne sert que de secours. */
const preferredTheme = profileTheme => DEMO
  ? (storedTheme() || profileTheme)
  : (profileTheme || storedTheme());

/* Applique un thème à toute l'application (aperçu immédiat + mémorisation). */
function applyTheme(key){
  const theme = THEMES[key] ? key : "sombre";
  const vars = THEMES[theme].vars;
  Object.entries(vars).forEach(([k,v]) => document.documentElement.style.setProperty(k, v));
  document.documentElement.dataset.theme = theme;
  state.theme = theme;
  try { localStorage.setItem(THEME_KEY, theme); } catch { /* stockage refusé : le thème reste valable pour la session */ }
  Sparkles.refresh();
  NoryaFx.refresh();
  VelarisFx.refresh();
}

function modal({ title, body, footer, wide }){
  const root = $("#modalRoot");
  root.innerHTML = `<div class="overlay" data-close>
    <div class="modal" ${wide?'style="max-width:680px"':""} role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head">
        <h3>${esc(title)}</h3>
        <button class="icon-btn" data-close aria-label="Fermer">
          <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">${body}</div>
      ${footer ? `<div class="modal-foot">${footer}</div>` : ""}
    </div></div>`;
  // La croix ferme toujours ; l'arrière-plan seulement si on clique à côté
  // du panneau (sans quoi un clic sur l'icône interne ne fermait rien).
  root.querySelectorAll("[data-close]").forEach(el => {
    if (el.classList.contains("overlay")){
      el.addEventListener("click", e => { if (e.target === el) closeModal(); });
    } else {
      el.addEventListener("click", e => { e.stopPropagation(); closeModal(); });
    }
  });
  document.addEventListener("keydown", escClose);
  const first = root.querySelector("input,select,textarea");
  if (first) first.focus();
  return root.querySelector(".modal");
}
function escClose(e){ if (e.key === "Escape") closeModal(); }
function closeModal(){ $("#modalRoot").innerHTML = ""; document.removeEventListener("keydown", escClose); }

/* Fiches servant à garnir un profil d'essai. Noms neutres, volontairement
   distincts de ceux de l'équipe d'exemple : un profil d'essai ne doit pas
   paraître travailler les mêmes adresses qu'un autre commercial. */
const DEMO_CARDS = [
  ["Le Comptoir des Arts","Restaurant"], ["Trattoria del Sole","Italien"],
  ["Le Jardin Suspendu","Gastronomique"], ["Chez Fernand","Bistrot"],
  ["Ramen Ichiban","Japonais"],          ["La Brasserie du Théâtre","Brasserie"],
  ["Pizza Carbone","Pizzeria"],          ["Le Bistrot des Amis","Bistrot"],
  ["Saveurs d'Orient","Libanais"],       ["La Crêpe Dorée","Crêperie"],

  ["Tandoori Palace","Indien"],          ["La Casa Tapas","Espagnol"],
  ["Bun & Bowl","Vietnamien"],           ["Le Quai n°7","Restaurant"],
  ["La Villa Verde","Végétarien"],       ["Grill & Braise","Grill"],
  ["Le Refuge Savoyard","Savoyard"],     ["Sushi Momiji","Japonais"],
  ["La Table d'Augustin","Gastronomique"],["Kebab du Centre","Kebab"],
  ["Café des Sports","Bar"],            ["L'Orangerie","Restaurant"],
  ["Pasta e Basta","Italien"],           ["Le Bercail","Bistrot"],
  ["Le Clos Fleuri","Restaurant"],       ["Ti Ar Mor","Fruits de mer"],
  ["Bagel Corner","Fast-food"],          ["La Rotisserie du Marché","Grill"]
];
const DEMO_CONTACTS = ["M. Lambert","Mme Chevalier","M. Ferrand","Mme Delaunay",
  "M. Bouchard","Mme Roussel","M. Vasseur","Mme Pichon","M. Da Silva","Mme Kacem"];
const DEMO_AREA = { rennes:"02 99", paris:"01 45", lyon:"04 78" };

/* Portefeuille d'un profil d'essai : un historique de ventes dans sa ville,
   plus quelques fiches en cours.

   Le tirage dérive de l'identifiant du profil. Un rechargement de page
   reconstruit le magasin de démonstration à partir des données d'origine :
   sans cette reproductibilité, le profil retrouverait bien sa session mais
   des chiffres différents à chaque visite. */
function demoPortfolio(profile){
  let graine = 0;
  for (const c of profile.id) graine = (graine * 31 + c.charCodeAt(0)) >>> 0;
  const alea = () => {
    graine = (graine + 0x6D2B79F5) >>> 0;
    let t = graine;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const entre  = (a,b) => a + Math.floor(alea() * (b - a + 1));
  const pioche = liste => liste[Math.floor(alea() * liste.length)];

  // Le jour reste sous 28 pour exister dans tous les mois.
  const jourDu = off => {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + off);
    return d;
  };
  const dateDans = (off, jour, heure) => {
    const d = jourDu(off); d.setDate(jour); d.setHours(heure, entre(0,59), 0, 0);
    return d.toISOString();
  };
  const ilYa = jours => {
    const d = new Date(); d.setDate(d.getDate() - jours); d.setHours(entre(9,18), 0, 0, 0);
    return d.toISOString();
  };

  const ville = profile.current_city;
  const indicatif = DEMO_AREA[cityKey(ville)] || "02 99";
  const deuxChiffres = () => String(entre(10,99));
  const slug = nom => nom.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

  // Tirage sans remise : deux fiches ne peuvent pas porter le même nom.
  const restantes = DEMO_CARDS.slice();
  for (let i = restantes.length - 1; i > 0; i--){
    const j = Math.floor(alea() * (i + 1));
    [restantes[i], restantes[j]] = [restantes[j], restantes[i]];
  }

  // Seul l'administrateur crée des fiches ; le commercial les reçoit.
  const auteur = DEMO_TEAM.find(t => t.role === "admin")?.id ?? null;
  const fiches = [];
  const fiche = (extra) => {
    const [nom, type] = restantes.pop();
    fiches.push({
      id: "dp-" + profile.id + "-" + (fiches.length + 1),
      company_name: nom, category: type, city: ville, address: null,
      phone: `${indicatif} ${deuxChiffres()} ${deuxChiffres()} ${deuxChiffres()}`,
      email: "contact@" + slug(nom) + ".fr",
      website_quality: pioche(["aucun","aucun","mauvais","correct"]),
      google_rating: Math.round(entre(38,49)) / 10,
      assigned_to: profile.id, created_by: auteur,
      website_url: null, notes: null,
      sale_amount: 0, recurring_amount: 0, billing_day: null,
      commission_rate_snapshot: null, recurring_rate_snapshot: null,
      closed_at: null, paid_at: null,
      contact_name: null, last_contact_at: null,
      ...extra,
      // Le site livré découle du nom, que l'appelant ne connaît pas.
      delivered_url: extra.status === "conclu" ? "https://exemple.fr/" + slug(nom) : null
    });
  };

  /* Montée en régime sur dix mois : le profil d'essai a l'air d'avoir pris
     ses marques, pas d'avoir tout conclu d'un coup. */
  const rythme = [1,1,1,2,2,2,2,2,3];          // du mois -9 au mois -1
  const aujourdhui = new Date().getDate();
  rythme.forEach((nb, k) => {
    const off = k - 9;
    for (let i = 0; i < nb; i++){
      const conclu = dateDans(off, entre(2,27), entre(10,17));
      fiche({
        status: "conclu",
        sale_amount: SITE_PRICE,
        recurring_amount: MAINTENANCE_FEE,
        billing_day: pioche([5,12,20,25]),
        commission_rate_snapshot: COMMERCIAL_RATE,
        recurring_rate_snapshot: 0,
        contact_name: pioche(DEMO_CONTACTS),
        closed_at: conclu,
        paid_at: conclu,                        // les mois passés sont réglés
        last_contact_at: conclu,
        created_at: dateDans(off, 1, 9)
      });
    }
  });

  /* Le mois en cours reste en jeu : des ventes datées d'aujourd'hui au plus
     tard, et non encore encaissées, pour que l'objectif et le gain en attente
     aient tous deux de quoi s'afficher. */
  for (let i = 0; i < entre(1,3); i++){
    // Aujourd'hui compris, mais pas à une heure encore à venir.
    const conclu = new Date(Math.min(+new Date(dateDans(0, entre(1, Math.max(1, aujourdhui)), entre(10,17))),
                                     Date.now() - 36e5)).toISOString();
    fiche({
      status: "conclu",
      sale_amount: SITE_PRICE,
      recurring_amount: MAINTENANCE_FEE,
      billing_day: pioche([5,12,20,25]),
      commission_rate_snapshot: COMMERCIAL_RATE,
      recurring_rate_snapshot: 0,
      contact_name: pioche(DEMO_CONTACTS),
      closed_at: conclu,
      paid_at: null,
      last_contact_at: conclu,
      created_at: dateDans(0, 1, 9)
    });
  }

  // Le pipeline du moment : de quoi remplir « À faire aujourd'hui ».
  for (let i = 0; i < 5; i++){
    fiche({
      status: "a_contacter",
      contact_name: alea() < 0.5 ? pioche(DEMO_CONTACTS) : null,
      last_contact_at: alea() < 0.6 ? ilYa(entre(1,12)) : null,
      created_at: ilYa(entre(13,40))
    });
  }
  fiche({
    status: "refuse",
    contact_name: pioche(DEMO_CONTACTS),
    last_contact_at: ilYa(entre(8,25)),
    created_at: ilYa(entre(26,60))
  });

  /* L'ancienneté suit les ventes : un membre arrivé aujourd'hui mais crédité
     de dix mois de ventes fausserait les objectifs d'agence, qui ne comptent
     que les commerciaux déjà en poste. */
  profile.created_at = dateDans(-9, 1, 9);
  return fiches;
}

/* =========================================================
   Robustesse du mot de passe
   Une seule évaluation alimente la jauge, le libellé et la liste des
   critères. Les motifs trop courants plafonnent le score : un mot de
   passe long mais deviné en une seconde ne vaut pas mieux qu'un court.
   ========================================================= */
const PASS_COMMON = /^(?:password|passw0rd|motdepasse|azerty|qwerty|letmein|welcome|admin|iloveyou|monkey|dragon|soleil|bonjour|abc123|111111|123123|123456)/i;
const PASS_REPEAT = /(.)\1{3,}/;
const PASS_SUITE  = /(?:0123|1234|2345|3456|4567|5678|6789|abcd|bcde|cdef|defg|azer|zert|qwer|wert|erty|asdf)/i;
const PASS_SYMBOL = /[!-\/:-@\[-`{-~]/;

const PASS_RULES = [
  { id:"length", label:"12 caractères ou plus",     test:v => v.length >= 12 },
  { id:"case",   label:"Majuscules et minuscules",  test:v => /[a-z]/.test(v) && /[A-Z]/.test(v) },
  { id:"digit",  label:"Un chiffre",                test:v => /\d/.test(v) },
  { id:"symbol", label:"Un symbole",                test:v => PASS_SYMBOL.test(v) }
];
const PASS_LABELS = ["Vide", "Faible", "Moyen", "Bon", "Fort"];

function evaluatePassword(value){
  const rules = PASS_RULES.map(r => ({ id:r.id, label:r.label, met:r.test(value) }));
  const remplis = rules.filter(r => r.met).length;
  const devinable = value.length > 0 &&
    (PASS_COMMON.test(value) || PASS_REPEAT.test(value) || PASS_SUITE.test(value));
  const score = value.length === 0 ? 0
              : devinable ? 1
              : Math.min(PASS_RULES.length, Math.max(1, remplis));
  const label = PASS_LABELS[Math.min(score, PASS_LABELS.length - 1)];
  const manquants = rules.filter(r => !r.met);
  const annonce = value.length === 0 ? "" : [
    `Robustesse du mot de passe : ${label.toLowerCase()}.`,
    devinable ? "Ce mot de passe suit un schéma trop courant." : "",
    manquants.length === 0
      ? "Tous les critères sont remplis."
      : `Il manque : ${manquants.map(r => r.label.toLowerCase()).join(", ")}.`
  ].filter(Boolean).join(" ");
  return { score, max:PASS_RULES.length, label, rules, devinable, annonce };
}

function passwordTone(score, max){
  if (score === 0) return "none";
  const part = score / max;
  return part <= .34 ? "danger" : part <= .67 ? "caution" : "safe";
}

function passwordStrengthHTML(){
  const cellules = PASS_RULES.map((r, i) =>
    `<span class="ps-cell" style="--i:${i}"><i></i></span>`).join("");
  const libelles = PASS_LABELS.map(t =>
    `<span aria-hidden="true">${esc(t)}</span>`).join("");
  const criteres = PASS_RULES.map(r => `
        <li data-rule="${r.id}">
          <span class="ps-box" aria-hidden="true"><i></i>
            <svg viewBox="0 0 12 12"><path d="M2 6.2 4.7 8.9 10 3.3"/></svg></span>
          <span>${esc(r.label)}</span>
          <span class="sr-only ps-state">non rempli</span>
        </li>`).join("");
  return `
      <div class="pstrength" id="pstrength" data-tone="none">
        <div class="ps-meter" role="meter" aria-label="Robustesse du mot de passe"
             aria-valuemin="0" aria-valuemax="${PASS_RULES.length}" aria-valuenow="0"
             aria-valuetext="${esc(PASS_LABELS[0])}"
             style="grid-template-columns:repeat(${PASS_RULES.length},minmax(0,1fr))">${cellules}</div>
        <div class="ps-line">
          <span class="ps-labels">${libelles}</span>
          <span class="ps-guess" aria-hidden="true">Mot de passe trop courant</span>
        </div>
        <ul class="ps-rules">${criteres}</ul>
        <p class="sr-only" aria-live="polite" id="psAnnonce"></p>
      </div>`;
}

/* L'annonce vocale attend une pause dans la frappe : sinon le lecteur
   d'écran commente chaque caractère. */
let passAnnounceTimer = null;

function wirePasswordStrength(){
  const champ = $("#su_pass"), bloc = $("#pstrength");
  clearTimeout(passAnnounceTimer);
  if (!champ || !bloc) return;

  const cellules = [...bloc.querySelectorAll(".ps-cell")];
  const libelles = [...bloc.querySelectorAll(".ps-labels span")];
  const criteres = [...bloc.querySelectorAll(".ps-rules li")];
  const jauge = bloc.querySelector(".ps-meter");
  const annonce = $("#psAnnonce");

  const refresh = () => {
    const e = evaluatePassword(champ.value);
    bloc.dataset.tone = passwordTone(e.score, e.max);
    bloc.classList.toggle("guessable", e.devinable);
    cellules.forEach((c, i) => c.classList.toggle("on", i < e.score));
    const actif = Math.min(e.score, libelles.length - 1);
    libelles.forEach((l, i) => l.classList.toggle("on", i === actif));
    criteres.forEach((li, i) => {
      li.classList.toggle("met", e.rules[i].met);
      const etat = li.querySelector(".ps-state");
      if (etat) etat.textContent = e.rules[i].met ? "rempli" : "non rempli";
    });
    jauge.setAttribute("aria-valuenow", e.score);
    jauge.setAttribute("aria-valuetext", e.label);

    clearTimeout(passAnnounceTimer);
    if (!e.annonce){ annonce.textContent = ""; return; }
    passAnnounceTimer = setTimeout(() => { annonce.textContent = e.annonce; }, 700);
  };

  champ.oninput = refresh;
  refresh();   // le mot de passe saisi puis revu à l'étape précédente est déjà noté
}

/* Dépose la candidature. Le mot de passe saisi n'est jamais recopié dans
   le dossier : l'administrateur juge des pièces, pas des identifiants. */
async function submitSignup(){
  const force = evaluatePassword(signupData.password || "");
  return store.createApplication({
    nom: signupData.nom || "",
    prenom: signupData.prenom || "",
    email: signupData.email || "",
    telephone: signupData.telephone || "",
    adresse: signupData.adresse || "",
    siret: signupData.siret || "",
    rsac: signupData.rsac || "",
    justificatif_name: signupData.justificatifName || null,
    rib_name: signupData.ribName || null,
    password_set: true,
    password_score: force.score
  });
}

function wireSignupFileInputs(key){
  if (key === "statut"){
    const f = $("#su_just");
    if (f) f.onchange = () => {
      signupData.justificatifName = f.files[0]?.name || null;
      const lbl = $("#su_just_label");
      if (lbl) lbl.textContent = signupData.justificatifName || "Choisir un fichier (PDF, JPG, PNG)";
    };
  }
  if (key === "paiement"){
    const f = $("#su_rib");
    if (f) f.onchange = () => {
      signupData.ribName = f.files[0]?.name || null;
      const lbl = $("#su_rib_label");
      if (lbl) lbl.textContent = signupData.ribName || "Choisir un fichier (PDF, JPG, PNG)";
    };
  }
}

function collectSignupStep(key){
  const val = sel => $(sel)?.value.trim() || "";
  if (key === "identite"){ signupData.nom = val("#su_nom"); signupData.prenom = val("#su_prenom"); }
  if (key === "contact"){ signupData.email = val("#su_email"); signupData.telephone = val("#su_tel"); signupData.adresse = val("#su_adresse"); }
  if (key === "statut"){ signupData.siret = val("#su_siret"); signupData.rsac = val("#su_rsac"); }
  if (key === "paiement"){ signupData.password = val("#su_pass"); }
}

function validateSignupStep(key){
  if (key === "identite") return signupData.nom && signupData.prenom;
  if (key === "contact")  return signupData.email && signupData.telephone && signupData.adresse;
  if (key === "statut")   return signupData.siret && signupData.rsac && signupData.justificatifName;
  if (key === "paiement") return signupData.ribName && signupData.password && signupData.password.length >= 8;
  return true;
}

function renderSignupStep(){
  const done = signupStep >= SIGNUP_STEPS.length;
  $("#signupSteps").innerHTML = done ? "" : SIGNUP_STEPS.map((s,i) =>
    `<span class="signup-dot ${i===signupStep?"on":""} ${i<signupStep?"done":""}"></span>`).join("");
  $("#signupBody").innerHTML = done ? signupDoneHTML() : signupStepHTML(SIGNUP_STEPS[signupStep].key);
  if (!done){
    wireSignupFileInputs(SIGNUP_STEPS[signupStep].key);
    wirePasswordStrength();
  }

  $("#signupBack").style.visibility = (signupStep === 0 || done) ? "hidden" : "visible";
  $("#signupNext").textContent = done ? "Retour à l'accueil" : (signupStep === SIGNUP_STEPS.length-1 ? "Terminer l'inscription" : "Continuer");
}

function openSignupFlow(){
  signupStep = 0; signupData = {};
  $("#demoLogin").classList.add("hidden");
  $("#signupFlow").classList.remove("hidden");
  renderSignupStep();
}
function closeSignupFlow(){
  $("#signupFlow").classList.add("hidden");
  $("#demoLogin").classList.remove("hidden");
}

function wireSignupFlow(){
  $("#openSignup").onclick = openSignupFlow;
  $("#signupClose").onclick = closeSignupFlow;   // quitter à tout moment, sans blocage
  $("#signupBack").onclick = () => {
    if (signupStep === 0) return;
    // On garde la saisie en cours : revenir en arrière ne doit rien effacer.
    collectSignupStep(SIGNUP_STEPS[signupStep].key);
    signupStep--; renderSignupStep();
  };
  $("#signupNext").onclick = async () => {
    if (signupStep >= SIGNUP_STEPS.length){ closeSignupFlow(); return; }   // « Retour à l'accueil »
    const key = SIGNUP_STEPS[signupStep].key;
    collectSignupStep(key);
    if (!validateSignupStep(key)){ toast("Merci de compléter tous les champs de cette étape.", "err"); return; }
    // Dernière étape : le dossier part avant d'afficher l'écran de fin,
    // pour ne jamais annoncer un dépôt qui n'a pas eu lieu.
    if (signupStep === SIGNUP_STEPS.length - 1){
      const b = $("#signupNext");
      b.disabled = true; b.textContent = "Envoi…";
      try { await submitSignup(); }
      catch (e){
        toast("Le dossier n'a pas pu être déposé : " + e.message, "err");
        b.disabled = false; b.textContent = "Terminer l'inscription";
        return;
      }
      b.disabled = false;
    }
    signupStep++; renderSignupStep();
  };
}

/* Verrou de l'espace administrateur, en mode démonstration uniquement.
   Seule l'empreinte SHA-256 du mot de passe figure ici : le secret n'apparaît
   donc pas en clair dans la page ni dans l'historique du dépôt.

   ⚠ Ce n'est pas un mécanisme de sécurité. Tout ce qui est vérifié dans le
   navigateur est contournable : le script est lisible, l'empreinte attaquable
   hors ligne et le test désactivable depuis la console. C'est un garde-fou le
   temps de la démonstration, à remplacer par une authentification réelle
   (store.signIn / Supabase, déjà câblée) avant toute publication. */
const ADMIN_PASS_SHA256 = "d3bb6a9035bc5cf15e87f23bb81b579b4747ab7c98eb059effd87ab90bcb6ff4";

async function sha256Hex(texte){
  const octets = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(texte));
  return [...new Uint8Array(octets)].map(o => o.toString(16).padStart(2, "0")).join("");
}

/* Connexion par identifiant et mot de passe.
   En démonstration, l'identifiant désigne un membre de l'équipe d'exemple :
   nom complet, adresse ou préfixe d'adresse, indifféremment. Le mot de passe
   n'est réellement vérifié que pour un compte administrateur — le contrôle
   porte sur le rôle du compte trouvé, jamais sur la forme de l'identifiant
   saisi, sinon l'adresse de l'administrateur ouvrirait une porte dérobée.
   Hors démonstration, c'est Supabase qui tranche via store.signIn, et la page
   se recharge pour repartir sur la session. */

/* =========================================================
   Lookout — le regard de l'écran de connexion
   Les yeux suivent le curseur et le texte en cours de frappe,
   se détournent du mot de passe, jettent un oeil quand on le
   révèle, et s'assoupissent après un moment sans activité.
   Purement décoratif : aucun effet sur la saisie.
   ========================================================= */

/* Course de la paupière : le rectangle couvre y 48–82 dans le
   dessin. -34 dégage l'oeil, 0 le ferme complètement. */
const LOOKOUT_LID = {
  neutre:-30, lecture:-32, secret:-20, oeil:-38, content:-25, decu:-27, somnole:-13
};

const LOOKOUT_BROWS = {
  neutre:  { g:"translateY(0)",                  d:"translateY(0)" },
  lecture: { g:"translateY(-1px)",               d:"translateY(-1px)" },
  secret:  { g:"translateY(-2px) rotate(-6deg)", d:"translateY(-2px) rotate(6deg)" },
  oeil:    { g:"translateY(-6px)",               d:"translateY(-6px)" },
  content: { g:"translateY(-3px)",               d:"translateY(-3px)" },
  decu:    { g:"translateY(2px) rotate(-14deg)", d:"translateY(2px) rotate(14deg)" },
  somnole: { g:"translateY(4px)",                d:"translateY(4px)" }
};

/* Toutes les bouches s'écrivent M,Q,Q : la transition du « d »
   peut ainsi se déformer au lieu de sauter d'une forme à l'autre. */
const LOOKOUT_MOUTH = {
  neutre:  "M52 91 Q60 93.5 68 91 Q60 93.5 52 91",
  lecture: "M53 91 Q60 92.5 67 91 Q60 92.5 53 91",
  secret:  "M54 92 Q60 90 66 92 Q60 90 54 92",
  oeil:    "M56 89 Q60 97 64 89 Q60 82 56 89",
  content: "M49 89 Q60 100 71 89 Q60 100 49 89",
  decu:    "M51 95 Q60 87.5 69 95 Q60 87.5 51 95",
  somnole: "M55 92 Q60 92.2 65 92 Q60 92.2 55 92"
};

const lookoutClamp = (v, min, max) => Math.min(max, Math.max(min, v));

/* Champs dont la saisie mérite d'être suivie du regard. */
const lookoutEstChamp = el =>
  el instanceof HTMLTextAreaElement ||
  (el instanceof HTMLInputElement &&
   !["checkbox","radio","range","color","file","submit","button","reset","image","hidden"].includes(el.type));

/* Seuls ces types exposent selectionStart ; les autres (email,
   number, date…) renvoient null et ne permettent pas de situer le caret. */
const lookoutACaret = el =>
  el instanceof HTMLTextAreaElement || ["text","search","url","tel","password"].includes(el.type);

let lookoutApi = null;

/* Installe le regard. Appelé à chaque affichage de l'écran de
   connexion, mais une seule instance vit à la fois. */
function mountLookout(){
  const host = $("#lookout");
  const form = $("#loginForm");
  if (!host || !form || lookoutApi) return;

  const pupilles  = [...host.querySelectorAll(".lk-pupil")];
  const paupieres = [...host.querySelectorAll(".lk-lid")];
  const sourcilG = $("#lkBrowL"), sourcilD = $("#lkBrowR"), bouche = $("#lkMouth");
  const doux = window.matchMedia("(prefers-reduced-motion: reduce)");

  /* L'état image par image vit ici, jamais dans le DOM. */
  const regard = { x:0, y:0 };                     // position lissée
  const cible  = { x:0, y:0 };                     // position visée
  const lid = { y:LOOKOUT_LID.neutre, cible:LOOKOUT_LID.neutre, clin:null };
  let boite = host.getBoundingClientRect();
  let raf = 0, tClin = 0, tRetour = 0, tRepos = 0, tOeil = 0, tDecision = 0, tHumeur = 0;
  let dernierArmement = 0;
  let expr = "";                                   // vide : la première décision pose vraiment l'expression
  let humeurForcee = "auto";
  let champ = null;                                // champ focalisé
  let souris = null, sourisSale = false;
  let oeilSur = null;                              // point visé pendant un coup d'oeil
  let assoupi = false, visible = true;
  let premierClin = true;
  let largeurMasque = 0;
  let observateurType = null;

  /* Un seul span de mesure, réutilisé pour situer le caret. */
  const miroir = document.createElement("span");
  miroir.setAttribute("aria-hidden", "true");
  miroir.style.cssText = "position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:-9999px;pointer-events:none";
  document.body.appendChild(miroir);

  const peindre = () => {
    const t = `translate(${(regard.x*6).toFixed(2)}px, ${(regard.y*5).toFixed(2)}px)`;
    for (const p of pupilles) p.style.transform = t;
    const l = `translateY(${lid.y.toFixed(2)}px)`;
    for (const p of paupieres) p.style.transform = l;
  };

  /* Point de l'écran → vecteur de regard, relatif au centre du dessin. */
  const viser = (px, py) => {
    const cx = boite.left + boite.width / 2;
    const cy = boite.top + boite.height / 2;
    cible.x = lookoutClamp((px - cx) / (boite.width * 1.6), -1, 1);
    cible.y = lookoutClamp((py - cy) / (boite.height * 1.6), -1, 1);
  };

  const tick = () => {
    raf = 0;
    if (!visible) return;
    if (sourisSale){
      sourisSale = false;
      if (souris && !champ && !oeilSur && !assoupi && humeurForcee === "auto") viser(souris.x, souris.y);
    }
    const butee = lid.clin ?? lid.cible;
    if (doux.matches){                               // mouvement réduit : on pose, sans animer
      regard.x = cible.x; regard.y = cible.y; lid.y = butee;
      peindre();
      return;
    }
    regard.x += (cible.x - regard.x) * 0.18;
    regard.y += (cible.y - regard.y) * 0.18;
    lid.y += (butee - lid.y) * (lid.clin !== null ? 0.55 : 0.28);
    peindre();
    const bouge = Math.abs(cible.x - regard.x) > 0.002 ||
                  Math.abs(cible.y - regard.y) > 0.002 ||
                  Math.abs(butee - lid.y) > 0.05;
    if (bouge) raf = requestAnimationFrame(tick);
    else { regard.x = cible.x; regard.y = cible.y; lid.y = butee; peindre(); }
  };

  const reveiller = () => { if (!raf && visible) raf = requestAnimationFrame(tick); };

  /* Regroupe les rafales (selectionchange pendant un glisser,
     input + focus) en une seule décision par tour de boucle. */
  const planifierDecision = () => {
    if (tDecision) return;
    tDecision = window.setTimeout(() => { tDecision = 0; decider(); }, 0);
  };

  const poserExpr = next => {
    if (next === expr) return;
    expr = next;
    lid.cible = LOOKOUT_LID[next];
    host.dataset.expression = next;
    const s = LOOKOUT_BROWS[next];
    sourcilG.style.transform = s.g;
    sourcilD.style.transform = s.d;
    bouche.setAttribute("d", LOOKOUT_MOUTH[next]);
  };

  /* Se détourner du champ, et vers le bas : « je ne lis pas ça ». */
  const seDetourner = () => {
    const f = champ?.getBoundingClientRect();
    const aDroite = f ? f.left + f.width/2 > boite.left + boite.width/2 : true;
    cible.x = aDroite ? -0.9 : 0.9;
    cible.y = 0.55;
  };

  const repos = () => { cible.x = 0; cible.y = 0; };

  /* Recopie les métriques du champ dans le miroir, une fois par focus. */
  const adopterPolice = el => {
    const cs = getComputedStyle(el);
    for (const p of ["fontFamily","fontSize","fontWeight","fontStyle","letterSpacing","wordSpacing","textTransform"])
      miroir.style[p] = cs[p];
    miroir.textContent = "•";
    largeurMasque = miroir.getBoundingClientRect().width;
  };

  /* Position du caret, pour que le regard suive la frappe.
     À défaut, on vise le centre du champ. */
  const pointCaret = el => {
    const r = el.getBoundingClientRect();
    const cs = getComputedStyle(el);
    const centre = { x:r.left + r.width/2, y:r.top + r.height/2 };
    if (cs.direction === "rtl" || !["left","start"].includes(cs.textAlign)) return centre;
    const jusqua = lookoutACaret(el) ? (el.selectionStart ?? el.value.length) : el.value.length;
    let w;
    if (el.type === "password") w = largeurMasque * jusqua;
    else { miroir.textContent = el.value.slice(0, jusqua); w = jusqua ? miroir.getBoundingClientRect().width : 0; }
    const marge = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.borderLeftWidth) || 0);
    return { x: r.left + lookoutClamp(marge + w - el.scrollLeft, marge, r.width - 8), y: centre.y };
  };

  /* Choisit l'expression et la direction du regard. */
  const decider = () => {
    const secret = !!champ && champ.type === "password";

    if (humeurForcee !== "auto") poserExpr(humeurForcee);
    else if (oeilSur) poserExpr("oeil");
    else if (secret) poserExpr("secret");
    else if (champ) poserExpr("lecture");
    else if (assoupi) poserExpr("somnole");
    else poserExpr("neutre");

    if (oeilSur) viser(oeilSur.x, oeilSur.y);
    else if (expr === "secret") seDetourner();
    else if (champ && humeurForcee === "auto"){ const p = pointCaret(champ); viser(p.x, p.y); }
    else if (expr === "somnole"){ cible.x = 0; cible.y = 0.5; }
    else if (souris && humeurForcee === "auto") viser(souris.x, souris.y);
    else repos();
    reveiller();
  };

  const armerRepos = (force = false) => {
    const now = performance.now();
    if (!force && now - dernierArmement < 800 && !assoupi) return;
    dernierArmement = now;
    window.clearTimeout(tRepos);
    if (assoupi){ assoupi = false; planifierDecision(); }
    if (!doux.matches)
      tRepos = window.setTimeout(() => { assoupi = true; planifierDecision(); }, 8000);
  };

  const clinAutorise = () => !doux.matches && !document.hidden && visible;
  const clignerMaintenant = () => {
    if (!clinAutorise()) return;
    lid.clin = 0;
    reveiller();
    tRetour = window.setTimeout(() => {
      lid.clin = null;
      reveiller();
      if (Math.random() < 0.18) tClin = window.setTimeout(clignerMaintenant, 180);
      else planifierClin();
    }, 110);
  };
  const planifierClin = () => {
    window.clearTimeout(tClin);
    if (!clinAutorise()) return;
    // Le premier clin attend plus longtemps : une capture prise
    // juste après l'ouverture ne doit pas tomber sur des yeux fermés.
    const delai = premierClin ? 6500 + Math.random()*2500 : 2500 + Math.random()*3500;
    premierClin = false;
    tClin = window.setTimeout(clignerMaintenant, delai);
  };

  const coupDOeil = (point, ms) => {
    oeilSur = point;
    planifierDecision();
    window.clearTimeout(tOeil);
    tOeil = window.setTimeout(() => { oeilSur = null; planifierDecision(); }, ms);
  };

  /* Le mot de passe révélé (type password → text) déclenche le coup d'oeil. */
  const surveillerType = el => {
    observateurType?.disconnect();
    observateurType = null;
    if (!(el instanceof HTMLInputElement)) return;
    let etaitSecret = el.type === "password";
    observateurType = new MutationObserver(() => {
      const secret = el.type === "password";
      if (etaitSecret && !secret){
        const r = el.getBoundingClientRect();
        coupDOeil({ x:r.left + r.width/2, y:r.top + r.height/2 }, 1400);
      }
      etaitSecret = secret;
      planifierDecision();
    });
    observateurType.observe(el, { attributes:true, attributeFilter:["type"] });
  };

  const surFocus = e => {
    const t = e.target;
    champ = lookoutEstChamp(t) ? t : null;
    if (champ) adopterPolice(champ);
    surveillerType(champ);
    boite = host.getBoundingClientRect();
    armerRepos(true);
    planifierDecision();
  };
  const surBlur = () => { champ = null; surveillerType(null); planifierDecision(); };
  const surSaisie = () => { armerRepos(); if (champ) planifierDecision(); };
  const surSelection = () => { if (champ && document.activeElement === champ) planifierDecision(); };
  const surSouris = e => { souris = { x:e.clientX, y:e.clientY }; sourisSale = true; armerRepos(); reveiller(); };
  const surClic = e => {
    const el = e.target?.closest?.("[data-lookout='reveal']");
    if (!el) return;
    const r = el.getBoundingClientRect();
    coupDOeil({ x:r.left + r.width/2, y:r.top + r.height/2 }, 1400);
  };
  const surTouche = () => armerRepos();
  const surMiseEnPage = () => { boite = host.getBoundingClientRect(); planifierDecision(); };
  const surVisibilite = () => {
    if (document.hidden) window.clearTimeout(tClin);
    else { armerRepos(true); planifierClin(); reveiller(); }
  };

  /* L'écran de connexion est masqué dès que l'application prend la
     main : on suspend alors toute animation. */
  const io = new IntersectionObserver(([e]) => {
    visible = e?.isIntersecting ?? true;
    if (visible){ boite = host.getBoundingClientRect(); planifierClin(); planifierDecision(); }
    else { window.clearTimeout(tClin); cancelAnimationFrame(raf); raf = 0; }
  }, { threshold:0 });
  io.observe(host);

  form.addEventListener("focusin", surFocus);
  form.addEventListener("focusout", surBlur);
  form.addEventListener("input", surSaisie);
  form.addEventListener("click", surClic);
  document.addEventListener("selectionchange", surSelection);
  document.addEventListener("keydown", surTouche);
  document.addEventListener("visibilitychange", surVisibilite);
  window.addEventListener("pointermove", surSouris, { passive:true });
  window.addEventListener("resize", surMiseEnPage);
  doux.addEventListener("change", reveiller);

  lookoutApi = {
    /* Impose une expression un instant, puis rend la main au formulaire. */
    humeur(nom, ms = 0){
      humeurForcee = nom;
      decider();
      window.clearTimeout(tHumeur);
      if (ms) tHumeur = window.setTimeout(() => { humeurForcee = "auto"; decider(); }, ms);
    },
    stop(){
      lookoutApi = null;
      io.disconnect();
      form.removeEventListener("focusin", surFocus);
      form.removeEventListener("focusout", surBlur);
      form.removeEventListener("input", surSaisie);
      form.removeEventListener("click", surClic);
      document.removeEventListener("selectionchange", surSelection);
      document.removeEventListener("keydown", surTouche);
      document.removeEventListener("visibilitychange", surVisibilite);
      window.removeEventListener("pointermove", surSouris);
      window.removeEventListener("resize", surMiseEnPage);
      doux.removeEventListener("change", reveiller);
      observateurType?.disconnect();
      miroir.remove();
      cancelAnimationFrame(raf);
      [tClin, tRetour, tRepos, tOeil, tDecision, tHumeur].forEach(window.clearTimeout);
    }
  };

  armerRepos(true);
  planifierClin();
  decider();
  peindre();
}

function wireLoginForm(){
  const form = $("#loginForm"), btn = $("#loginSubmit"), err = $("#loginError");

  const norm = v => String(v ?? "").trim().toLowerCase();

  const echec = msg => {
    err.textContent = msg;
    err.classList.remove("hidden");
    $("#loginPass").value = "";
    $("#loginPass").focus();
    lookoutApi?.humeur("decu", 1800);
  };

  /* Afficher / masquer le mot de passe. Le focus reste dans le champ :
     le regard continue de suivre la saisie au lieu de sauter au bouton. */
  const oeil = $("#loginPassReveal");
  if (oeil) oeil.onclick = () => {
    const pass = $("#loginPass");
    const visible = pass.type === "text";
    pass.type = visible ? "password" : "text";
    oeil.setAttribute("aria-pressed", String(!visible));
    oeil.setAttribute("aria-label", visible ? "Afficher le mot de passe" : "Masquer le mot de passe");
    pass.focus();
  };
  const occupe = on => {
    btn.disabled = on;
    btn.setAttribute("aria-busy", on ? "true" : "false");
    form.querySelectorAll(".ihb-label, .ihb-fly > span").forEach(s => {
      s.textContent = on ? "Connexion…" : "Se connecter";
    });
  };

  form.onsubmit = async e => {
    e.preventDefault();
    err.classList.add("hidden");
    const ident = norm($("#loginIdent").value);
    const pass  = $("#loginPass").value;
    if (!ident || !pass){ echec("Renseignez votre identifiant et votre mot de passe."); return; }

    occupe(true);
    try {
      if (DEMO){
        const membre = (store._team || []).find(t =>
          norm(t.email) === ident ||
          norm(t.full_name) === ident ||
          norm(t.email).split("@")[0] === ident);
        if (!membre) throw new Error("Identifiant ou mot de passe incorrect.");

        /* Le verrou suit le rôle du compte, pas la manière de le désigner. */
        if (membre.role === "admin"){
          if (!globalThis.crypto?.subtle)
            throw new Error("Connexion administrateur indisponible dans ce navigateur.");
          if (await sha256Hex(pass) !== ADMIN_PASS_SHA256)
            throw new Error("Identifiant ou mot de passe incorrect.");
        }

        sessionStorage.setItem("novaDemoProfile", JSON.stringify(membre));
        loginSuccessFx(membre);
        $("#demoLogin").classList.add("hidden");
        await bootDemoAs(membre.id);
        return;   // l'application prend la main, inutile de rendre le bouton
      }
      await store.signIn(ident, pass);
      sessionStorage.setItem("noryaLoginOk", "1");   // rejoué après le rechargement
      location.reload();
    } catch (ex){
      echec(ex?.message || "Connexion impossible.");
      occupe(false);
    }
  };
}

async function boot(){
  // Les couleurs mémorisées dès l'écran de connexion : sans cela, le thème
  // choisi n'apparaîtrait qu'une fois le profil chargé, après un flash.
  applyTheme(storedTheme());

  if (DEMO){
    const savedRaw = sessionStorage.getItem("novaDemoProfile");
    if (savedRaw){
      try {
        const profile = JSON.parse(savedRaw);
        if (!store._team.some(t => t.id === profile.id)) store._team.push(profile);
        attachDemoPortfolio(profile);   // le magasin repart à vide à chaque chargement
        await bootDemoAs(profile.id);
        return;
      } catch { sessionStorage.removeItem("novaDemoProfile"); }
    }
    showLoginScreen();
    return;
  }

  const s = await store.session();
  if (!s) { showLoginScreen(); return; }

  $("#signedOut")?.remove();
  $("#app").classList.remove("hidden");

  // Connexion qui vient d'aboutir (et non simple reprise de session) :
  // l'animation couvre le chargement, le prénom suit dès qu'il est lu.
  let accueil = null;
  if (sessionStorage.getItem("noryaLoginOk")){
    sessionStorage.removeItem("noryaLoginOk");
    accueil = loginSuccessFx(null);
  }

  try {
    state.me = await store.me(s.user.id);
  } catch {
    // Le profil peut mettre un instant à être créé par le trigger.
    await new Promise(r => setTimeout(r, 900));
    try {
      state.me = await store.me(s.user.id);
    } catch {
      // Session ouverte mais profil illisible : impasse réelle. On l'annonce,
      // sinon le rejet s'échappe de boot() et le voile de chargement tourne
      // indéfiniment devant un écran vide.
      showSignedOut();
      return;
    }
  }

  lookoutApi?.stop();          // session valide : on ne repasse pas par la connexion
  accueil?.accueillir(state.me);
  applyTheme(preferredTheme(state.me.theme));
  paintMe();
  if (!isAdmin()){
    $("#navAdmin").classList.add("hidden");
    $("#navInscriptions").classList.add("hidden");
  }

  await refresh();
  render();
  startHeartbeat();
  startChatStream();
}

/* ---------- Connexion réussie ----------
   Joué à chaque connexion aboutie — compte réel, identifiant de démo ou
   profil d'essai — jamais à une simple reprise de session. L'application
   démarre dessous pendant l'animation ; un clic ou Échap l'écourte. */
function infinityLayer(sens){
  const x = 348, y = 158;
  const paths = Array.from({ length:36 }, (_, i) => {
    const s = 200 + i * 10, k = s * 0.5 * sens;
    const d = `M${x-s} ${y} C${x-s} ${y-k},${x-s/2} ${y-k},${x} ${y}`
            + ` C${x+s/2} ${y+k},${x+s} ${y+k},${x+s} ${y}`
            + ` C${x+s} ${y-k},${x+s/2} ${y-k},${x} ${y}`
            + ` C${x-s/2} ${y+k},${x-s} ${y+k},${x-s} ${y}`;
    return `<path pathLength="1" d="${d}" stroke-width="${(0.5 + i * 0.03).toFixed(2)}"
      stroke-opacity="${Math.min(1, 0.1 + i * 0.03).toFixed(2)}"
      style="--dl:${(i * 0.03 + (sens < 0 ? 0.15 : 0)).toFixed(2)}s;--du:${(14 + (i * 7 % 10) * 0.9).toFixed(1)}s"/>`;
  }).join("");
  // En portrait, un huit couché ne laisserait voir que deux bords :
  // on le redresse pour qu'il épouse l'écran en hauteur.
  return innerHeight > innerWidth
    ? `<svg viewBox="0 0 316 696" fill="none" focusable="false"><g transform="translate(316 0) rotate(90)">${paths}</g></svg>`
    : `<svg viewBox="0 0 696 316" fill="none" focusable="false">${paths}</svg>`;
}

  document.querySelector(".login-ok")?.remove();

  const duree = sobre ? 1500 : 2900;

    `<span class="lok-word">${[...mot].map((l, j) =>
      `<span class="lok-l" style="animation-delay:${(0.35 + w * 0.1 + j * 0.03).toFixed(2)}s">${esc(l)}</span>`
    ).join("")}</span>`).join("");
  const points = Array.from({ length:6 }, (_, i) =>
    `<i style="left:${20 + i * 15}%;top:${30 + (i % 2) * 40}%;--du:${3 + i}s;--dl:${i * 0.5}s"></i>`).join("");

  const el = document.createElement("div");
  el.className = "login-ok";
  el.setAttribute("role", "status");
  el.innerHTML = `
    <div class="lok-paths" aria-hidden="true">${infinityLayer(1)}${infinityLayer(-1)}</div>
    <div class="lok-card">
      <div class="lok-dots" aria-hidden="true">${points}</div>
      <span class="lok-badge" aria-hidden="true"><svg viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="23" pathLength="1"/><path d="M16 27l7 7 14-15" pathLength="1"/></svg></span>
      <h2 class="lok-title" aria-label="Connexion réussie">${titre}</h2>
      <p class="lok-sub"></p>
      <p class="lok-role"></p>
      <span class="lok-bar" aria-hidden="true"><i style="animation-duration:${duree}ms"></i></span>
    </div>`;

  /* Le nom peut arriver après coup (connexion réelle : le profil se lit
     une fois la page rechargée), d'où ce petit accès en écriture. */
  const accueillir = m => {
    const prenom = String(m?.full_name || "").trim().split(/\s+/)[0];
    el.querySelector(".lok-sub").textContent = prenom ? `Bienvenue, ${prenom}` : "Bienvenue";
    el.querySelector(".lok-role").textContent = !m ? "" :
      (m.role === "admin" ? "Espace administrateur" : "Espace commercial") + (DEMO ? " · démonstration" : "");
  };
  accueillir(member);

  let fini = false;
  const partir = () => {
    if (fini) return;
    fini = true;
    clearTimeout(minuteur);
    document.removeEventListener("keydown", clavier);
    el.classList.add("out");
    setTimeout(() => el.remove(), sobre ? 220 : 650);
  };
  const clavier = e => { if (e.key === "Escape") partir(); };
  const minuteur = setTimeout(partir, duree);
  el.onclick = partir;
  document.addEventListener("keydown", clavier);
  document.body.append(el);
  return { accueillir, partir };
}

/* Ouvre une session et signale une présence toutes les minutes.
   Le battement s'arrête quand l'onglet passe en arrière-plan : sans quoi
   un onglet oublié gonflerait le temps de travail affiché. */
let heartbeat = null, sessionId = null;
async function startHeartbeat(){
  try {
    const s = await store.openSession();
    sessionId = s.id;
  } catch { /* la session n'est pas critique */ }

  const tick = () => {
    if (document.hidden) return;
    store.pingSession(sessionId).catch(() => {});
  };
  tick();
  clearInterval(heartbeat);
  heartbeat = setInterval(tick, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
}

   7. Rendu
   ========================================================= */

/* ---------- Chiffres animés ----------
   render() remplace tout #main : un compteur monté meurt à chaque
   passe et ne saurait pas d'où il vient. On retient donc la valeur
   précédente hors du DOM, par clé stable, et on anime au remontage.
   La clé inclut le lecteur courant : sans ça, changer de commercial
   ferait « monter » les chiffres d'une personne vers ceux d'une autre,
   ce qui raconterait une progression qui n'a jamais eu lieu. */
const NFLOW_MEM = new Map();
const NFLOW_DUREE = 520;

const nflowSobre = () => {
  try { return matchMedia("(prefers-reduced-motion: reduce)").matches; }
  catch { return false; }
};

/* Position des chiffres dans une chaîne déjà formatée (« 1 240 € »). */
const nflowChiffres = s => {
  const out = [];
  for (let i = 0; i < s.length; i++) if (s[i] >= "0" && s[i] <= "9") out.push(i);
  return out;
};

/* Valeur numérique d'une chaîne formatée, pour connaître le sens. */
const nflowValeur = s => {
  const n = Number(s.replace(/[^\d,.-]/g, "").replace(/\s/g, "").replace(",", "."));
  return Number.isFinite(n) ? n : null;
};

function nflowAnime(el, avant, apres){
  const dAvant = nflowChiffres(avant), dApres = nflowChiffres(apres);
  const vAvant = nflowValeur(avant), vApres = nflowValeur(apres);
  // Sens de défilement : à défaut de valeur lisible, on monte.
  const monte = vAvant === null || vApres === null ? true : vApres >= vAvant;

  const frag = document.createDocumentFragment();
  const colonnes = [];
  let rang = 0;                       // rang du chiffre en partant de la droite

  for (let i = 0; i < apres.length; i++) {
    const c = apres[i];
    const posApres = dApres.indexOf(i);

    if (posApres === -1) {            // séparateur, symbole, signe : figé
      const s = document.createElement("span");
      s.className = "nf-s";
      s.textContent = c;
      frag.append(s);
      continue;
    }

    // Alignement par la droite : « 398 » vers « 1 435 » part de « 0398 ».
    const posAvant = dAvant.length - (dApres.length - posApres);
    const depart = posAvant >= 0 ? Number(avant[dAvant[posAvant]]) : 0;
    const arrivee = Number(c);

    const cell = document.createElement("span");
    cell.className = "nf-d";
    const col = document.createElement("span");
    col.className = "nf-col";
    // Trois copies de 0-9 : la bande du milieu est le point de départ,
    // ce qui laisse de la place pour dérouler vers le haut comme vers le bas.
    for (let t = 0; t < 30; t++) {
      const d = document.createElement("span");
      d.textContent = String(t % 10);
      col.append(d);
    }
    const iDepart = depart + 10;
    const iArrivee = monte
      ? (arrivee > depart ? arrivee + 10 : arrivee + 20)
      : (arrivee < depart ? arrivee + 10 : arrivee);

    col.style.transform = `translateY(-${iDepart}em)`;
    cell.append(col);
    frag.append(cell);

    if (iDepart !== iArrivee) colonnes.push({ col, iArrivee, rang });
    rang++;
  }

  el.textContent = "";
  const nf = document.createElement("span");
  nf.className = "nf";
  nf.append(frag);
  el.append(nf);

  // Les unités partent en premier, les milliers suivent : c'est ce décalage
  // qui donne l'impression d'un compteur plutôt que d'un bloc qui glisse.
  const dernier = Math.max(0, ...colonnes.map(c => c.rang));
  requestAnimationFrame(() => {
    for (const { col, iArrivee, rang } of colonnes) {
      col.style.transition = `transform ${NFLOW_DUREE}ms cubic-bezier(.2,.7,.2,1) ${Math.min(rang * 32, 160)}ms`;
      col.style.transform = `translateY(-${iArrivee}em)`;
    }
  });

  // Quoi qu'il arrive, on retombe sur le texte exact de la vue.
  setTimeout(() => {
    if (el.isConnected && el.dataset.nflowJeton === String(el._nflowJeton)) el.textContent = apres;
  }, NFLOW_DUREE + Math.min(dernier * 32, 160) + 90);
}

function paintFlows(){
  const sobre = nflowSobre();
  document.querySelectorAll("#main .stat > .v, #main .kpi-body > .v").forEach(el => {
    if (el.children.length) return;            // pastille ou markup : pas un nombre
    const texte = el.textContent.trim();
    if (!/\d/.test(texte)) return;

    const bloc = el.closest(".stat, .kpi-body");
    const label = bloc?.querySelector(".k")?.textContent.trim() || "";
    let qui = "";
    try { qui = `${viewer()?.id ?? ""}|${state.viewAs ?? ""}`; } catch { /* avant login */ }
    const cle = `${state.view}|${qui}|${label}`;

    const avant = NFLOW_MEM.get(cle);
    NFLOW_MEM.set(cle, texte);
    if (sobre || avant === undefined || avant === texte) return;

    el._nflowJeton = (el._nflowJeton || 0) + 1;
    el.dataset.nflowJeton = String(el._nflowJeton);
    nflowAnime(el, avant, texte);
  });
}

/* ---------- Filtrage et tri ---------- */
function visible(){
  const q = state.q.toLowerCase().trim();
  let rows = state.prospects.filter(p => {
    // Une fois conclu, le prospect devient un client : il quitte cette liste.
    if (p.status === "conclu") return false;
    if (state.filterStatus && p.status !== state.filterStatus) return false;
    if (state.filterOwner  && p.assigned_to !== state.filterOwner) return false;
    if (!q) return true;
    return [p.company_name, p.phone, p.city, p.email, p.category, p.contact_name]
      .some(f => (f||"").toLowerCase().includes(q));
  });

  const { col, dir } = state.sort, sign = dir === "asc" ? 1 : -1;
  const ORDER = Object.keys(STATUSES);

  // Valeur de tri par colonne : certaines ne se trient pas sur le champ brut.
  const key = p => {
    if (col === "assigned_to") return nameOf(p.assigned_to) || "";
    if (col === "status")      return ORDER.indexOf(p.status);
    if (col === "last_contact_at" || col === "closed_at")
      return p[col] ? new Date(p[col]).getTime() : null;
    return p[col];
  };

  rows.sort((a,b) => {
    const x = key(a), y = key(b);
    // Les cases vides restent en bas quel que soit le sens du tri.
    const xe = x === null || x === undefined || x === "";
    const ye = y === null || y === undefined || y === "";
    if (xe && ye) return 0;
    if (xe) return 1;
    if (ye) return -1;
    if (typeof x === "number" && typeof y === "number") return (x - y) * sign;
    return String(x).localeCompare(String(y), "fr", { numeric:true }) * sign;
  });
  return rows;
}

const nameOf = id => state.team.find(t => t.id === id)?.full_name || null;

/* Numéros affichés : début, fin, et le voisinage de la page courante. */
function pageNumbers(cur, total){
  if (total <= 7) return Array.from({length:total}, (_,i) => i+1);
  const out = [1];
  if (cur > 3) out.push("…");
  for (let n = Math.max(2, cur-1); n <= Math.min(total-1, cur+1); n++) out.push(n);
  if (cur < total-2) out.push("…");
  out.push(total);
  return out;
}

/* ---------- Vue : Objectifs ----------
   L'objectif est personnel et suit l'ancienneté du commercial :
   il monte à mesure qu'il prend ses marques. */

/* Clé de mois : toujours le 1er, en heure locale.
   Le libellé est lu à midi pour ne jamais basculer sur le mois d'avant. */
const monthKey = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-01`; };
const monthLabel = m => new Date(m + "T12:00:00").toLocaleDateString("fr-FR",{ month:"long", year:"numeric" });
function shiftMonth(n){
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`;
}

const DEFAULT_MONTHLY_GOAL = 4;

/* Nombre de mois entamés depuis l'arrivée du membre. 0 = son premier mois. */
function monthsIn(member, month){
  if (!member?.created_at) return 0;
  const a = new Date(member.created_at), b = new Date(month + "T12:00:00");
  return (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
}

/* Objectif d'un membre pour un mois donné. 0 s'il n'était pas encore arrivé. */
function personalTarget(member, month){
  const goal = state.goals.find(g => g.month === month && g.created_by === member?.id);
  return Number(goal?.target_sales) || DEFAULT_MONTHLY_GOAL;
}
function rampLabel(member, month){
  const goal = state.goals.find(g => g.month === month && g.created_by === member?.id);
  return goal ? "Objectif que vous avez fixé" : `Objectif par défaut : ${DEFAULT_MONTHLY_GOAL} ventes`;
}

/* Objectif de l'agence : la somme des objectifs des commerciaux actifs. */
function activeMembers(month){
  return state.team.filter(t => t.is_active && monthsIn(t, month) >= 0);
}
function globalTarget(month){
  return activeMembers(month).reduce((a,t) => a + personalTarget(t, month), 0);
}

/* Ventes conclues sur un mois, pour un membre ou pour tout le monde. */
function salesIn(month, userId){
  return state.allProspects.filter(p =>
    p.status === "conclu" && p.closed_at && monthKey(p.closed_at) === month &&
    (!userId || p.assigned_to === userId));
}
function monthResult(m){
  const sales = salesIn(m, isAdmin() ? null : viewer().id);
  return { n: sales.length, ca: sales.reduce((s,p) => s + Number(p.sale_amount||0), 0), sales };
}

function viewObjectifs(){
  const cur = shiftMonth(0);
  const me = viewer();
  const myGoal = state.goals.find(g => g.month === cur && g.created_by === me.id);
  const cible = Number(myGoal?.target_sales) || DEFAULT_MONTHLY_GOAL;
  const mine = salesIn(cur, me.id);
  const faites = mine.length;
  const ca = mine.reduce((a,p) => a + Number(p.sale_amount||0), 0);

  // Où devrait-on en être à ce stade du mois ?
  const now = new Date();
  const daysIn = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const elapsed = now.getDate();
  const left = daysIn - elapsed;
  const expected = cible * (elapsed / daysIn);
  const onTrack = faites >= expected;
  const pct = cible ? Math.min(100, Math.round(faites/cible*100)) : 0;
  const R = 52, C = 2 * Math.PI * R;

  const perso = `
  <div class="card">
    <div class="card-head"><h3>Votre objectif — ${esc(cap(monthLabel(cur)))}</h3>
      ${state.viewAs ? "" : `<button class="ihb ihb-ghost ihb-mini" id="editGoal"><span class="ihb-label">Modifier</span><span class="ihb-fly"><span>Modifier</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button>`}
      ${faites >= cible
        ? `<span class="pill conclu">Atteint</span>`
        : onTrack ? `<span class="pill contacte">Dans les temps</span>`
                  : `<span class="pill refuse">En retard sur le rythme</span>`}
    </div>
    <div class="goal-wrap">
      <svg viewBox="0 0 130 130" class="donut" role="img" aria-label="${pct} pour cent de votre objectif">
        <circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="13"/>
        <circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--accent)" stroke-width="13"
                stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}"
                stroke-dashoffset="${(C*(1-pct/100)).toFixed(1)}" transform="rotate(-90 65 65)"/>
        <text x="65" y="72" class="donut-label">${faites}/${cible}</text>
      </svg>
      <div class="goal-rows">
        <div><span>Ventes conclues</span><b class="num">${faites} sur ${cible}</b></div>
        <div><span>Commission si objectif atteint</span><b class="num">${eur(cible * COMMERCIAL_COMMISSION)}</b></div>
        <div><span>Commission déjà acquise</span><b class="num">${eur(faites * COMMERCIAL_COMMISSION)}</b></div>
        <div><span>${rampLabel(me, cur)}</span><b class="soft">${cible} vente${cible>1?"s":""} × ${eur(COMMERCIAL_COMMISSION)}</b></div>
      </div>
    </div>
    <div class="stats" style="border-top:1px solid var(--line-soft)">
      <div class="stat"><div class="k">Jours restants</div><div class="v">${left}</div><div class="d">sur ${daysIn}</div></div>
      <div class="stat"><div class="k">Rythme attendu</div><div class="v">${expected.toFixed(1)}</div><div class="d">ventes à ce stade</div></div>
      <div class="stat"><div class="k">Reste à conclure</div><div class="v">${Math.max(0, cible-faites)}</div>
        <div class="d">${left > 0 && cible > faites
          ? "une tous les " + Math.max(1, Math.round(left/(cible-faites))) + " jours"
          : "objectif atteint"}</div></div>
    </div>
  </div>`;

  /* ---- Historique ---- */
  const past = Array.from({length:6}, (_,i) => shiftMonth(-(i+1)))
    .filter(m => monthsIn(me, m) >= 0 || isAdmin());

  const history = past.length ? `
  <div class="card">
    <div class="card-head"><h3>Mois précédents</h3></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Mois</th><th>Votre objectif</th><th>Vos ventes</th><th>Équipe</th><th>Résultat</th></tr></thead>
      <tbody>${past.map(m => {
        const c = personalTarget(me, m);
        const f = salesIn(m, me.id).length;
        const g = salesIn(m).length, gc = globalTarget(m);
        return `<tr>
          <td><b>${esc(cap(monthLabel(m)))}</b></td>
          <td class="num">${c || `<span class="dim">—</span>`}</td>
          <td class="num"><b>${f}</b></td>
          <td class="num dim">${g} / ${gc}</td>
          <td>${!c ? `<span class="dim">Pas encore arrivé</span>`
              : f >= c ? `<span class="pill conclu">Atteint</span>`
              : `<span class="pill refuse">Manqué de ${c-f}</span>`}</td>
        </tr>`;
      }).join("")}</tbody>
    </table></div>
  </div>` : "";

  return `
  <div class="dash-head">
    <div>
      <h2>Objectifs</h2>
      <p>Fixez votre objectif mensuel.</p>
    </div>
  </div>
  ${perso}
  ${history}`;
}

/* Agrégats d'un mois donné, pour comparer d'un mois sur l'autre. */
function monthStats(m){
  const sold = state.prospects.filter(p =>
    p.status === "conclu" && p.closed_at && monthKey(p.closed_at) === m);
  const ca = sold.reduce((a,p) => a + Number(p.sale_amount||0), 0);
  const approached = state.prospects.filter(p => p.status !== "a_contacter").length;
  return {
    ca, ventes: sold.length,
    panier: sold.length ? Math.round(ca / sold.length) : 0,
    mrr: state.prospects.filter(p => p.status === "conclu" && Number(p.recurring_amount) > 0).length * MAINTENANCE_FEE,
    conv: approached ? Math.round(state.prospects.filter(p => p.status === "conclu").length / approached * 100) : 0
  };
}

/* Écart en pourcentage entre deux valeurs, formaté. */
function delta(now, before){
  if (!before) return now ? `<span class="d up">↗ nouveau</span>` : `<span class="d">—</span>`;
  const pct = Math.round((now - before) / before * 100);
  if (pct === 0) return `<span class="d">→ stable</span>`;
  return `<span class="d ${pct > 0 ? "up" : "down"}">${pct > 0 ? "↗ +" : "↘ "}${pct} %</span>`;
}

const monthShort = m => {
  const [y,mo] = m.split("-").map(Number);
  return new Date(y, mo-1, 1).toLocaleDateString("fr-FR",{month:"short"}).replace(".","");
};

/* Temps écoulé, en français courant. */
function ago(ts){
  const s = Math.floor((Date.now() - new Date(ts)) / 1000);
  if (s < 60) return "à l'instant";
  if (s < 3600) return "il y a " + Math.floor(s/60) + " min";
  if (s < 86400) return "il y a " + Math.floor(s/3600) + " h";
  const j = Math.floor(s/86400);
  if (j < 31) return "il y a " + j + " j";
  return dateFR(ts);
}

function reminder(tone, icon, value, title, sub, go){
  return `<button class="reminder" data-go="${go}">
    <span class="rem-icon ${tone}">${icon}</span>

      <span class="rem-top"><b>${value}</b> <em class="${tone}">${esc(title)}</em></span>

}
