/* =========================================================
   9. Import / export CSV
   ========================================================= */
function parseCSV(text){
  const rows = []; let row = [], cell = "", quoted = false;
  text = text.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (quoted){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else quoted = false; }
      else cell += c;
    } else if (c === '"') quoted = true;
    else if (c === "," || c === ";"){ row.push(cell); cell = ""; }
    else if (c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}

const CSV_MAP = {
  nom:"company_name", entreprise:"company_name", restaurant:"company_name", name:"company_name",
  type:"category", categorie:"category", "catégorie":"category",
  adresse:"address", address:"address",
  ville:"city", city:"city",
  telephone:"phone", "téléphone":"phone", tel:"phone", phone:"phone",
  email:"email", mail:"email",
  note:"google_rating", "note google":"google_rating", rating:"google_rating",
  site:"website_quality", "site web":"website_quality", website:"website_quality"
};

function handleCSV(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCSV(reader.result);
    if (rows.length < 2){ toast("Fichier vide ou illisible.", "err"); return; }
    const heads = rows[0].map(h => h.trim().toLowerCase());
    const cols  = heads.map(h => CSV_MAP[h] || null);
    if (!cols.includes("company_name")){
      $("#csvPreview").innerHTML = `<div class="alert">Aucune colonne de nom trouvée. Ajoutez un en-tête <b>nom</b> ou <b>entreprise</b>.</div>`;
      return;
    }
    const parsed = rows.slice(1).map(r => {
      const o = { status:"a_contacter", created_by:state.me.id };
      cols.forEach((c,i) => {
        if (!c) return;
        const v = (r[i]||"").trim(); if (!v) return;
        if (c === "google_rating"){ const n = parseFloat(v.replace(",", ".")); if (!isNaN(n) && n<=5) o[c] = n; }
        else if (c === "website_quality"){ const k = v.toLowerCase();
          o[c] = k.startsWith("auc") ? "aucun" : k.startsWith("mau") ? "mauvais" : k.startsWith("cor") ? "correct" : null; }
        else o[c] = v;
      });
      return o;
    }).filter(o => o.company_name);

    $("#csvPreview").innerHTML = `
      <div class="alert ok">${parsed.length} prospect${parsed.length>1?"s":""} prêt${parsed.length>1?"s":""} à importer.</div>
      <button class="ihb" id="doImport"><span class="ihb-label">Importer ${parsed.length} prospect${parsed.length>1?"s":""}</span><span class="ihb-fly"><span>Importer ${parsed.length} prospect${parsed.length>1?"s":""}</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button>`;
    $("#doImport").onclick = async () => {
      const b = $("#doImport"); b.disabled = true; btnLabel(b, "Import en cours…");
      try {
        await store.createMany(parsed);
        await refresh();
        toast(`${parsed.length} prospects importés`);
        state.view = "prospects";
        document.querySelectorAll("#nav button").forEach(x => x.classList.toggle("on", x.dataset.view === "prospects"));
        render();
      } catch (err) {
        toast("Échec de l'import : " + err.message, "err");
        b.disabled = false; btnLabel(b, "Réessayer");
      }
    };
  };
  reader.readAsText(file, "utf-8");
}

function toCSV(headers, rows){
  const q = v => { const s = String(v ?? ""); return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  return "\uFEFF" + [headers.map(q).join(";"), ...rows.map(r => r.map(q).join(";"))].join("\n");
}
function download(filename, content, type="text/csv;charset=utf-8"){
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportProspects(){
  download("norya-prospects.csv", toCSV(
    ["Nom","Type","Ville","Telephone","Email","Note Google","Site","Statut","Commercial","Dernier contact","Montant","Recurrent","Notes"],
    state.prospects.map(p => [
      p.company_name, p.category, p.city, p.phone, p.email, p.google_rating,
      WEBSITE[p.website_quality]||"", statusLabel(p.status), nameOf(p.assigned_to)||"",
      p.last_contact_at||"", p.sale_amount||0, p.recurring_amount||0, p.notes||""
    ])));
  toast("Export généré");
}
function exportClients(){
  const clients = state.allProspects.filter(p => p.status === "conclu");
  download("norya-clients.csv", toCSV(
    ["Client","Type","Ville","Telephone","Signe le","Vendu par","Montant","Maintenance mensuelle"],
    clients.map(p => [
      p.company_name, p.category||"", p.city||"", p.phone||"",
      p.closed_at ? p.closed_at.slice(0,10) : "",
      nameOf(p.assigned_to)||"", p.sale_amount||0,
      Number(p.recurring_amount) > 0 ? MAINTENANCE_FEE : 0
    ])));
  toast("Export généré");
}

function exportActivity(){
  const min = s => Math.max(1, Math.round((new Date(s.last_ping_at) - new Date(s.started_at))/60000));
  download("norya-activite.csv", toCSV(
    ["Membre","Debut","Fin","Duree (min)","Appareil"],
    (state.sessions||[]).map(s => {
      const t = state.team.find(x => x.id === s.user_id);
      return [t?.full_name||"—", s.started_at, s.last_ping_at, min(s), s.user_agent||""];
    })));
  toast("Export généré");
}

function exportCommissions(){
  download("norya-commissions.csv", toCSV(
    ["Commercial","Ventes","Commission"],
    teamCommissionRows().map(r => {
      const t = r.t;
      const masque = !isAdmin() && t.id !== viewer().id && t.hide_sales;
      if (masque) return [t.full_name||t.email, "Masqué", "Masqué"];
      return [t.full_name||t.email, r.n, r.com.toFixed(2)];
    })));
  toast("Export généré");
}

   10. Lancement
   ========================================================= */
if (!DEMO) sb.auth.onAuthStateChange((event) => { if (event === "SIGNED_OUT") location.reload(); });

boot().catch(e => {
  console.error(e);
  $("#main").innerHTML = `<div class="empty"><h4>L'application n'a pas pu démarrer</h4>
    <p>Ouvrez la console du navigateur pour le détail.</p></div>`;
});
</script>
