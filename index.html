  const taches = `
  <div class="card">
    <div class="card-head"><h3>À faire aujourd'hui</h3></div>
    ${todo.length ? `<div class="todo">
      ${todo.map(t => `
        <div class="todo-row ${t.u}">
          <div class="avatar sm">${esc(initials(t.p.company_name))}</div>
          <div class="todo-body">
            <b>${esc(t.p.company_name)}</b>
            <small class="${t.u}">${esc(t.txt)}</small>
          </div>
          <button class="ihb ihb-ghost" data-open="${t.p.id}"><span class="ihb-label">${t.cta}</span><span class="ihb-fly"><span>${t.cta}</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button>
        </div>`).join("")}
    </div>
    <button class="card-link" data-go="prospects">Voir tous les prospects
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>`
    : `<div class="empty" style="padding:34px"><p style="margin:0">Rien d'urgent aujourd'hui.</p></div>`}
  </div>`;

  /* ---- Activité récente, reconstituée depuis les fiches ----
     Seul l'administrateur crée des fiches : une arrivée se raconte donc
     comme une attribution, jamais comme l'œuvre d'un commercial. Et dans
     son propre espace, le lecteur est « Vous » — sinon son nom revenait
     à chaque ligne, comme si un seul commercial occupait tout le fil. */
  const moi = viewer().id;
  const feed = [];
  state.prospects.filter(p => p.status === "conclu" && p.closed_at).forEach(p => {
    const soi = p.assigned_to === moi;
    feed.push({ t:p.closed_at, kind:"vente",
                who: soi ? "Vous" : nameOf(p.assigned_to),
                title: soi ? "avez conclu la vente" : "a conclu la vente",
                sub:p.company_name });
  });
  state.prospects.forEach(p => {
    const pour = p.assigned_to, auteur = p.created_by !== moi && nameOf(p.created_by);
    const title = !pour       ? (isAdmin() ? "à attribuer" : "à prendre dans votre ville")
                : pour === moi ? (auteur ? "attribué par " + auteur : "dans votre portefeuille")
                : "attribué à " + (nameOf(pour) || "un commercial");
    feed.push({ t:p.created_at, kind:"ajout", who:"Nouveau prospect", title, sub:p.company_name });
  });
  feed.sort((a,b) => new Date(b.t) - new Date(a.t));

  const fi = {
    vente:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>`,
    ajout:`<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/></svg>`
  };

  const activite = `
  <div class="card">
    <div class="card-head"><h3>Activité récente</h3></div>
    ${feed.length ? `<div class="feed">
      ${feed.slice(0,5).map(f => `
        <div class="feed-row">
          <span class="feed-icon ${f.kind}">${fi[f.kind]}</span>
          <div class="feed-body">
            <div>${f.who ? `<b>${esc(f.who)}</b> ${esc(f.title)}` : `<b>${esc(f.title)}</b>`}</div>
            <small>${esc(f.sub)}</small>
          </div>
          <time>${ago(f.t)}</time>
        </div>`).join("")}
    </div>` : `<div class="empty" style="padding:34px"><p style="margin:0">Rien à signaler.</p></div>`}
  </div>`;

  /* ---- Courbe du chiffre d'affaires ---- */
  const months = Array.from({length:12}, (_,i) => shiftMonth(i-11));
  const series = months.map(m => ({ m, v: monthStats(m).ca }));
  const maxV = Math.max(1, ...series.map(s => s.v));
  const W = 640, H = 196, PL = 40;
  const step = (W - PL - 14) / 11;
  const xAt = i => PL + i * step;
  const yAt = v => H - 28 - (v / maxV) * (H - 56);
  const pts  = series.map((s,i) => `${xAt(i).toFixed(1)},${yAt(s.v).toFixed(1)}`).join(" ");
  const area = `${PL},${H-28} ${pts} ${xAt(11).toFixed(1)},${H-28}`;

  /* Écart d'un mois sur l'autre, dans les mêmes mots que delta() ailleurs
     sur le tableau de bord — mais rendu en SVG, d'où la couleur portée par
     l'attribut plutôt que par une classe.
     Un mois à zéro est banal ici : diviser par lui donnerait un Infinity
     affiché tel quel, donc ce cas est nommé au lieu d'être calculé. */
  const ecart = i => {
    if (i === 0) return null;                       // aucun mois précédent
    const cur = series[i].v, prev = series[i-1].v;
    if (!prev) return cur
      ? { texte:"↗ nouveau", ton:"var(--accent)" }
      : { texte:"—",          ton:"var(--muted)" };
    const pct = Math.round((cur - prev) / prev * 100);
    if (pct === 0) return { texte:"→ stable", ton:"var(--muted)" };
    return pct > 0
      ? { texte:`↗ +${pct} %`, ton:"var(--accent)" }
      : { texte:`↘ ${pct} %`,  ton:"var(--red)" };
  };

  const moisLong = m => {
    const [y,mo] = m.split("-").map(Number);
    return new Date(y, mo-1, 1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  };

  const TW = 112, TH = 52;
  const tipX = i => Math.min(W - TW - 2, Math.max(2, xAt(i) - TW/2));
  const tipY = i => (yAt(series[i].v) - TH - 12 < 2) ? yAt(series[i].v) + 14 : yAt(series[i].v) - TH - 12;

  const courbe = `
  <div class="card">
    <div class="card-head"><h3>Évolution du chiffre d'affaires</h3>
      <span class="tag">12 derniers mois</span></div>
    <div style="padding:14px 18px 8px">
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
           aria-label="Chiffre d'affaires des douze derniers mois : ${
             series.map(s => `${monthShort(s.m)} ${eur(s.v)}`).join(", ")}">
        <defs><linearGradient id="caFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity=".3"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
        </linearGradient></defs>
        ${[0,0.5,1].map(f => `<line x1="${PL}" x2="${W-14}" y1="${yAt(maxV*f)}" y2="${yAt(maxV*f)}"
            stroke="var(--line-soft)"/>`).join("")}
        ${[0,0.5,1].map(f => `<text x="6" y="${yAt(maxV*f)+4}" class="ax">${(maxV*f/1000).toFixed(1)}K</text>`).join("")}
        <polygon class="ca-area" points="${area}" fill="url(#caFill)"/>
        <polyline class="ca-line" points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"
                  stroke-linejoin="round" stroke-linecap="round"/>
        ${series.map((s,i) => `<circle class="ca-dot" cx="${xAt(i)}" cy="${yAt(s.v)}" r="${i===11?4:2.5}"
            style="animation-delay:${(0.35 + i*0.075).toFixed(3)}s"
            fill="${i===11?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="1.6"/>`).join("")}
        ${series.map((s,i) => (i%2===0||i===11)
            ? `<text x="${xAt(i)}" y="${H-8}" class="ax mid">${monthShort(s.m)}</text>` : "").join("")}
        ${series.map((s,i) => {
          const e = ecart(i);
          /* La bande reste dans le cadre : le SVG déborde (overflow:visible),
             une bande à cheval capterait le survol hors de la carte. */
          const bx = Math.max(0, xAt(i) - step/2), bw = Math.min(W, xAt(i) + step/2) - bx;
          return `<g class="ca-slot">
          <rect class="ca-band" x="${bx.toFixed(1)}" y="0"
                width="${bw.toFixed(1)}" height="${H-20}"><title>${
                  esc(moisLong(s.m))} : ${esc(eur(s.v))}</title></rect>
          <circle class="ca-halo" cx="${xAt(i)}" cy="${yAt(s.v)}" r="9"/>
          <g class="ca-tip" transform="translate(${tipX(i).toFixed(1)},${tipY(i).toFixed(1)})">
            <rect class="ca-tip-box" x="0" y="0" width="${TW}" height="${TH}" rx="7"/>
            <text class="ca-tip-m" x="9" y="16">${esc(monthShort(s.m))}</text>
            <text class="ca-tip-v" x="9" y="32">${esc(eur(s.v))}</text>
            ${e ? `<text class="ca-tip-d" x="9" y="45" fill="${e.ton}">${esc(e.texte)}</text>` : ""}
          </g>
        </g>`;
        }).join("")}
      </svg>
    </div>
  </div>`;

  /* ---- Objectif du mois ---- */
  const goal  = state.goals.find(g => g.month === cur && g.created_by === viewer().id);
  const cible = Number(goal?.target_sales) || DEFAULT_MONTHLY_GOAL;
  const part  = cible ? Math.min(100, Math.round(now.ventes / cible * 100)) : 0;
  const R = 52, C = 2 * Math.PI * R;

  const objectif = `
  <div class="card">
    <div class="card-head"><h3>Objectif du mois</h3></div>
    <div class="goal-wrap">
      <svg viewBox="0 0 130 130" class="donut" role="img" aria-label="${part} pour cent de l'objectif atteint">
        <circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="13"/>
        <circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--accent)" stroke-width="13"
                stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}"
                stroke-dashoffset="${(C*(1-part/100)).toFixed(1)}" transform="rotate(-90 65 65)"/>
        <text x="65" y="72" class="donut-label">${part}&nbsp;%</text>
      </svg>
      <div class="goal-rows">
        <div><span>Objectif</span><b class="num">${cible} vente${cible>1?"s":""}</b></div>
        <div><span>Réalisé</span><b class="num">${now.ventes} vente${now.ventes>1?"s":""}</b></div>
        <div><span>Restant</span><b class="num" style="color:${now.ventes>=cible?"var(--accent)":"var(--text)"}">${Math.max(0,cible-now.ventes)} vente${Math.max(0,cible-now.ventes)>1?"s":""}</b></div>
      </div>
    </div>
    <button class="card-link" data-go="objectifs">Voir les objectifs
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>`;

  /* ---- Classement ----
     Toujours sur l'ensemble de l'entreprise (state.allProspects) : un
     classement d'équipe qui ne montrerait que sa propre ville n'aurait
     aucun sens et ferait apparaître les autres commerciaux à zéro. */
  const board = state.team.map(t => {
    const sold = state.allProspects.filter(p =>
      p.status === "conclu" && p.assigned_to === t.id && p.closed_at && monthKey(p.closed_at) === cur);
    return { t, n: sold.length, ca: sold.reduce((a,p) => a + Number(p.sale_amount||0), 0) };
  }).sort((a,b) => b.ca - a.ca);

  const classement = `
  <div class="card">
    <div class="card-head"><h3>Top commerciaux</h3><span class="tag">Ce mois-ci</span></div>
    <div class="board">
      ${board.map((r,i) => `
        <div class="board-row">
          <span class="rank">${i+1}</span>
          ${memberAvatar(r.t,"sm")}
          <div class="board-body"><b>${esc(r.t.full_name||"—")}</b>
            <small>${r.n} vente${r.n>1?"s":""}</small></div>
          <b class="num" style="color:${r.ca?"var(--accent)":"var(--muted)"}">${eur(r.ca)}</b>
        </div>`).join("")}
    </div>
    <button class="card-link" data-go="equipe">Voir les commissions
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>`;

  return `
  <div class="dash-head dash-center">
    <span></span>
    <div class="mark">N</div>
    <span class="date-pill">${new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}</span>
  </div>
  ${kpis}
  <div class="grid-2">${taches}${activite}</div>
  <div class="grid-3 wide-first">${courbe}${objectif}${classement}</div>`;
}

/* =========================================================
   Vue : Messages
   ========================================================= */

const QUICK_EMOJI = ["👍","❤️","🎉","🔥","😄","🙏","👀","✅"];
const PICKER_EMOJI = [
  "👍","👎","❤️","🎉","🔥","😄","😅","🙏","👀","✅","❌","💪",
  "🚀","💡","⚠️","📞","📧","💰","🍕","☕","😴","🤝"
];

/* Messages non lus, hors les siens. */
function unreadCount(){
  // En aperçu, la date de lecture du collègue n'est pas lisible :
  // compter les non-lus afficherait tout le fil comme neuf.
  if (state.viewAs) return 0;
  const who = viewer();
  const since = who?.chat_read_at;
  return (state.messages || []).filter(m =>
    m.user_id !== who.id && (!since || m.created_at > since)).length;
}

/* Sépare les jours dans le fil. */
function dayLabel(ts){
  const d = new Date(ts), t = new Date();
  const same = (a,b) => a.toDateString() === b.toDateString();
  if (same(d,t)) return "Aujourd'hui";
  const y = new Date(t); y.setDate(y.getDate()-1);
  if (same(d,y)) return "Hier";
  return cap(d.toLocaleDateString("fr-FR",{ weekday:"long", day:"numeric", month:"long" }));
}

const fileSize = n => n < 1024 ? n + " o"
  : n < 1048576 ? Math.round(n/1024) + " Ko"
  : (n/1048576).toFixed(1) + " Mo";

/* Met en valeur les mentions dans le corps du message. */
function renderBody(text){
  const names = state.team.map(t => t.full_name).filter(Boolean)
    .sort((a,b) => b.length - a.length);
  let out = esc(text);
  names.forEach(n => {
    out = out.split("@" + esc(n)).join(`<mark class="mention">@${esc(n)}</mark>`);
  });
  return out.replace(/\n/g,"<br>");
}

/* Messagerie suspendue le temps d'une mise à jour. Repasser à false rétablit
   le fil : tout son code reste intact juste en dessous. */
const CHAT_MAINTENANCE = true;

function viewMessages(){
  if (CHAT_MAINTENANCE) return `
  <div class="page-head"><h2>Messages</h2></div>
  <div class="card">
    <div class="empty">
      <h4>Page en cours de maintenance</h4>
      <p>La messagerie d'équipe est momentanément indisponible.<br>Elle revient très vite.</p>
    </div>
  </div>`;

  const msgs = [...(state.messages || [])].sort((a,b) => a.created_at.localeCompare(b.created_at));
  const moi = viewer();
  const since = state.viewAs ? null : moi?.chat_read_at;
  const firstUnread = state.viewAs ? null
    : msgs.find(m => m.user_id !== moi.id && (!since || m.created_at > since));

  let lastDay = "", lastAuthor = "", lastTime = 0;
  const thread = msgs.map(m => {
    const author = state.team.find(t => t.id === m.user_id);
    const own = m.user_id === moi.id;
    const day = dayLabel(m.created_at);
    const t = new Date(m.created_at).getTime();
    const hhmm = new Date(m.created_at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});

    let sep = "";
    if (day !== lastDay){ sep = `<div class="chat-day"><span>${esc(day)}</span></div>`; lastDay = day; lastAuthor = ""; }
    if (firstUnread && m.id === firstUnread.id)
      sep += `<div class="chat-day new"><span>Nouveaux messages</span></div>`;

    const grouped = m.user_id === lastAuthor && (t - lastTime) < 5*60000 && !sep;
    lastAuthor = m.user_id; lastTime = t;

    // Réactions, regroupées par emoji
    const mine = new Set();
    const tally = {};
    (state.reactions || []).filter(r => r.message_id === m.id).forEach(r => {
      tally[r.emoji] = (tally[r.emoji] || 0) + 1;
      if (r.user_id === moi.id) mine.add(r.emoji);
    });
    const reactions = Object.keys(tally).length ? `
      <div class="reacts">
        ${Object.entries(tally).map(([e,n]) => `
          <button class="react ${mine.has(e)?"on":""}" data-react="${m.id}" data-emoji="${e}"
            title="${n} réaction${n>1?"s":""}">${e}<span>${n}</span></button>`).join("")}
      </div>` : "";

    const linked = m.prospect_id
      ? (state.allProspects.find(p => p.id === m.prospect_id) || state.prospects.find(p => p.id === m.prospect_id))
      : null;

    const card = linked ? `
      <div class="msg-card">
        <span class="msg-card-icon">
          <svg viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-6h6v6"/></svg>
        </span>
        <div class="msg-card-body">
          <b>${esc(linked.company_name)}</b>
          <small>${linked.status === "conclu"
            ? `Client · ${eur(linked.sale_amount)}${Number(linked.recurring_amount)?` · ${eur(MAINTENANCE_FEE)}/mois`:""}`
            : `${statusLabel(linked.status)}${linked.city?` · ${esc(linked.city)}`:""}`}</small>
        </div>
        <button class="ihb ihb-ghost ihb-mini" data-open="${linked.id}"><span class="ihb-label">
          ${linked.status === "conclu" ? "Ouvrir le client" : "Ouvrir la fiche"}</span><span class="ihb-fly"><span>${linked.status === "conclu" ? "Ouvrir le client" : "Ouvrir la fiche"}</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button>
      </div>` : "";

    const file = m.attachment_path ? `
      <button class="msg-file" data-file="${esc(m.attachment_path)}" data-fname="${esc(m.attachment_name||"fichier")}">
        <span class="msg-file-icon">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        </span>
        <span class="msg-file-body">
          <b>${esc(m.attachment_name || "Fichier")}</b>
          <small>${m.attachment_size ? fileSize(m.attachment_size) : "Télécharger"}</small>
        </span>
        <svg class="msg-file-dl" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 12l5 5 5-5"/><path d="M4 21h16"/></svg>
      </button>` : "";

    return sep + `
    <div class="chat-msg ${own?"own":""} ${grouped?"grouped":""}">
      <div class="msg-side">${grouped ? "" : memberAvatar(author,"sm")}</div>
      <div class="msg-main">
        ${grouped ? "" : `<div class="msg-meta">
          <b>${esc(own ? "Vous" : (author?.full_name || "Membre retiré"))}</b>
          <time>${hhmm}</time>
        </div>`}
        <div class="bubble">
          ${m.body ? `<p>${renderBody(m.body)}</p>` : ""}
          ${card}${file}
          <div class="bubble-tools">
            <button class="bt" data-quickreact="${m.id}" aria-label="Réagir">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/><circle cx="9" cy="10" r=".8" fill="currentColor"/><circle cx="15" cy="10" r=".8" fill="currentColor"/></svg>
            </button>
            ${(own || isAdmin()) ? `<button class="bt" data-delmsg="${m.id}" aria-label="Supprimer">
              <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg>
            </button>` : ""}
          </div>
        </div>
        ${reactions}
      </div>
    </div>`;
  }).join("");

  const online = state.team.filter(t =>
    isOnline(t) && !(t.invisible && !isAdmin() && t.id !== viewer().id)).length;
  const linkable = state.prospects.slice()
    .sort((a,b) => a.company_name.localeCompare(b.company_name,"fr"));

  return `
  <div class="chat-head">
    <div class="chat-title">
      <h2>Messages</h2>
      <p><span class="hash">#</span> Canal commun à toute l'équipe. Tout le monde voit tout.</p>
    </div>
    <span class="online-pill"><i></i>${online} en ligne</span>
    <button class="round-btn ${state.chatMuted?"muted":""}" id="chatMute"
      title="${state.chatMuted?"Réactiver les notifications":"Couper les notifications"}" aria-label="Notifications">
      ${state.chatMuted
        ? `<svg viewBox="0 0 24 24"><path d="M8.7 3.7A6 6 0 0 1 18 9c0 5 2 6 2 6H7"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/><path d="M3 3l18 18"/></svg>`
        : `<svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 7-3 7h18s-3 0-3-7"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg>`}
    </button>
    ${isAdmin() ? `<button class="round-btn" id="chatExport" title="Exporter la conversation" aria-label="Exporter">
      <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 12l5 5 5-5"/><path d="M4 21h16"/></svg>
    </button>` : ""}
  </div>

  <div class="chat-shell">
    <div class="chat-scroll" id="chatScroll">
      ${msgs.length ? thread : `<div class="empty" style="padding:70px 20px">
        <h4>Aucun message</h4>
        <p>Lancez la conversation : c'est ici que l'équipe se coordonne.</p></div>`}
    </div>

    <div class="composer ${state.viewAs?"locked":""}">
      <div class="composer-box">
        <textarea id="chatInput" rows="1" placeholder="Écrivez votre message…"
          ${state.viewAs ? "disabled" : ""}></textarea>
        <p class="composer-hint">↵ Entrée pour envoyer, Maj+Entrée pour aller à la ligne</p>
      </div>
      <div id="chatFileTag" class="file-tag hidden"></div>
      <div class="composer-row">
        <button class="ihb ihb-ghost ihb-mini" id="chatAttach" ${state.viewAs?"disabled":""}><span class="ihb-label">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M21 12l-9 9a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/></svg>
          Joindre un fichier

/* Petit sélecteur flottant, utilisé pour les emoji et les mentions. */
function popover(anchor, items, onPick){
  const pop = $("#pop");
  const r = anchor.getBoundingClientRect();
  pop.innerHTML = `<div class="pop-back"></div>
    <div class="pop" style="left:${Math.max(12, Math.min(r.left, innerWidth-260))}px;
      top:${r.top - 12}px">${items}</div>`;
  pop.querySelector(".pop-back").onclick = () => { pop.innerHTML = ""; };
  pop.querySelectorAll("[data-pick]").forEach(el => el.onclick = () => {
    onPick(el.dataset.pick); pop.innerHTML = "";
  });
}

/* ---------- Vue : Administrateur ----------
   Réservée à l'admin. Le serveur applique la même règle : un commercial
   ne peut lire que ses propres sessions. */
function viewAdmin(){
  if (!isAdmin()) return `<div class="page-head"><h2>Administrateur</h2></div>
    <div class="card"><div class="empty"><h4>Accès réservé</h4>
      <p>Cette page est visible par l'administrateur uniquement.</p></div></div>`;

  const sess = state.sessions || [];
  const since = Date.now() - 7*864e5;
  const week = sess.filter(s => new Date(s.started_at).getTime() >= since);

  const minutes = s => Math.max(1, Math.round((new Date(s.last_ping_at) - new Date(s.started_at)) / 60000));
  const fmtDur = min => min >= 60 ? `${Math.floor(min/60)} h ${String(min%60).padStart(2,"0")}` : `${min} min`;

  const rows = state.team.map(t => {
    const mine = week.filter(s => s.user_id === t.id);
    const total = mine.reduce((a,s) => a + minutes(s), 0);
    const last = sess.find(s => s.user_id === t.id);
    const acts = state.allProspects.filter(p => p.assigned_to === t.id);
    const sales = acts.filter(p => p.status === "conclu");
    return { t, sessions:mine.length, total, last, touched:acts.length, sales:sales.length,
             ca: sales.reduce((a,p) => a + Number(p.sale_amount||0), 0) };
  }).sort((a,b) => b.total - a.total);

  const totalMin = rows.reduce((a,r) => a + r.total, 0);
  const online = state.team.filter(t =>
    isOnline(t) && !(t.invisible && !isAdmin() && t.id !== viewer().id)).length;

  return `
  <div class="page-head"><h2>Administrateur</h2>
    ${(state.applications||[]).filter(c => c.status === "en_attente").length
      ? `<button class="ihb ihb-ghost" data-go="inscriptions"><span class="ihb-label">${(state.applications||[]).filter(c => c.status === "en_attente").length} dossier${(state.applications||[]).filter(c => c.status === "en_attente").length>1?"s":""} à traiter</span><span class="ihb-fly"><span>Voir les inscriptions</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button>`
      : ""}
    <button class="ihb ihb-ghost" id="expActivity"><span class="ihb-label">Exporter l'activité</span><span class="ihb-fly"><span>Exporter l'activité</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button></div>

  <div class="card">
    <div class="stats">
      <div class="stat"><div class="k">En ligne maintenant</div><div class="v">${online}</div><div class="d">sur ${state.team.length} membre${state.team.length>1?"s":""}</div></div>
      <div class="stat"><div class="k">Temps cumulé (7 j)</div><div class="v">${fmtDur(totalMin)}</div><div class="d">toute l'équipe</div></div>
      <div class="stat"><div class="k">Connexions (7 j)</div><div class="v">${week.length}</div><div class="d">sessions ouvertes</div></div>
      <div class="stat"><div class="k">Session moyenne</div><div class="v">${week.length?fmtDur(Math.round(totalMin/week.length)):"—"}</div><div class="d">par connexion</div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>Activité par commercial</h3><span class="tag">7 derniers jours</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Membre</th><th class="opt-sm">Présence</th><th>Temps passé</th><th class="opt-lg">Sessions</th><th class="opt-md">Portefeuille</th><th class="opt-md">Ventes</th><th class="opt-sm">CA</th><th></th></tr></thead>
      <tbody>${rows.map(r => `
        <tr>
          <td><div class="cell-name">${memberAvatar(r.t,"sm")}
            <div><b>${esc(r.t.full_name||"—")}</b>
              <small>${r.last ? "Dernière connexion " + dateTimeFR(r.last.started_at) : "Jamais connecté"}</small></div></div></td>
          <td class="opt-sm">${presenceHTML(r.t)}</td>
          <td class="num"><b>${r.total ? fmtDur(r.total) : `<span class="dim">—</span>`}</b></td>
          <td class="num opt-lg">${r.sessions || `<span class="dim">0</span>`}</td>
          <td class="num opt-md">${r.touched}</td>
          <td class="num opt-md">${r.sales}</td>
          <td class="num opt-sm">${eur(r.ca)}</td>
          <td style="text-align:right">${r.t.id !== viewer().id
            ? `<button class="ihb ihb-ghost ihb-mini" data-viewas="${r.t.id}"><span class="ihb-label">Voir son espace</span><span class="ihb-fly"><span>Voir son espace</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button>`
            : `<span class="dim" style="font-size:12.5px">Vous</span>`}</td>
        </tr>`).join("")}
      </tbody>
    </table></div>
    <div class="tbl-foot">Le temps est mesuré entre l'ouverture de la session et le dernier signe d'activité, pas sur l'onglet laissé ouvert.
      « Voir son espace » ouvre l'application telle que ce commercial la voit, en lecture seule.</div>
  </div>

  <div class="card">
    <div class="card-head"><h3>Historique de connexion</h3></div>
    ${sess.length ? `
    <div class="tbl-wrap"><table>
      <thead><tr><th>Membre</th><th>Début</th><th>Durée</th><th>Appareil</th></tr></thead>
      <tbody>${sess.slice(0,25).map(s => {
        const t = state.team.find(x => x.id === s.user_id);
        return `<tr>
          <td><div class="cell-name">${memberAvatar(t,"sm")}<span>${esc(t?.full_name||"—")}</span></div></td>
          <td class="num">${dateTimeFR(s.started_at)}</td>
          <td class="num">${fmtDur(minutes(s))}</td>
          <td class="dim">${esc((s.user_agent||"—").slice(0,44))}</td>

    </table></div>
    <div class="tbl-foot">${sess.length} session${sess.length>1?"s":""} enregistrée${sess.length>1?"s":""}${sess.length>25?" · 25 plus récentes affichées":""}</div>`
    : `<div class="empty"><p style="margin:0">Aucune connexion enregistrée pour l'instant.</p></div>`}
  </div>`;
}

/* ---------- Vue : Inscriptions ----------
   La file des dossiers déposés depuis l'écran public. L'administrateur y
   lit les pièces, accepte (le compte commercial est créé dans la foulée)
   ou refuse en motivant. Rien n'est supprimé automatiquement : un dossier
   refusé reste consultable tant qu'on ne l'efface pas. */

const CAND_STATUTS = [
  ["en_attente", "En attente", "attente"],
  ["accepte",    "Accepté",    "conclu"],
  ["refuse",     "Refusé",     "refuse"]
];
const candLabel = k => (CAND_STATUTS.find(s => s[0] === k) || CAND_STATUTS[0])[1];
const candPill  = k => (CAND_STATUTS.find(s => s[0] === k) || CAND_STATUTS[0])[2];
const candNom   = c => [c.prenom, c.nom].filter(Boolean).join(" ").trim() || c.email || "Dossier sans nom";
/* La ville est déduite de l'adresse saisie : dernier segment après la virgule. */
const candVille = c => {
  const parts = String(c.adresse || "").split(",").map(x => x.trim()).filter(Boolean);
  return parts.length ? parts[parts.length - 1] : "";
};
const candPieces = c => (c.justificatif_name ? 1 : 0) + (c.rib_name ? 1 : 0);
/* Ancienneté d'un dossier, en jours pleins. */
const candJours = c => Math.floor((Date.now() - new Date(c.created_at)) / 864e5);

function candidatures(){
  return (state.applications || []).slice().sort((a,b) => {
    // Les dossiers en attente d'abord : c'est la seule pile qui demande une action.
    const pa = a.status === "en_attente" ? 0 : 1, pb = b.status === "en_attente" ? 0 : 1;
    return pa !== pb ? pa - pb : String(b.created_at).localeCompare(String(a.created_at));
  });
}

function viewInscriptions(){
  if (!isAdmin()) return `<div class="page-head"><h2>Inscriptions</h2></div>
    <div class="card"><div class="empty"><h4>Accès réservé</h4>
      <p>Les dossiers d'inscription ne sont consultables que par l'administrateur.</p></div></div>`;

  const all = candidatures();
  const attente  = all.filter(c => c.status === "en_attente");
  const acceptes = all.filter(c => c.status === "accepte");
  const refuses  = all.filter(c => c.status === "refuse");

  // Délai moyen de traitement, calculé sur les seuls dossiers déjà tranchés.
  const traites = all.filter(c => c.reviewed_at);
  const heures = traites.length
    ? Math.round(traites.reduce((a,c) => a + (new Date(c.reviewed_at) - new Date(c.created_at)), 0)
        / traites.length / 3600000)
    : null;
  const delai = heures === null ? "—"
              : heures < 1  ? "< 1 h"
              : heures >= 48 ? `${Math.round(heures/24)} j`
              : `${heures} h`;

  const vieux = attente.filter(c => candJours(c) >= 3).length;
  const liste = state.filterCand ? all.filter(c => c.status === state.filterCand) : all;

  return `
  <div class="page-head"><h2>Inscriptions</h2>
    ${all.length ? `<button class="ihb ihb-ghost" id="expCand"><span class="ihb-label">Exporter en CSV</span><span class="ihb-fly"><span>Exporter en CSV</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button>` : ""}</div>

  <div class="card">
    <div class="stats">
      <div class="stat"><div class="k">En attente</div><div class="v">${attente.length}</div>
        <div class="d">${vieux ? `${vieux} depuis plus de 3 jours` : "aucun dossier en retard"}</div></div>
      <div class="stat"><div class="k">Acceptés</div><div class="v">${acceptes.length}</div>
        <div class="d">comptes créés</div></div>
      <div class="stat"><div class="k">Refusés</div><div class="v">${refuses.length}</div>
        <div class="d">dossiers écartés</div></div>
      <div class="stat"><div class="k">Délai moyen</div><div class="v">${delai}</div>
        <div class="d">entre dépôt et décision</div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>Dossiers reçus</h3>
      <select class="select" id="fCand" style="max-width:220px" aria-label="Filtrer par statut">
        <option value="">Tous les dossiers (${all.length})</option>
        ${CAND_STATUTS.map(([k,label]) =>
          `<option value="${k}" ${state.filterCand===k?"selected":""}>${label} (${all.filter(c=>c.status===k).length})</option>`).join("")}
      </select>
    </div>

    ${liste.length ? `
    <div class="tbl-wrap"><table>
      <thead><tr><th>Candidat</th><th class="opt-md">Déposé le</th><th class="opt-lg">Ville</th>
        <th class="opt-lg">SIRET</th><th class="opt-md">Pièces</th><th>Statut</th><th></th></tr></thead>
      <tbody>${liste.map(c => {
        const jours = candJours(c);
        const retard = c.status === "en_attente" && jours >= 3;
        const pieces = candPieces(c);
        return `<tr data-candrow="${c.id}">
          <td><div class="cell-name"><div class="avatar sm">${esc(initials(candNom(c)))}</div>
            <div><b>${esc(candNom(c))}</b><small>${esc(c.email||"—")}</small></div></div></td>
          <td class="num opt-md">${dateTimeFR(c.created_at)}
            ${retard ? `<span class="tag warn" style="margin-left:6px">${jours} j</span>` : ""}</td>
          <td class="opt-lg">${candVille(c) ? esc(candVille(c)) : `<span class="dim">—</span>`}</td>
          <td class="num opt-lg">${esc(c.siret||"—")}</td>
          <td class="opt-md">${pieces === 2
            ? `<span class="tag">2 / 2</span>`
            : `<span class="tag warn">${pieces} / 2</span>`}</td>
          <td><span class="pill ${candPill(c.status)}">${candLabel(c.status)}</span></td>
          <td style="text-align:right;white-space:nowrap">
            ${c.status === "en_attente" ? `
            <button class="ihb ihb-ghost ihb-mini" data-cand-no="${c.id}"><span class="ihb-label">Refuser</span><span class="ihb-fly"><span>Refuser</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button>
            <button class="ihb ihb-mini" data-cand-ok="${c.id}"><span class="ihb-label">Accepter</span><span class="ihb-fly"><span>Accepter</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button>`
            : `<button class="ihb ihb-ghost ihb-mini" data-cand="${c.id}"><span class="ihb-label">Ouvrir</span><span class="ihb-fly"><span>Ouvrir</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button>`}
          </td>
        </tr>`;
      }).join("")}</tbody>
    </table></div>
    <div class="tbl-foot">${liste.length} dossier${liste.length>1?"s":""} affiché${liste.length>1?"s":""}${
      state.filterCand ? ` sur ${all.length}` : ""} · Cliquez une ligne pour lire le détail et les pièces.
      Accepter un dossier crée le compte commercial et lui ouvre l'accès à Norya.</div>`
    : `<div class="empty"><h4>${state.filterCand ? "Aucun dossier dans ce statut" : "Aucune demande d'inscription"}</h4>
        <p>${state.filterCand
          ? "Changez de filtre pour voir les autres dossiers."
          : "Les dossiers déposés depuis l'écran d'inscription apparaîtront ici."}</p></div>`}
  </div>`;
}

/* Fiche complète d'un dossier : tout ce que le candidat a déclaré,
   plus la décision déjà prise le cas échéant. */
function candidatureDetail(id){
  const c = (state.applications || []).find(x => x.id === id);
  if (!c){ toast("Dossier introuvable.", "err"); return; }

  const piece = (nom, libelle) => nom
    ? `<span class="cand-piece"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>${esc(libelle)} · ${esc(nom)}</span>`
    : `<span class="cand-piece manquant"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>${esc(libelle)} manquant</span>`;

  const decideur = state.team.find(t => t.id === c.reviewed_by);
  const ligne = (dt, dd) => `<dt>${dt}</dt><dd>${dd}</dd>`;

  const m = modal({
    wide: true,
    title: candNom(c),
    body: `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
        <span class="pill ${candPill(c.status)}">${candLabel(c.status)}</span>
        <span class="dim" style="font-size:12.5px">Déposé le ${dateTimeFR(c.created_at)}</span>
      </div>

      <dl class="cand-def">
        ${ligne("Nom complet", esc(candNom(c)))}
        ${ligne("E-mail", `<a href="mailto:${esc(c.email||"")}" style="color:var(--accent)">${esc(c.email||"—")}</a>`)}
        ${ligne("Téléphone", esc(c.telephone||"—"))}
        ${ligne("Adresse", esc(c.adresse||"—"))}
        ${ligne("SIRET", esc(c.siret||"—"))}
        ${ligne("Numéro RSAC", esc(c.rsac||"—"))}
        ${ligne("Mot de passe", c.password_set
          ? `Défini par le candidat · robustesse ${esc(PASS_LABELS[Math.min(c.password_score||0, PASS_LABELS.length-1)].toLowerCase())}`
          : `<span class="dim">Non renseigné</span>`)}
      </dl>

      <div class="cand-sep"></div>
      <div style="font-size:12.5px;color:var(--muted)">Pièces jointes</div>
      <div class="cand-pieces">
        ${piece(c.justificatif_name, "Justificatif d'immatriculation")}
        ${piece(c.rib_name, "RIB")}
      </div>
      <p class="dim" style="font-size:11.5px;margin:10px 0 0">
        Maquette : les fichiers ne sont pas transmis, seul leur nom est conservé.</p>

      ${c.reviewed_at ? `
      <div class="cand-sep"></div>
      <dl class="cand-def">
        ${ligne("Décision", `${candLabel(c.status)} le ${dateTimeFR(c.reviewed_at)}`)}
        ${ligne("Par", esc(decideur ? (decideur.full_name || decideur.email) : "—"))}
        ${c.note ? ligne("Motif", esc(c.note)) : ""}
      </dl>` : ""}
    `,
    footer: `
      <button class="ihb ihb-ghost" id="candDel"><span class="ihb-label">Supprimer</span><span class="ihb-fly"><span>Supprimer</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button>
      ${c.status === "en_attente" ? `
      <button class="ihb ihb-ghost" id="candNo"><span class="ihb-label">Refuser</span><span class="ihb-fly"><span>Refuser</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button>
      <button class="ihb" id="candOk"><span class="ihb-label">Accepter le dossier</span><span class="ihb-fly"><span>Accepter le dossier</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button>`
      : `<button class="ihb" id="candBack"><span class="ihb-label">Remettre en attente</span><span class="ihb-fly"><span>Remettre en attente</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button>`}`
  });

  m.querySelector("#candDel").onclick = () => supprimerCandidature(c.id);
  const ok = m.querySelector("#candOk");   if (ok) ok.onclick = () => accepterCandidature(c.id);
  const no = m.querySelector("#candNo");   if (no) no.onclick = () => refuserCandidature(c.id);
  const bk = m.querySelector("#candBack"); if (bk) bk.onclick = () => rouvrirCandidature(c.id);
}

/* Accepter, c'est ouvrir un compte : la ville et le taux de commission
   sont demandés ici plutôt que devinés en silence. */
function accepterCandidature(id){
  const c = (state.applications || []).find(x => x.id === id);
  if (!c) return;
  if (state.team.some(t => (t.email||"").toLowerCase() === (c.email||"").toLowerCase())){
    toast("Un compte utilise déjà cette adresse e-mail.", "err"); return;
  }

  const m = modal({
    title: "Accepter le dossier",
    body: `
      <p style="margin:0 0 16px;color:var(--text-2);font-size:13px;line-height:1.55">
        Un compte commercial va être créé pour <b>${esc(candNom(c))}</b> (${esc(c.email||"—")}).
        Le mot de passe choisi lors de l'inscription reste le sien.</p>
      <div class="grid2">
        <div class="field"><label for="ac_city">Ville / zone terrain</label>
          <input class="input" id="ac_city" value="${esc(candVille(c))}" placeholder="Rennes"></div>
        <div class="field"><label for="ac_rate">Commission (%)</label>
          <input class="input" id="ac_rate" type="number" min="0" max="100" step="1" value="${COMMERCIAL_RATE}"></div>
      </div>`,

/* Refuser en expliquant : le motif est facultatif mais fortement invité,
   c'est la seule trace qui restera de la décision. */
function refuserCandidature(id){
  const c = (state.applications || []).find(x => x.id === id);
  if (!c) return;

  const m = modal({
    title: "Refuser le dossier",
    body: `
      <p style="margin:0 0 16px;color:var(--text-2);font-size:13px;line-height:1.55">
        Le dossier de <b>${esc(candNom(c))}</b> sera marqué comme refusé.
        Aucun compte ne sera créé ; le dossier reste consultable.</p>
      <div class="field"><label for="re_note">Motif du refus</label>
        <textarea class="input" id="re_note" rows="3" placeholder="Justificatif illisible, SIRET introuvable…">${esc(c.note||"")}</textarea></div>`,
    footer: `<button class="ihb ihb-ghost" id="reNo"><span class="ihb-label">Annuler</span><span class="ihb-fly"><span>Annuler</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button>
             <button class="ihb ihb-danger" id="reYes"><span class="ihb-label">Refuser le dossier</span><span class="ihb-fly"><span>Refuser le dossier</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button>`
  });

  m.querySelector("#reNo").onclick = closeModal;
  m.querySelector("#reYes").onclick = async () => {
    const b = m.querySelector("#reYes"); b.disabled = true;
    try {

        status:"refuse", reviewed_at:new Date().toISOString(),
        reviewed_by:state.me.id, note: m.querySelector("#re_note").value.trim() || null
      });
      state.applications = await store.applications();

      b.disabled = false;
      toast("Échec : " + e.message, "err");

}

/* Une décision se corrige : le dossier repart dans la file, sans son motif. */
async function rouvrirCandidature(id){
  const c = (state.applications || []).find(x => x.id === id);
  if (!c) return;
  try {
    await store.updateApplication(id, { status:"en_attente", reviewed_at:null, reviewed_by:null, note:null });
    state.applications = await store.applications();
    closeModal(); render();
    toast(`Dossier de ${candNom(c)} remis en attente`);
  } catch (e) { toast("Échec : " + e.message, "err"); }
}

async function supprimerCandidature(id){
  const c = (state.applications || []).find(x => x.id === id);
  if (!c) return;
  if (!await confirmDialog(`Supprimer définitivement le dossier de ${candNom(c)} ? Les informations déclarées seront perdues.`)) return;
  try {
    await store.deleteApplication(id);
    state.applications = await store.applications();
    closeModal(); render();
    toast("Dossier supprimé");
  } catch (e) { toast("Échec : " + e.message, "err"); }
}

/* Une vente conclue mais non encaissée. */
const enAttente = p => p.status === "conclu" && !p.paid_at;

/* Commission due à un commercial sur ses ventes non encore encaissées. */
function gainEnAttente(userId){
  return state.allProspects
    .filter(p => enAttente(p) && (!userId || p.assigned_to === userId))
    .reduce((a,p) => a + commissionOf(p), 0);
}

/* Prochaine date de prélèvement à partir d'un jour du mois. */
function nextBilling(day){
  if (!day) return "—";
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth(), day);
  if (d < now) d.setMonth(d.getMonth() + 1);
  return d.toLocaleDateString("fr-FR",{ day:"numeric", month:"short" });
}

/* Ventes et commissions de chaque membre de l'équipe — TOUJOURS calculées
   sur l'ensemble de l'entreprise (state.allProspects), jamais sur le
   portefeuille visible du moment (state.prospects, limité à une ville).
   Cette fonction est l'unique source de vérité : l'affichage de la page
   Équipe et l'export CSV l'appellent tous les deux, pour qu'ils ne
   puissent jamais afficher des chiffres différents. */
function teamCommissionRows(){
  const conclus = state.allProspects.filter(p => p.status === "conclu");
  return state.team.map(t => {
    const mine = conclus.filter(p => p.assigned_to === t.id);
    const com  = mine.reduce((s,p) => s + commissionOf(p), 0);
    return { t, n:mine.length, com };
  }).sort((a,b) => b.com - a.com);
}

      <div class="theme-grid">
        ${Object.entries(THEMES).map(([key,t]) => `
          <button class="theme-swatch ${state.theme===key?"on":""}" data-theme="${key}" aria-label="Thème ${t.label}">
            <span class="theme-preview" style="background:linear-gradient(135deg, ${t.vars["--bg"]} 0%, ${t.vars["--surface-2"]} 45%, ${t.vars["--accent"]} 100%)">
              ${state.theme===key ? `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>` : ""}
            </span>
            <small>${t.label}</small>
          </button>`).join("")}
      </div>
    </div>
  </div>`;

  const donnees = !isAdmin() ? "" : `
  <div class="card">
    <div class="card-head"><h3>Importer des prospects</h3><span class="tag">Administrateur</span></div>
    <div style="padding:18px">
      <p style="margin:0 0 14px;color:var(--muted);font-size:13px">
        Fichier CSV avec une ligne d'en-tête. Colonnes reconnues :
        <code style="font-family:var(--mono);font-size:12px;color:var(--text-2)">nom, type, adresse, ville, telephone, email, note, site</code>.
        Les colonnes inconnues sont ignorées.
      </p>
      <input type="file" id="csvFile" accept=".csv,text/csv" class="input" style="padding:8px">
      <div id="csvPreview" style="margin-top:14px"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>Exporter</h3><span class="tag">Administrateur</span></div>
    <div style="padding:18px;display:flex;gap:9px;flex-wrap:wrap">
      <button class="ihb ihb-ghost" id="expProspects"><span class="ihb-label">Prospects (CSV)</span><span class="ihb-fly"><span>Prospects (CSV)</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button>
      <button class="ihb ihb-ghost" id="expJson"><span class="ihb-label">Sauvegarde complète (JSON)</span><span class="ihb-fly"><span>Sauvegarde complète (JSON)</span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span><span class="ihb-dot" aria-hidden="true"></span></button>
    </div>
  </div>`;

  return `<div class="page-head"><h2>Réglages</h2></div>${profil}${apparence}${donnees}`;
}

/* ---------- État du formulaire Réglages ----------
   Les interrupteurs « photo », « invisible » et « masquer mes ventes »
   s'enregistrent au clic ; « zone terrain » et les trois champs texte
   attendent le bouton. Deux modèles sous une apparence identique : on
   bascule, rien ne bouge à l'écran, et plus rien ne dit si c'est pris.
   D'où un état nommé — rien à enregistrer / en attente / enregistré. */
let reglagesTimer = null;
/* Saisie en cours, conservée hors du DOM : un interrupteur à effet immédiat
   déclenche render(), qui reconstruit le formulaire et jetterait sans un mot
   le nom ou la ville que l'on était en train de taper. */
let reglagesBrouillon = null;

const reglagesLu = () => ({
  full_name: $("#myName")?.value.trim() ?? "",
  email: $("#myEmail")?.value.trim() ?? "",
  current_city: $("#myCity")?.value.trim() ?? ""
});

/* La référence est l'état réellement enregistré, pas ce qu'affichait le DOM
   au dernier rendu : c'est la seule base juste quand un brouillon est remis
   en place après reconstruction. */
const reglagesEnregistre = () => {
  const me = viewer() || {};
  return {
    full_name: me.full_name || "",
    email: me.email || "",
    current_city: me.current_city || ""
  };
};

const reglagesModifie = () => {
  if (!$("#myName")) return false;
  const a = reglagesLu(), b = reglagesEnregistre();
  return Object.keys(b).some(k => a[k] !== b[k]);
};

function poserEtatReglages(etat, texte){
  const zone = $("#saveState"), txt = $("#saveStateTxt");
  if (!zone || !txt) return;
  zone.dataset.etat = etat;
  txt.textContent = texte;
}

/* Le bouton reste toujours cliquable : le désactiver le faisait passer pour
   cassé, d'autant que .ihb:disabled coupe aussi pointer-events. La mention
   à côté dit ce qu'il y a à enregistrer ; le bouton, lui, répond toujours. */
function majEtatReglages(){
  const btn = $("#saveMe");
  if (!btn) return;
  const modifie = reglagesModifie();
  if (modifie) poserEtatReglages("modifie", "Modifications non enregistrées");
  else if ($("#saveState")?.dataset.etat !== "enregistre")
    poserEtatReglages("propre", "Aucune modification");
}

/* render() reconstruit la vue : la confirmation se pose sur le DOM neuf,
   sinon elle disparaîtrait avec l'ancien bouton. */
function confirmerEnregistrement(texte){
  poserEtatReglages("enregistre", texte);
  clearTimeout(reglagesTimer);
  reglagesTimer = setTimeout(() => {
    if ($("#saveState")?.dataset.etat === "enregistre") majEtatReglages();
  }, 6000);
}

/* =========================================================
   8. Interactions
   ========================================================= */
function wire(){
  const editGoal = $("#editGoal");
  if (editGoal) editGoal.onclick = goalForm;
  const q = $("#q");
  if (q) q.oninput = e => {
    state.q = e.target.value; state.page = 1;
    const pos = e.target.selectionStart;
    render();
    const nq = $("#q"); if (nq){ nq.focus(); nq.setSelectionRange(pos,pos); }
  };
  const fs = $("#fStatus"); if (fs) fs.onchange = e => { state.filterStatus = e.target.value; state.page = 1; render(); };
  const fo = $("#fOwner");  if (fo) fo.onchange = e => { state.filterOwner  = e.target.value; state.page = 1; render(); };
  const cf = $("#clearF");  if (cf) cf.onclick  = () => { state.q=""; state.filterStatus=""; state.filterOwner=""; state.page=1; render(); };

  document.querySelectorAll("[data-sort]").forEach(el => el.onclick = () => {
    const c = el.dataset.sort;
    state.sort = { col:c, dir: state.sort.col === c && state.sort.dir === "asc" ? "desc" : "asc" };
    state.page = 1;
    render();
  });

  ["#add","#add2"].forEach(s => { const b = $(s); if (b) b.onclick = () => prospectForm(null); });

  document.querySelectorAll("[data-open]").forEach(el => el.onclick = e => {
    e.stopPropagation();
    prospectDetail(el.dataset.open);
  });

  document.querySelectorAll("[data-status]").forEach(el => {
    el.onclick = e => e.stopPropagation();
    el.onchange = e => applyStatus(el.dataset.status, e.target.value);
  });

  document.querySelectorAll("[data-claim]").forEach(el => el.onclick = async e => {
    e.stopPropagation();
    const id = el.dataset.claim, p = findProspect(id);
    /* findProspect fouille tout le portefeuille : ces deux gardes valent
       pour un identifiant qui ne serait pas venu de la liste affichée. */
    if (!isAdmin() && p.assigned_to && p.assigned_to !== state.me.id) {
      toast("Ce prospect est déjà pris en charge par un autre commercial.", "err"); return;
    }
    if (!isAdmin() && cityKey(p.city) !== cityKey(state.me.current_city)) {
      toast("Vous ne pouvez prendre que les prospects de votre ville actuelle.", "err"); return;
    }
    try {
      const up = await store.updateProspect(id, { assigned_to: state.me.id });
      Object.assign(p, up);
      toast(`${p.company_name} vous est assigné`);
      render();
    } catch (err) { toast("Échec : " + err.message, "err"); }
  });

  document.querySelectorAll("[data-edituser]").forEach(el =>
    el.onclick = () => userForm(el.dataset.edituser));



  /* ----- Messagerie ----- */
  const chatBox = $("#chatScroll");
  if (chatBox){
    chatBox.scrollTop = chatBox.scrollHeight;
    if (unreadCount() && !state.viewAs){
      store.markChatRead().then(() => {
        state.me.chat_read_at = new Date().toISOString();
        paintChatBadge();
      }).catch(() => {});
    }
  }

  const input = $("#chatInput");
  if (input){
    const grow = () => { input.style.height = "auto"; input.style.height = Math.min(150, input.scrollHeight) + "px"; };
    input.oninput = grow; grow();
    input.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendChat(); } };
    if (!state.viewAs) input.focus();
  }

  const send = $("#chatSend"); if (send) send.onclick = sendChat;

  // Pièce jointe
  const attach = $("#chatAttach"), fileIn = $("#chatFile"), tag = $("#chatFileTag");
  if (attach) attach.onclick = () => fileIn.click();
  if (fileIn) fileIn.onchange = () => {
    const f = fileIn.files[0];
    if (!f) return;
    if (f.size > 10*1024*1024){ toast("Fichier trop lourd (10 Mo maximum).", "err"); fileIn.value=""; return; }
    tag.className = "file-tag";
    tag.innerHTML = `<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      <span>${esc(f.name)}</span><small>${fileSize(f.size)}</small>
      <button id="dropFile" aria-label="Retirer">✕</button>`;
    $("#dropFile").onclick = () => { fileIn.value = ""; tag.className = "file-tag hidden"; };
  };

  // Emoji
  const eb = $("#emojiBtn");
  if (eb) eb.onclick = () => popover(eb,
    `<div class="emoji-grid">${PICKER_EMOJI.map(e =>
      `<button data-pick="${e}">${e}</button>`).join("")}</div>`,
    e => { input.value += e; input.focus(); });

  // Mention
  const mb = $("#mentionBtn");
  if (mb) mb.onclick = () => popover(mb,
    `<div class="pop-list">${state.team.filter(t => t.id !== viewer().id).map(t =>
      `<button data-pick="${esc(t.full_name||t.email)}">${memberAvatar(t,"sm")}
        <span>${esc(t.full_name||t.email)}</span></button>`).join("") ||
      `<p class="pop-empty">Personne d'autre dans l'équipe.</p>`}</div>`,
    n => { input.value += (input.value && !input.value.endsWith(" ") ? " " : "") + "@" + n + " "; input.focus(); });

  // Réactions
  document.querySelectorAll("[data-react]").forEach(el => el.onclick = () =>
    toggleReact(el.dataset.react, el.dataset.emoji));

  document.querySelectorAll("[data-quickreact]").forEach(el => el.onclick = () => popover(el,
    `<div class="emoji-grid">${QUICK_EMOJI.map(e => `<button data-pick="${e}">${e}</button>`).join("")}</div>`,
    e => toggleReact(el.dataset.quickreact, e)));

  // Téléchargement d'une pièce jointe
  document.querySelectorAll("[data-file]").forEach(el => el.onclick = async () => {
    try {
      const url = await store.fileUrl(el.dataset.file);
      const a = document.createElement("a");
      a.href = url; a.download = el.dataset.fname; a.target = "_blank";
      a.rel = "noopener"; a.click();
    } catch (e) { toast("Fichier indisponible : " + e.message, "err"); }
  });

  document.querySelectorAll("[data-delmsg]").forEach(el => el.onclick = async e => {
    e.stopPropagation();
    try {
      await store.deleteMessage(el.dataset.delmsg);
      state.messages = state.messages.filter(m => m.id !== el.dataset.delmsg);
      render();
    } catch (err) { toast("Échec : " + err.message, "err"); }
  });

  const mute = $("#chatMute");
  if (mute) mute.onclick = () => {
    state.chatMuted = !state.chatMuted;
    render();
    toast(state.chatMuted ? "Notifications coupées" : "Notifications réactivées");
  };

  const cx = $("#chatExport");
  if (cx) cx.onclick = () => {
    const lines = [...state.messages].sort((a,b) => a.created_at.localeCompare(b.created_at))
      .map(m => {
        const who = state.team.find(t => t.id === m.user_id);
        return [dateTimeFR(m.created_at), who?.full_name || "—", m.body || "",
                m.attachment_name || ""];
      });
    download("norya-messages.csv", toCSV(["Date","Auteur","Message","Fichier"], lines));
    toast("Conversation exportée");
  };

  document.querySelectorAll("[data-viewas]").forEach(el =>
    el.onclick = () => setViewAs(el.dataset.viewas));
  const exitVA = $("#exitViewAs");
  if (exitVA) exitVA.onclick = () => setViewAs(null);

  /* ----- Table interactive ----- */

  // Clic n'importe où sur la ligne : ouvre la fiche.
  // Les contrôles internes gardent leur propre comportement.
  document.querySelectorAll("tr[data-row]").forEach(tr => tr.onclick = e => {
    if (e.target.closest("input,select,button,a,label")) return;
    if (window.getSelection && String(window.getSelection())) return; // sélection de texte
    prospectDetail(tr.dataset.row);
  });

  // Cases à cocher
  document.querySelectorAll("[data-sel]").forEach(cb => cb.onchange = e => {
    e.stopPropagation();
    const id = cb.dataset.sel;
    cb.checked ? state.selected.add(id) : state.selected.delete(id);
    render();
  });

  document.querySelectorAll("[data-page]").forEach(el => el.onclick = () => {
    state.page = Number(el.dataset.page);
    render();
    document.querySelector(".tbl-wrap")?.scrollIntoView({ behavior:"smooth", block:"start" });
  });

  document.querySelectorAll("[data-pay]").forEach(el => el.onclick = async e => {
    e.stopPropagation();
    const id = el.dataset.pay, p = state.allProspects.find(x => x.id === id);
    if (!await confirmPay(p)) return;
    try {
      const up = await store.updateProspect(id, { paid_at: new Date().toISOString() });
      Object.assign(p, up);
      render();
      toast(`Paiement de ${p.company_name} confirmé`);
    } catch (err) { toast("Échec : " + err.message, "err"); }
  });

  const selAll = $("#selAll");
  if (selAll){
    if (selAll.dataset.mixed) selAll.indeterminate = true;
    selAll.onchange = () => {
      // La sélection globale ne concerne que la page affichée.
      const debut = (state.page - 1) * PAR_PAGE;
      const ids = visible().slice(debut, debut + PAR_PAGE).map(p => p.id);
      selAll.checked ? ids.forEach(i => state.selected.add(i))
                     : ids.forEach(i => state.selected.delete(i));
      render();
    };
  }

  document.querySelectorAll("[data-mail]").forEach(el => el.onclick = async e => {
    e.stopPropagation();
    const id = el.dataset.mail;
    try {
      await store.logAction(id, "email", "E-mail envoyé depuis la liste.");
      state.activities = await store.allActivities();
    } catch (err) { /* sans conséquence */ }
  });

  document.querySelectorAll("[data-win]").forEach(el => el.onclick = e => {
    e.stopPropagation(); closeSaleForm(el.dataset.win);
  });

  /* ----- Actions groupées ----- */
  const ids = () => [...state.selected];

  const bo = $("#bulkOwner");
  if (bo) bo.onchange = async e => {
    const v = e.target.value; if (!v) return;
    await bulkApply({ assigned_to: v === "none" ? null : v },
      v === "none" ? "Assignation retirée" : "Prospects assignés");
  };

  const bs = $("#bulkStatus");
  if (bs) bs.onchange = async e => {
    const v = e.target.value; if (!v) return;
    const patch = { status: v };
    if (v !== "a_contacter") patch.last_contact_at = new Date().toISOString();
    if (v === "a_contacter"){ patch.last_contact_at = null; }
    await bulkApply(patch, `Statut passé à « ${statusLabel(v)} »`);
  };

  const bx = $("#bulkExport");
  if (bx) bx.onclick = () => {
    const picked = state.prospects.filter(p => state.selected.has(p.id));
    download("norya-selection.csv", toCSV(
      ["Nom","Responsable","Type","Ville","Telephone","Email","Statut","Commercial","Montant"],
      picked.map(p => [p.company_name, p.contact_name||"", p.category||"", p.city||"",
        p.phone||"", p.email||"", statusLabel(p.status), nameOf(p.assigned_to)||"",
        p.sale_amount||0])));
    toast(`${picked.length} prospect${picked.length>1?"s":""} exporté${picked.length>1?"s":""}`);
  };

  const bd = $("#bulkDelete");
  if (bd) bd.onclick = async () => {
    const n = ids().length;
    if (!await confirmDialog(`Supprimer ${n} prospect${n>1?"s":""} ? Leur historique sera perdu.`)) return;
    try {
      for (const id of ids()) await store.deleteProspect(id);
      state.prospects = state.prospects.filter(p => !state.selected.has(p.id));
      state.selected.clear();
      render(); toast(`${n} prospect${n>1?"s":""} supprimé${n>1?"s":""}`);
    } catch (e) { toast("Échec : " + e.message, "err"); }
  };

  const bc = $("#bulkClear");
  if (bc) bc.onclick = () => { state.selected.clear(); render(); };

  document.querySelectorAll("[data-go]").forEach(el => el.onclick = () => goTo(el.dataset.go));

  document.querySelectorAll("[data-billing]").forEach(el =>
    el.onclick = e => { e.stopPropagation(); billingForm(el.dataset.billing); });

  /* ----- Profil ----- */
  const pick = $("#pickPhoto");
  if (pick) pick.onclick = () => $("#photoFile").click();

  const pf = $("#photoFile");
  if (pf) pf.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) { toast("Choisissez un fichier image.", "err"); return; }
    try {
      const url = await resizeImage(file, 256);
      await store.updateProfile(state.me.id, { avatar_url: url });
      state.me.avatar_url = url;
      const mine = state.team.find(t => t.id === state.me.id);
      if (mine) mine.avatar_url = url;
      paintMeAvatar(); render(); toast("Photo mise à jour");
    } catch (err) { toast("Échec : " + err.message, "err"); }
  };

  const drop = $("#dropPhoto");
  if (drop) drop.onclick = async () => {
    try {
      await store.updateProfile(state.me.id, { avatar_url: null });
      state.me.avatar_url = null;
      const mine = state.team.find(t => t.id === state.me.id);
      if (mine) mine.avatar_url = null;
      paintMeAvatar(); render(); toast("Photo retirée");
    } catch (err) { toast("Échec : " + err.message, "err"); }
  };

  const vis = $("#photoPublic");
  if (vis) {
    const flip = async () => {
      const on = vis.getAttribute("aria-checked") !== "true";
      try {
        await store.updateProfile(state.me.id, { avatar_public: on });
        state.me.avatar_public = on;
        const mine = state.team.find(t => t.id === state.me.id);
        if (mine) mine.avatar_public = on;
        render();
        toast(on ? "Votre photo est visible par l'équipe" : "Votre photo n'est visible que par vous");
      } catch (err) { toast("Échec : " + err.message, "err"); }
    };
    vis.onclick = flip;
    vis.onkeydown = e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); flip(); } };
  }

  const inv = $("#invisibleMode");
  if (inv) {
    const flipInv = async () => {
      const on = inv.getAttribute("aria-checked") !== "true";
      try {
        await store.updateProfile(state.me.id, { invisible: on });
        state.me.invisible = on;
        const mine = state.team.find(t => t.id === state.me.id);
        if (mine) mine.invisible = on;
        render();
        toast(on ? "Vous apparaissez hors ligne" : "Votre présence est de nouveau visible");
      } catch (err) { toast("Échec : " + err.message, "err"); }
    };
    inv.onclick = flipInv;
    inv.onkeydown = e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); flipInv(); } };
  }

  const hs = $("#hideSales");
  if (hs) {
    const flipHideSales = async () => {
      const on = hs.getAttribute("aria-checked") !== "true";
      try {
        await store.updateProfile(state.me.id, { hide_sales: on });
        state.me.hide_sales = on;
        const mine = state.team.find(t => t.id === state.me.id);
        if (mine) mine.hide_sales = on;
        render();
        toast(on ? "Vos ventes sont masquées pour les autres commerciaux" : "Vos ventes sont de nouveau visibles par les autres commerciaux");
      } catch (err) { toast("Échec : " + err.message, "err"); }
    };
    hs.onclick = flipHideSales;
    hs.onkeydown = e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); flipHideSales(); } };
  }

  // Sélecteur restreint aux pastilles : <html> porte aussi data-theme, et
  // s'y accrocher faisait remonter chaque clic de la page jusqu'ici.
  document.querySelectorAll(".theme-swatch[data-theme]").forEach(el => el.onclick = async () => {
    const key = el.dataset.theme;
    applyTheme(key);                 // aperçu immédiat, sans attendre le réseau
    render();
    try {
      await store.updateProfile(state.me.id, { theme: key });
      state.me.theme = key;
      const mine = state.team.find(t => t.id === state.me.id);
      if (mine) mine.theme = key;
    } catch (err) { toast("Le thème est appliqué mais n'a pas pu être enregistré : " + err.message, "err"); }
  });

  /* Cet interrupteur s'enregistre désormais au clic, comme les trois autres :
     il avait l'apparence des autres mais attendait le bouton, si bien qu'on
     le basculait et que rien ne se passait. */
  const cp = $("#cityPublic");
  if (cp) {
    const flipCityPublic = async () => {
      const on = cp.getAttribute("aria-checked") !== "true";
      try {
        await store.updateProfile(state.me.id, { current_city_public: on });
        state.me.current_city_public = on;
        const mine = state.team.find(t => t.id === state.me.id);
        if (mine) mine.current_city_public = on;
        render();
        toast(on ? "Votre zone terrain est visible par l'équipe" : "Votre zone terrain est masquée pour l'équipe");
      } catch (err) { toast("Échec : " + err.message, "err"); }
    };
    cp.onclick = flipCityPublic;
    cp.onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flipCityPublic(); } };
  }

  if ($("#saveMe")) {
    // Reprise du brouillon après une reconstruction due à un interrupteur.
    if (reglagesBrouillon) {
      for (const [sel, val] of Object.entries(reglagesBrouillon)) {
        const el = $(sel); if (el && val !== null) el.value = val;
      }
    }
    ["#myName", "#myEmail", "#myCity"].forEach(sel => {
      const el = $(sel);
      if (el) el.oninput = () => {
        reglagesBrouillon = { "#myName": $("#myName")?.value ?? null,
                              "#myEmail": $("#myEmail")?.value ?? null,
                              "#myCity": $("#myCity")?.value ?? null };
        majEtatReglages();
      };
    });
    majEtatReglages();
  }

  const sm = $("#saveMe"); if (sm) sm.onclick = async () => {
    const name  = $("#myName").value.trim();
    const email = $("#myEmail").value.trim();
    const current_city = $("#myCity").value.trim() || null;
    const cityPublicEl = $("#cityPublic");
    const current_city_public = cityPublicEl ? cityPublicEl.getAttribute("aria-checked") === "true" : state.me.current_city_public !== false;
    if (!name) { toast("Le nom ne peut pas être vide.", "err"); return; }
    sm.disabled = true;

/* Dévoilement du pied de page : la première fois qu'il entre dans le
   viewport, on lui ajoute .in-view et les transitions CSS font le reste. */
function mountFooter(){
  const footer = $(".site-footer");
  if (!footer) return;
  footer.classList.remove("in-view");

  const calme = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  if (calme || !("IntersectionObserver" in window)){
    footer.classList.add("in-view");
    return;
  }
  const io = new IntersectionObserver((entries, obs) => {
    entries.forEach(entry => {
      if (entry.isIntersecting){
        footer.classList.add("in-view");
        obs.disconnect();
      }
    });
  }, { threshold: .15 });
  io.observe(footer);
}

/* Redimensionne et compresse une image côté navigateur.
   Évite d'envoyer un fichier de 4 Mo en base. */
function resizeImage(file, size){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Lecture du fichier impossible"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Format d'image non reconnu"));
      img.onload = () => {
        const side = Math.min(img.width, img.height);
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const ctx = c.getContext("2d");
        ctx.drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, size, size);
        resolve(c.toDataURL("image/jpeg", 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Restreint le portefeuille visible au commercial concerné :
   — ses propres fiches, quoi qu'il arrive ;
   — la file d'attente de sa ville, c'est-à-dire les fiches sans
     propriétaire : sans elles, personne ne pourrait en prendre en charge.
   Les fiches déjà prises par un collègue et celles des autres villes
   n'apparaissent nulle part.

   Ses fiches restent visibles même hors de sa ville actuelle : le
   commercial peut changer de ville de rattachement, et ce changement ne
   doit pas escamoter son portefeuille ni ses chiffres. */
function applyScope(){
  const me = viewer();
  const maVille = cityKey(me.current_city);
  state.prospects = isAdmin()
    ? state.allProspects
    : state.allProspects.filter(p => p.assigned_to
        ? p.assigned_to === me.id
        : (cityKey(p.city) && cityKey(p.city) === maVille));
  // On ne garde en sélection que ce qui reste visible.
  [...state.selected].forEach(id => {
    if (!state.prospects.some(p => p.id === id)) state.selected.delete(id);
  });
}

/* Retrouve une fiche dans tout le portefeuille.
   Une fiche peut être affichée (client, message, rappel) sans appartenir
   au périmètre de ville du commercial : la chercher dans state.prospects
   seul faisait planter l'ouverture de ces fiches. */
function findProspect(id){
  return state.allProspects.find(p => p.id === id)
      || state.prospects.find(p => p.id === id)
      || null;
}

/* Reporte une mise à jour serveur dans l'état local.
   Les deux listes partagent les mêmes objets : une seule fusion suffit. */
function patchProspect(id, up){
  const p = findProspect(id);
  if (p) Object.assign(p, up);
  return p;
}

/* Change le libellé d'un bouton sans détruire sa structure interne :
   les boutons .ihb portent deux libellés (fixe et animé) plus une icône. */
function btnLabel(btn, text){
  if (!btn) return;
  const parts = btn.querySelectorAll(".ihb-label, .ihb-fly > span");
  if (parts.length) parts.forEach(el => el.textContent = text);
  else btn.textContent = text;
}

/* Applique la même modification à toute la sélection. */
async function bulkApply(patch, message){
  const ids = [...state.selected];
  if (!ids.length) return;
  try {
    for (const id of ids){
      const up = await store.updateProspect(id, patch);
      patchProspect(id, up);
    }
    state.activities = await store.allActivities().catch(() => state.activities);
    render();
    toast(`${message} · ${ids.length} fiche${ids.length>1?"s":""}`);
  } catch (e) {
    toast("Échec : " + e.message, "err");
    render();
  }
}

/* Envoie le message en cours de saisie. */
async function sendChat(){
  const input = $("#chatInput");
  const body = input.value.trim();
  const file = $("#chatFile")?.files[0] || null;
  if (!body && !file) return;

  const link = $("#chatLink")?.value || null;
  const send = $("#chatSend");
  input.value = ""; input.style.height = "auto";
  if (send){ send.disabled = true; btnLabel(send, "Envoi…"); }

  try {
    const m = await store.sendMessage(body, link, file);
    // Le direct renverra peut-être le même message : on évite le doublon.
    if (!state.messages.some(x => x.id === m.id)) state.messages.push(m);
    state.me.chat_read_at = new Date().toISOString();
    render();
  } catch (e) {
    input.value = body;
    toast("Message non envoyé : " + e.message, "err");
    if (send){ send.disabled = false; send.textContent = "Envoyer"; }
  }
}

/* Ajoute ou retire sa réaction. */
async function toggleReact(id, emoji){
  const has = (state.reactions || []).some(r =>
    r.message_id === id && r.user_id === state.me.id && r.emoji === emoji);
  try {
    await store.toggleReaction(id, emoji, !has);
    state.reactions = has
      ? state.reactions.filter(r => !(r.message_id===id && r.user_id===state.me.id && r.emoji===emoji))
      : [...state.reactions, { message_id:id, user_id:state.me.id, emoji }];
    render();
  } catch (e) { toast("Échec : " + e.message, "err"); }
}

/* Réception en direct des messages des collègues. */
function startChatStream(){
  try {
    store.onNewMessage(m => {
      if (state.messages.some(x => x.id === m.id)) return;
      state.messages.push(m);
      if (state.view === "messages"){
        render();
      } else {
        paintChatBadge();
        const who = state.team.find(t => t.id === m.user_id);
        if (m.user_id !== viewer().id && !state.chatMuted)
          toast(`${who?.full_name || "Un collègue"} : ${m.body.slice(0,60)}${m.body.length>60?"…":""}`);
      }
    }, async () => {
      try {
        state.reactions = await store.reactions();
        if (state.view === "messages") render();
      } catch { /* sans conséquence */ }
    });
  } catch { /* le chat reste consultable sans le direct */ }
}

/* ---------- Changement de statut ----------
   Un seul endroit décide de ce qui suit un changement de statut :
   qui prend le prospect, quand il a été contacté. */

async function applyStatus(id, val){
  const p = findProspect(id);
  if (!p) { toast("Fiche introuvable.", "err"); return; }

  // Une vente ne se déclare pas d'un simple clic : on confirme le montant.
  if (val === "conclu" && p.status !== "conclu"){ closeSaleForm(id); return; }

  const patch = { status: val };
  const notes = [];

  // Toute visite sur un prospect vaut prise en charge.
  if (!p.assigned_to && val !== "a_contacter"){
    patch.assigned_to = state.me.id;
    notes.push("assigné à vous");
  }
  if (val !== "a_contacter"){
    patch.last_contact_at = new Date().toISOString();
  }
  if (val === "a_contacter"){
    patch.last_contact_at = null;
  }

  try {
    const up = await store.updateProspect(id, patch);
    Object.assign(p, up);
    toast(`${statusLabel(val)}${notes.length ? " — " + notes.join(", ") : ""}`);
    render();
  } catch (err) {
    toast("Échec de la mise à jour : " + err.message, "err");
    render();
  }
}

  maint.onkeydown = e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); toggleMaint(); } };

  const del = m.querySelector("#del");
  if (del) del.onclick = async () => {
    if (!await confirmDialog(`Supprimer « ${p.company_name} » ? Son historique sera perdu.`)) return;
    try {
      await store.deleteProspect(id);
      state.prospects = state.prospects.filter(x => x.id !== id);
      closeModal(); render(); toast("Prospect supprimé");
    } catch (e) { toast("Échec : " + e.message, "err"); }
  };

  m.querySelector("#save").onclick = async () => {
    const name = m.querySelector("#f_name").value.trim();
    if (!name) { toast("Le nom de l'entreprise est obligatoire.", "err"); m.querySelector("#f_name").focus(); return; }
    const num = s => { const v = m.querySelector(s).value; return v === "" ? null : Number(v); };
    const txt = s => m.querySelector(s).value.trim() || null;
    const row = {
      company_name:name, category:txt("#f_cat"), city:txt("#f_city"), address:txt("#f_addr"),
      contact_name:txt("#f_contact"),
      website_url:txt("#f_url"), delivered_url:txt("#f_delivered"),
      phone:txt("#f_phone"), email:txt("#f_email"),
      google_rating:num("#f_rating"),
      website_quality:m.querySelector("#f_web").value || null,
      status:m.querySelector("#f_status").value,
      assigned_to:m.querySelector("#f_owner").value || null,
      last_contact_at:txt("#f_last"),
      sale_amount: isAdmin() ? (num("#f_amount") ?? 0) : (p.sale_amount ?? 0),
      recurring_amount: m.querySelector("#f_maint").getAttribute("aria-checked") === "true" ? MAINTENANCE_FEE : 0,
      notes:txt("#f_notes")
    };
    const btn = m.querySelector("#save"); btn.disabled = true; btnLabel(btn, "…");
    try {
      if (id) {
        const up = await store.updateProspect(id, row);
        patchProspect(id, up);
        toast("Prospect enregistré");
      } else {
        row.created_by = state.me.id;
        await store.createProspect(row);
        // On relit la liste plutôt que d'insérer à la main :
        // sinon le prospect apparaît deux fois.
        state.allProspects = await store.prospects();
        applyScope();
        toast("Prospect ajouté");
      }
      closeModal(); render();
    } catch (e) {
      toast("Échec : " + e.message, "err");
      btn.disabled = false; btnLabel(btn, id ? "Enregistrer" : "Ajouter");
    }
  };
}

/* ---------- Carte de localisation (MapLibre GL + géocodage OSM) ---------- */
async function initProspectMap(el, p){
  const status = txt => { el.innerHTML = `<div class="pmap-status">${esc(txt)}</div>`; };
  if (typeof maplibregl === "undefined") { status("Impossible de charger la carte."); return; }
  const query = [p.address, p.city].filter(Boolean).join(", ");
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`);
    const data = await res.json();
    if (!data.length) { status("Adresse introuvable sur la carte."); return; }
    const { lat, lon } = data[0];
    el.innerHTML = "";
    const map = new maplibregl.Map({
      container: el,
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [Number(lon), Number(lat)],
      zoom: 15,
      attributionControl: false
    });
    map.addControl(new maplibregl.AttributionControl({ compact: true }));
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
    map.scrollZoom.disable();
    const markerEl = document.createElement("div");
    markerEl.className = "pmap-pin";
    markerEl.innerHTML = `<div class="pmap-tooltip">${esc([p.company_name, p.city].filter(Boolean).join(" · "))}</div>`;
    new maplibregl.Marker({ element: markerEl }).setLngLat([Number(lon), Number(lat)]).addTo(map);
  } catch (e) {
    status("Carte indisponible (pas de connexion ?).");
  }
}
