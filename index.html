<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060806">
<title>Norya — Suivi de prospection</title>
<meta name="description" content="Suivi de prospection commerciale.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script defer src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* =========================================================
   Norya — Tokens
   ========================================================= */
:root{
  --bg:#060806;
  --surface:#0d100e;
  --surface-2:#121613;
  --surface-3:#181d1a;
  --line:#1e2521;
  --line-soft:#171d19;
  --text:#eef1ef;
  --text-2:#b9c2bd;
  --muted:#7e8b85;
  --accent:#24d97a;
  --accent-dim:#1aa85e;
  --accent-soft:rgba(36,217,122,.12);
  --amber:#e0a33a;
  --amber-soft:rgba(224,163,58,.13);
  --blue:#5a9bf5;
  --blue-soft:rgba(90,155,245,.13);
  --grey-soft:rgba(160,175,168,.11);
  --red:#f2605c;
  --violet:#a78bfa;
  --violet-soft:rgba(167,139,250,.15);
  --red-soft:rgba(242,96,92,.13);
  --r-sm:8px; --r-md:12px; --r-lg:18px;
  --sh:0 18px 46px -20px rgba(0,0,0,.85);
  --sans:"Inter","SF Pro Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;
  /* Nuée de particules du fond : recolorée automatiquement selon le thème choisi. */
  --glow:rgba(36,217,122,.35); --glow-2:rgba(36,217,122,.22);
  --glow-3:rgba(36,217,122,.25); --glow-soft:rgba(36,217,122,.045);
  --spark:rgba(255,255,255,.14); --spark-2:rgba(255,255,255,.10);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  transition:background-color .25s ease,color .25s ease;
}
/* Halo d'ambiance du fond */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 600px at 20% 0%,var(--glow-soft),transparent 70%),
    radial-gradient(700px 500px at 85% 100%,var(--glow-soft),transparent 70%);
}
/* Nuée de particules du fond : canvas animé, piloté par Sparkles (voir plus bas). */
#sparklesBg{
  position:fixed;inset:0;width:100%;height:100%;
  pointer-events:none;z-index:0;
  opacity:0;transition:opacity 1s ease;
}
#sparklesBg.on{opacity:1}
@media (prefers-reduced-motion:reduce){#sparklesBg{display:none}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-soft)}
.hidden{display:none !important}

/* Scrollbar */
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#222a26;border-radius:99px}
*::-webkit-scrollbar-thumb:hover{background:#2e3833}

/* =========================================================
   Tableau de bord
   ========================================================= */
.dash-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.dash-head h2{margin:0;font-size:27px;font-weight:600;letter-spacing:-.03em}
.dash-head p{margin:5px 0 0;color:var(--muted);font-size:13.5px}
.dash-head > div{flex:1;min-width:180px}
.dash-head.dash-center{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.dash-head.dash-center .date-pill{justify-self:end}
.date-pill{
  padding:8px 14px;border-radius:var(--r-sm);background:var(--surface);
  border:1px solid var(--line);font-size:13px;color:var(--text-2);white-space:nowrap;
}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi{
  display:flex;align-items:flex-start;gap:13px;padding:16px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--sh);
}
.kpi-icon{
  width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:var(--accent-soft);
}
.kpi-icon svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kpi-body{min-width:0}
.kpi-body .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi-body .v{font-size:24px;font-weight:600;letter-spacing:-.03em;margin:4px 0 5px;font-variant-numeric:tabular-nums}
.kpi-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px}
.kpi-foot .d{color:var(--muted)}
.kpi-foot .d.up{color:var(--accent)}
.kpi-foot .d.down{color:var(--red)}
.kpi-foot .vs{color:var(--muted);opacity:.75}

.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:20px;align-items:start}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px;align-items:start}
.grid-2 .card,.grid-2 .card + .card{margin-top:0}
.grid-3.wide-first{grid-template-columns:1.5fr 1fr 1fr}
.grid-3 .card{margin-top:0}
.grid-3 .card + .card{margin-top:0}


/* À faire */
.todo{padding:6px 0}
.todo-row{
  display:flex;align-items:center;gap:11px;padding:9px 18px;
  border-left:2px solid transparent;transition:background .13s;
}
.todo-row:hover{background:var(--surface-2)}
.todo-row.late{border-left-color:var(--red)}
.todo-row.soon{border-left-color:var(--amber)}
.todo-row.today{border-left-color:var(--accent)}
.todo-body{flex:1;min-width:0}
.todo-body b{display:block;font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-body small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.todo-body small.late{color:var(--red)}
.todo-body small.soon{color:var(--amber)}
.todo-body small.today{color:var(--accent)}
.todo-row .ihb{padding:5px 12px;font-size:12.5px;flex:none}

/* Fil d'activité */
.feed{padding:6px 18px 10px}
.feed-row{display:flex;align-items:center;gap:11px;padding:9px 0}
.feed-icon{
  width:29px;height:29px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--accent-soft);
}
.feed-icon svg{width:15px;height:15px;fill:none;stroke:var(--accent);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.feed-icon.ajout{background:var(--blue-soft)}
.feed-icon.ajout svg{stroke:var(--blue)}
.feed-icon.retard{background:var(--amber-soft)}
.feed-icon.retard svg{stroke:var(--amber)}
.feed-body{flex:1;min-width:0;font-size:13px}
.feed-body b{font-weight:500}
.feed-body small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed-row time{color:var(--muted);font-size:11.5px;white-space:nowrap;flex:none}

/* Lien de bas de carte */
.card-link{
  display:flex;align-items:center;gap:6px;width:100%;
  padding:12px 18px;border-top:1px solid var(--line-soft);
  color:var(--accent);font-size:13px;font-weight:500;transition:background .13s;
  border-radius:0 0 var(--r-lg) var(--r-lg);
}
.card-link:hover{background:var(--surface-2)}
.card-link svg{width:15px;height:15px;margin-left:auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Graphiques */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--sans)}
.chart .ax.mid{text-anchor:middle}

/* Courbe du chiffre d'affaires.
   Le trace se dessine, les points arrivent en cascade, et chaque mois
   porte son infobulle. Celle-ci vit dans le SVG : un simple selecteur
   de survol suffit, sans écouteur à rebrancher a chaque rendu. */
.ca-line{
  stroke-dasharray:2200;stroke-dashoffset:2200;
  animation:caDraw 1.4s cubic-bezier(.22,.8,.3,1) forwards;
}
@keyframes caDraw{to{stroke-dashoffset:0}}
.ca-area{opacity:0;animation:caFade .7s ease .45s forwards}
@keyframes caFade{to{opacity:1}}
.ca-dot{
  opacity:0;transform-box:fill-box;transform-origin:center;
  animation:caPop .42s cubic-bezier(.2,1.3,.4,1) forwards;
}
@keyframes caPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.ca-band{fill:transparent;cursor:pointer}
.ca-tip{pointer-events:none}
.ca-halo,.ca-tip{opacity:0;transition:opacity .15s ease}
.ca-slot:hover .ca-halo,.ca-slot:hover .ca-tip{opacity:1}
.ca-halo{fill:var(--accent);opacity:0}
.ca-slot:hover .ca-halo{opacity:.18}
.ca-tip-box{fill:var(--surface-3);stroke:var(--line)}
.ca-tip-m{fill:var(--muted);font-size:9.5px;font-family:var(--sans)}
.ca-tip-v{fill:var(--text);font-size:12.5px;font-weight:600;font-family:var(--sans)}
.ca-tip-d{font-size:10px;font-weight:600;font-family:var(--sans)}
@media (prefers-reduced-motion:reduce){
  .ca-line{animation:none;stroke-dashoffset:0}
  .ca-area,.ca-dot{animation:none;opacity:1}
}

.goal-wrap{display:flex;align-items:center;gap:18px;padding:18px}
.donut{width:118px;height:118px;flex:none}
.donut-label{
  fill:var(--text);font-size:23px;font-weight:600;text-anchor:middle;
  font-family:var(--sans);letter-spacing:-.03em;
}
.goal-rows{flex:1;min-width:0;display:flex;flex-direction:column;gap:11px}
.goal-rows > div{display:flex;flex-direction:column;gap:2px}
.goal-rows span{font-size:11.5px;color:var(--muted)}
.goal-rows b{font-size:16px;font-weight:600;letter-spacing:-.02em}
.goal-rows b.soft{font-size:13px;font-weight:400;color:var(--muted);white-space:normal;line-height:1.4}

/* Classement */
.board{padding:6px 18px 10px}
.board-row{display:flex;align-items:center;gap:11px;padding:10px 0}
.board-row + .board-row{border-top:1px solid var(--line-soft)}
.rank{width:15px;color:var(--muted);font-size:12.5px;flex:none;text-align:center}
.board-body{flex:1;min-width:0}
.board-body b{display:block;font-weight:500;font-size:13.5px}
.board-body small{display:block;color:var(--muted);font-size:11.5px}

/* Rappels */
.reminders{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;padding:18px}
.reminder{
  display:flex;align-items:center;gap:12px;text-align:left;
  padding:14px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-md);transition:all .14s;
}
.reminder:hover{background:var(--surface-3);border-color:#2b3630}
.rem-icon{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--grey-soft)}
.rem-icon svg{width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rem-icon.late{background:var(--red-soft)} .rem-icon.late svg{stroke:var(--red)}
.rem-icon.accent{background:var(--accent-soft)} .rem-icon.accent svg{stroke:var(--accent)}
.rem-icon.blue{background:var(--blue-soft)} .rem-icon.blue svg{stroke:var(--blue)}
.rem-body{min-width:0;flex:1}
.rem-top{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.rem-top b{font-size:17px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rem-top em{font-style:normal;font-size:12.5px;color:var(--text-2)}
.rem-top em.late{color:var(--red)}
.rem-top em.accent{color:var(--accent)}
.rem-top em.blue{color:var(--blue)}
.rem-body small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}

@media (max-width:1180px){
  .grid-3,.grid-3.wide-first{grid-template-columns:1fr 1fr}
  .grid-2{grid-template-columns:1fr}
  .grid-3 > *:nth-child(3){grid-column:1 / -1}
}
@media (max-width:820px){
  .grid-3,.grid-3.wide-first,.grid-2{grid-template-columns:1fr}
  .grid-3 > *:nth-child(3){grid-column:auto}
  .goal-wrap{flex-direction:column;align-items:stretch}
  .donut{align-self:center}
}

/* =========================================================
   Suivi
   ========================================================= */
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
.chip{
  display:flex;align-items:center;gap:11px;text-align:left;padding:11px 13px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
  transition:all .14s;
}
.chip:hover{background:var(--surface-3);border-color:#2b3630}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chip-icon{
  width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb, var(--tone) 15%, transparent);
}
.chip-icon svg{width:17px;height:17px;fill:none;stroke:var(--tone);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chip-body{min-width:0;flex:1}
.chip-body small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-body span{display:flex;align-items:baseline;gap:7px}
.chip-body b{font-size:21px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.chip-body em{font-style:normal;font-size:11.5px;color:var(--muted)}

.rail{display:flex;height:8px;border-radius:99px;overflow:hidden;margin:20px 0 10px;
  background:var(--surface-3);gap:2px}
.rail-seg{display:block;min-width:5px;border-radius:2px;transition:flex .2s}
.rail-seg:first-child{border-radius:99px 2px 2px 99px}
.rail-seg:last-child{border-radius:2px 99px 99px 2px}
.rail-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--muted)}
.rail-legend span{display:flex;align-items:center;gap:6px}
.rail-legend i{width:7px;height:7px;border-radius:50%}

.suivi-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-bottom:20px;align-items:start}
.suivi-grid > .card,.suivi-grid .card + .card{margin-top:0}
.stack{display:flex;flex-direction:column;gap:18px}
.stack .card,.stack .card + .card{margin-top:0}

.todo-when{text-align:right;flex:none;min-width:74px}
.todo-when b{display:block;font-size:12.5px;font-weight:500;color:var(--text-2)}
.todo-when small{display:block;font-size:11px;color:var(--muted)}
.todo-when.late b{color:var(--red)}
.todo-when.soon b{color:var(--amber)}
.todo-when.today b{color:var(--accent)}

/* Calendrier */
.cal{padding:6px 18px 12px}
.cal-day{display:flex;gap:13px;padding:9px 0}
.cal-day + .cal-day{border-top:1px solid var(--line-soft)}
.cal-date{
  width:44px;flex:none;text-align:center;padding:6px 0;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line);height:fit-content;
}
.cal-date b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em}
.cal-date small{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.06em}
.cal-date.late{border-color:rgba(242,96,92,.35);background:var(--red-soft)}
.cal-date.today{border-color:rgba(36,217,122,.35);background:var(--accent-soft)}
.cal-items{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cal-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 9px;border-radius:var(--r-sm);transition:background .13s;
  border-left:2px solid transparent;
}
.cal-item:hover{background:var(--surface-2)}
.cal-item.late{border-left-color:var(--red)}
.cal-item.soon{border-left-color:var(--amber)}
.cal-item.today{border-left-color:var(--accent)}
.cal-btn{padding:5px 12px;font-size:12.5px;flex:none;text-decoration:none}
.cal-dot{width:7px;height:7px;border-radius:50%;flex:none}
.cal-body{flex:1;min-width:0}
.cal-body b{display:block;font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-body small{display:block;font-size:11.5px;color:var(--accent)}
.cal-body small.dim{color:var(--muted)}
.cal-body small.late{color:var(--red)}
.cal-body small.soon{color:var(--amber)}
.cal-body small.today{color:var(--accent)}

/* Donut + légende */
.split{display:flex;align-items:center;gap:16px;padding:18px}
.split .donut{width:132px;height:132px;flex:none}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.legend-row{display:flex;align-items:baseline;gap:8px;font-size:12.5px}
.legend-row .dot{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}
.legend-row .l{flex:1;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend-row .p{color:var(--muted);font-size:11.5px}

/* Performance */
.perf{display:grid;grid-template-columns:1fr;gap:12px;padding:18px}
.perf-cell{
  display:flex;align-items:center;gap:10px;padding:12px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
}
.perf-icon{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;background:var(--accent-soft)}
.perf-icon svg{width:15px;height:15px;fill:none;stroke:var(--accent);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.perf-cell small{display:block;color:var(--muted);font-size:11px;line-height:1.3}
.perf-cell b{display:block;font-size:16px;font-weight:600;letter-spacing:-.02em;margin-top:3px}

/* Actions du journal */
.act{display:flex;align-items:center;gap:10px}
.act-icon{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;background:var(--grey-soft)}
.act-icon svg{width:15px;height:15px;fill:none;stroke:var(--muted);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.act-icon.accent{background:var(--accent-soft)} .act-icon.accent svg{stroke:var(--accent)}
.act-icon.blue{background:var(--blue-soft)}     .act-icon.blue svg{stroke:var(--blue)}
.act-icon.amber{background:var(--amber-soft)}   .act-icon.amber svg{stroke:var(--amber)}
.act b{display:block;font-weight:500;font-size:13px}
.act small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.late-txt{color:var(--red)}

@media (max-width:1180px){
  .suivi-grid{grid-template-columns:1fr}
  .stack{flex-direction:row}
  .stack > *{flex:1}
}
@media (max-width:820px){
  .stack{flex-direction:column}
  .cal-item{flex-wrap:wrap}
}

/* =========================================================
   Table interactive
   ========================================================= */
table.rich tbody tr{cursor:pointer}
table.rich tbody tr.picked{background:var(--accent-soft)}
/* Une ligne en attente d'encaissement se repère d'un coup d'œil. */
tbody tr.impaye{box-shadow:inset 3px 0 0 var(--violet)}
tbody tr.impaye:hover{background:var(--violet-soft)}
table.rich tbody tr.picked:hover{background:rgba(36,217,122,.16)}

th.sel,td.sel{width:38px;padding-left:16px;padding-right:0}
input[type=checkbox]{
  appearance:none;width:16px;height:16px;border-radius:4px;cursor:pointer;
  border:1.5px solid #38443e;background:var(--surface-2);
  display:grid;place-content:center;transition:all .13s;vertical-align:middle;
}
input[type=checkbox]:hover{border-color:#4a5a52}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{
  content:"";width:9px;height:5px;border:2px solid #04150c;
  border-top:0;border-right:0;transform:rotate(-45deg) translate(0,-1px);
}
input[type=checkbox]:indeterminate{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:indeterminate::after{content:"";width:9px;height:2px;background:#04150c;border-radius:1px}

th.act-col,td.act-col{width:1%;white-space:nowrap;padding-right:14px}

/* Raccourcis au survol */
.quick{display:flex;align-items:center;gap:3px;justify-content:flex-end}
.quick .q,.quick .icon-btn{
  width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
  color:var(--muted);transition:all .13s;text-decoration:none;flex:none;
}
.quick .q svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.quick .q:hover{background:var(--surface-3);color:var(--text)}
.quick .q.win:hover{background:var(--accent-soft);color:var(--accent)}
.quick .q.off{opacity:.22;cursor:not-allowed}
.quick .q.off.won{opacity:1;color:var(--accent);cursor:default}

/* Sur écran large les raccourcis n'apparaissent qu'au survol de la ligne. */
@media (hover:hover) and (min-width:900px){
  .quick .q{opacity:0;transform:translateX(4px);transition:opacity .14s,transform .14s,background .13s,color .13s}
  tr:hover .quick .q,tr:focus-within .quick .q{opacity:1;transform:none}
  .quick .q.off.won{opacity:.45}
  tr:hover .quick .q.off.won{opacity:1}
}

.select.mini{padding:6px 26px 6px 10px;font-size:12.5px;width:auto}

/* Barre d'actions groupées */
.bulk{
  position:sticky;top:0;z-index:35;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:11px 16px;margin-bottom:16px;
  background:var(--surface-3);border:1px solid rgba(36,217,122,.3);
  border-radius:var(--r-md);box-shadow:var(--sh);
  animation:bulkIn .16s cubic-bezier(.2,.8,.3,1);
}
@keyframes bulkIn{from{opacity:0;transform:translateY(-5px)}}
.bulk-count{font-size:13px;color:var(--text-2);white-space:nowrap}
.bulk-count b{color:var(--accent);font-size:15px}
.bulk-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}

@media (max-width:880px){
  th.sel,td.sel{width:34px;padding-left:12px}
  .bulk{position:static}
  .bulk-actions{margin-left:0;width:100%}
}

/* Bandeau du mode aperçu */
.impers{
  display:flex;align-items:center;gap:13px;flex-wrap:wrap;
  padding:12px 16px;margin-bottom:20px;
  background:var(--amber-soft);border:1px solid rgba(224,163,58,.32);
  border-radius:var(--r-md);
}
.impers-eye{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:rgba(224,163,58,.18)}
.impers-eye svg{width:17px;height:17px;fill:none;stroke:var(--amber);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.impers-txt{flex:1;min-width:180px}
.impers-txt b{display:block;font-size:13.5px;font-weight:500;color:var(--amber)}
.impers-txt small{display:block;font-size:12px;color:var(--muted);margin-top:2px}

/* =========================================================
   Messagerie
   ========================================================= */
.nav-badge{
  margin-left:auto;min-width:19px;height:19px;padding:0 5px;border-radius:99px;
  background:var(--accent);color:#04150c;font-size:11px;font-weight:700;
  display:grid;place-items:center;
}

.chat-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chat-title{flex:1;min-width:200px}
.chat-title h2{margin:0;font-size:30px;font-weight:600;letter-spacing:-.035em}
.chat-title p{margin:6px 0 0;color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:8px}
.hash{
  width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
  font-size:12px;font-weight:600;
}
.online-pill{
  display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:99px;
  background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--text-2);
}
.online-pill i{width:7px;height:7px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 3px rgba(36,217,122,.16)}
.round-btn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:var(--surface);border:1px solid var(--line);color:var(--muted);transition:all .14s;
}
.round-btn:hover{background:var(--surface-3);color:var(--text)}
.round-btn.muted{color:var(--amber);border-color:rgba(224,163,58,.3)}
.round-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.round-btn:disabled{opacity:.4;cursor:not-allowed}

.chat-shell{
  display:flex;flex-direction:column;height:calc(100dvh - 200px);min-height:430px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:20px;box-shadow:var(--sh);overflow:hidden;
}
.chat-scroll{flex:1;overflow-y:auto;padding:22px 24px 12px;scroll-behavior:smooth}

.chat-day{display:flex;align-items:center;gap:14px;margin:20px 0 16px;color:var(--muted);font-size:12px}
.chat-day::before,.chat-day::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.chat-day.new{color:var(--accent)}
.chat-day.new::before,.chat-day.new::after{background:rgba(36,217,122,.3)}

.chat-msg{display:flex;gap:12px;margin-bottom:14px}
.chat-msg.grouped{margin-bottom:4px}
.msg-side{width:30px;flex:none;padding-top:22px}
.chat-msg.grouped .msg-side{padding-top:0}
.msg-main{min-width:0;max-width:min(660px,80%)}
.msg-meta{display:flex;align-items:baseline;gap:9px;margin-bottom:6px;padding:0 2px}
.msg-meta b{font-size:13.5px;font-weight:600}
.msg-meta time{font-size:11.5px;color:var(--muted)}

.bubble{
  position:relative;padding:11px 15px;border-radius:6px 14px 14px 14px;
  background:var(--surface-2);border:1px solid var(--line);
}
.chat-msg.grouped .bubble{border-radius:14px}
.bubble p{margin:0;font-size:14px;line-height:1.55;word-wrap:break-word;overflow-wrap:anywhere}
.mention{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 4px;font-style:normal}

/* Ses propres messages */
.chat-msg.own{flex-direction:row-reverse}
.chat-msg.own .msg-main{margin-left:auto}
.chat-msg.own .msg-meta{flex-direction:row-reverse}
.chat-msg.own .msg-meta b{color:var(--accent)}
.chat-msg.own .bubble{
  background:linear-gradient(180deg,#0f2d1e,#0c2418);
  border-color:rgba(36,217,122,.22);border-radius:14px 6px 14px 14px;
}
.chat-msg.own.grouped .bubble{border-radius:14px}
.chat-msg.own .reacts{justify-content:flex-end}

/* Outils au survol de la bulle */
.bubble-tools{
  position:absolute;top:-13px;right:8px;display:flex;gap:3px;
  background:var(--surface-3);border:1px solid var(--line);border-radius:8px;
  padding:2px;opacity:0;transform:translateY(3px);transition:all .14s;pointer-events:none;
}
.bubble:hover .bubble-tools,.bubble:focus-within .bubble-tools{opacity:1;transform:none;pointer-events:auto}
.chat-msg.own .bubble-tools{right:auto;left:8px}
.bt{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted);transition:all .12s}
.bt:hover{background:var(--surface-2);color:var(--text)}
.bt svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Réactions */
.reacts{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;padding:0 2px}
.react{
  display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  background:var(--surface-2);border:1px solid var(--line);font-size:13px;transition:all .13s;
}
.react:hover{background:var(--surface-3)}
.react.on{background:var(--accent-soft);border-color:rgba(36,217,122,.4)}
.react span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.react.on span{color:var(--accent)}

/* Fiche liée */
.msg-card{
  display:flex;align-items:center;gap:12px;margin-top:10px;padding:11px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
}
.msg-card-icon{width:40px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:var(--accent-soft)}
.msg-card-icon svg{width:19px;height:19px;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.msg-card-body{flex:1;min-width:0}
.msg-card-body b{display:block;font-size:13.5px;font-weight:600}
.msg-card-body small{display:block;font-size:12px;color:var(--accent);margin-top:2px}

/* Pièce jointe */
.msg-file{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;margin-top:10px;padding:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);transition:all .13s;
}
.msg-file:hover{background:var(--surface-3);border-color:#2b3630}
.msg-file-icon{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--blue-soft)}
.msg-file-icon svg{width:16px;height:16px;fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.msg-file-body{flex:1;min-width:0}
.msg-file-body b{display:block;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-file-body small{display:block;font-size:11.5px;color:var(--muted)}
.msg-file-dl{width:16px;height:16px;flex:none;fill:none;stroke:var(--muted);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Zone de saisie */
.composer{padding:14px 16px 16px;border-top:1px solid var(--line-soft);background:var(--surface)}
.composer-box{
  background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px 9px;transition:border-color .15s;
}
.composer-box:focus-within{border-color:#33443c}
.composer-box textarea{
  width:100%;background:none;border:none;outline:none;resize:none;color:var(--text);
  font:inherit;font-size:14px;line-height:1.5;min-height:24px;max-height:150px;
}
.composer-box textarea::placeholder{color:#5c6863}
.composer-hint{margin:6px 0 0;font-size:11.5px;color:#5c6863}
.composer-row{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap}
.composer-row .select{max-width:210px}
.composer-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.composer-right .round-btn{width:36px;height:36px;border-radius:10px}
.composer-right .ihb{padding:9px 17px;gap:8px}
.composer-locked{margin:10px 0 0;font-size:12px;color:var(--amber)}
.composer.locked .composer-box{opacity:.5}

.file-tag{
  display:flex;align-items:center;gap:9px;margin-top:10px;padding:8px 11px;
  background:var(--blue-soft);border:1px solid rgba(90,155,245,.25);border-radius:var(--r-sm);
  font-size:12.5px;
}
.file-tag svg{width:15px;height:15px;flex:none;fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.file-tag span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-tag small{color:var(--muted);flex:none}
.file-tag button{color:var(--muted);font-size:14px;line-height:1;padding:2px 4px}
.file-tag button:hover{color:var(--text)}

/* Sélecteur flottant */
.pop-back{position:fixed;inset:0;z-index:70}
.pop{
  position:fixed;z-index:71;transform:translateY(-100%);
  background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:0 18px 44px -14px #000;padding:9px;animation:rise .15s cubic-bezier(.2,.8,.3,1);
}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;width:236px}
.emoji-grid button{
  width:36px;height:36px;border-radius:8px;font-size:19px;line-height:1;
  display:grid;place-items:center;transition:background .12s;
}
.emoji-grid button:hover{background:var(--surface-2)}
.pop-list{display:flex;flex-direction:column;gap:2px;min-width:210px}
.pop-list button{
  display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:var(--r-sm);
  text-align:left;font-size:13.5px;transition:background .12s;
}
.pop-list button:hover{background:var(--surface-2)}
.pop-empty{margin:0;padding:10px;color:var(--muted);font-size:12.5px}

@media (max-width:880px){
  .chat-shell{height:calc(100dvh - 172px);border-radius:16px}
  .chat-scroll{padding:16px 14px 8px}
  .chat-title h2{font-size:24px}
  .msg-main{max-width:86%}
  .composer-row .select{max-width:none;flex:1}
  .composer-right{width:100%;margin-left:0}
  .composer-right .ihb{flex:1}
  .bubble-tools{opacity:1;transform:none;pointer-events:auto}
}

/* =========================================================
   Marque
   ========================================================= */
.mark{
  width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(160deg,#1a221d,#0c110e);
  border:1px solid #222b26;
  display:grid;place-items:center;
  font-weight:800;font-size:17px;color:var(--accent);
  letter-spacing:-.03em;
}
.mark.lg{width:76px;height:76px;border-radius:20px;font-size:38px}

/* =========================================================
   Écran de démonstration : choix du point de vue
   ========================================================= */
.demo-login{
  position:fixed;inset:0;z-index:5;display:grid;place-items:center;
  background:var(--bg);padding:24px;
}
/* Fond animé WebGL (bruit + dégradé) de l'écran de connexion principal. */
.velaris-bg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
@media (prefers-reduced-motion:reduce){.velaris-bg{display:none}}
.demo-login-box{
  position:relative;z-index:1;
  width:100%;max-width:460px;text-align:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:38px 32px;box-shadow:var(--sh);
}
.demo-login-box h1{margin:0 0 8px;font-size:24px;letter-spacing:.08em;font-weight:700}
.norya-fx{display:block;width:100%;max-width:320px;height:110px;margin:0 auto -6px;cursor:default}
.norya-fx-fallback{display:none}
@media (prefers-reduced-motion:reduce){
  .norya-fx{display:none}
  .norya-fx-fallback{display:block}
}
.demo-login-box > p{margin:0 0 26px;color:var(--muted);font-size:13.5px;line-height:1.5}
.demo-login-choices{display:flex;flex-direction:column;gap:12px}
.demo-choice{
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
  padding:16px 18px;cursor:pointer;transition:border-color .15s,transform .15s,background .15s;
  font-family:inherit;color:inherit;
}
.demo-choice svg{
  width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;margin-bottom:2px;
}
.demo-choice b{font-size:14.5px;font-weight:600}
.demo-choice small{color:var(--muted);font-size:12.5px;line-height:1.4}
.demo-choice:hover{border-color:var(--accent-dim);background:var(--surface-3);transform:translateY(-1px)}

/* =========================================================
   Connexion réussie — nœud infini
   Portage natif de BackgroundPaths (animated-infinity-background) :
   deux nappes de 36 huit croisés, carte vitrée, titre lettre à lettre.
   ========================================================= */
.login-ok{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;
  padding:24px;cursor:pointer;color:var(--accent);
  background:
    radial-gradient(1000px 620px at 50% 42%,var(--accent-soft),transparent 70%),
    linear-gradient(135deg,var(--surface-2),var(--bg) 55%,var(--surface));
  animation:lok-in .45s ease both;
}
.login-ok.out{animation:lok-out .6s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none}
@keyframes lok-in{from{opacity:0}}
@keyframes lok-out{to{opacity:0;transform:scale(1.04);filter:blur(6px)}}
.lok-paths{position:absolute;inset:0;pointer-events:none}
.lok-paths svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;opacity:.7}
.lok-paths svg + svg{opacity:.45}
.lok-paths path{
  fill:none;stroke:currentColor;stroke-linecap:round;
  stroke-dasharray:0 1;stroke-dashoffset:.3;
  animation:lok-draw 1.5s cubic-bezier(.22,1,.36,1) var(--dl) forwards,
            lok-flow var(--du) linear calc(var(--dl) + 1.5s) infinite;
}
@keyframes lok-draw{to{stroke-dasharray:.55 .45;stroke-dashoffset:0}}
@keyframes lok-flow{to{stroke-dashoffset:-1}}
.lok-card{
  position:relative;z-index:1;text-align:center;overflow:hidden;
  width:100%;max-width:520px;padding:34px 40px 28px;border-radius:24px;
  background:linear-gradient(135deg,
    color-mix(in srgb,var(--surface) 80%,transparent),
    color-mix(in srgb,var(--surface-2) 60%,transparent));
  border:1px solid color-mix(in srgb,var(--accent) 24%,var(--line));
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:0 30px 80px -30px rgba(0,0,0,.9);
  animation:lok-card .8s cubic-bezier(.22,1,.36,1) .1s both;
}
@keyframes lok-card{from{opacity:0;transform:translateY(14px) scale(.94)}}
.lok-dots{position:absolute;inset:0;pointer-events:none;animation:lok-in 1s ease .5s both}
.lok-dots i{
  position:absolute;width:8px;height:8px;border-radius:50%;
  background:color-mix(in srgb,var(--text) 16%,transparent);
  animation:lok-float var(--du) ease-in-out var(--dl) infinite;
}
@keyframes lok-float{0%,100%{transform:translateY(-20px);opacity:.3}50%{transform:translateY(20px);opacity:.8}}
.lok-badge{
  position:relative;display:grid;place-items:center;width:58px;height:58px;
  margin:0 auto 16px;border-radius:50%;background:var(--accent-soft);
  animation:lok-pulse 1.6s ease-out .95s both;
}
.lok-badge svg{width:36px;height:36px;fill:none;stroke:var(--accent);stroke-width:3.4;
  stroke-linecap:round;stroke-linejoin:round}
.lok-badge circle{stroke-width:2;stroke-dasharray:1 1;stroke-dashoffset:1;
  animation:lok-stroke .7s cubic-bezier(.65,0,.45,1) .25s forwards}
.lok-badge path{stroke-dasharray:1 1;stroke-dashoffset:1;
  animation:lok-stroke .45s cubic-bezier(.65,0,.45,1) .85s forwards}
@keyframes lok-stroke{to{stroke-dashoffset:0}}
@keyframes lok-pulse{from{box-shadow:0 0 0 0 var(--glow)}to{box-shadow:0 0 0 24px transparent}}
.lok-title{position:relative;margin:0;font-size:clamp(30px,6.2vw,52px);font-weight:700;
  letter-spacing:-.03em;line-height:1.1}
.lok-word{display:inline-block;white-space:nowrap;margin-right:.26em}
.lok-word:last-child{margin-right:0}
.lok-l{
  display:inline-block;opacity:0;transform:translateY(100%);
  background:linear-gradient(180deg,var(--text),color-mix(in srgb,var(--text) 70%,var(--accent)));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:lok-letter .9s cubic-bezier(.34,1.45,.64,1) forwards;
}
@keyframes lok-letter{to{opacity:1;transform:none}}
.lok-sub{position:relative;margin:14px 0 0;font-size:16px;color:var(--text-2);
  opacity:0;animation:lok-rise .7s ease .95s forwards}
.lok-role{position:relative;margin:4px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.04em;
  opacity:0;animation:lok-rise .7s ease 1.1s forwards}
@keyframes lok-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lok-bar{position:relative;display:block;width:140px;height:3px;margin:22px auto 0;
  border-radius:3px;background:var(--line);overflow:hidden}
.lok-bar i{display:block;height:100%;background:var(--accent);transform-origin:left;
  transform:scaleX(0);animation:lok-bar linear forwards}
@keyframes lok-bar{to{transform:scaleX(1)}}
@media (max-width:520px){.lok-card{padding:28px 20px 24px}}
@media (prefers-reduced-motion:reduce){
  .login-ok,.login-ok.out{animation-duration:.2s}
  .lok-paths path{animation:none;stroke-dasharray:none}
  .lok-card,.lok-badge,.lok-badge circle,.lok-badge path{animation:none;stroke-dashoffset:0}
  .lok-l,.lok-sub,.lok-role{animation:none;opacity:1;transform:none}
  .lok-dots{display:none}
}

/* Connexion par e-mail et mot de passe.
   Les champs reprennent .field/.input du reste de l'application ; seul
   l'alignement change, la boite de connexion etant centree. */
.login-form{text-align:left;margin-bottom:20px}
.login-form .ihb{width:100%;margin-top:2px}
.login-form .ihb[disabled]{opacity:.6;cursor:progress}
.login-error{
  display:flex;align-items:flex-start;gap:8px;
  margin:0 0 14px;padding:10px 12px;
  border:1px solid var(--red);border-radius:var(--r-sm);
  background:color-mix(in srgb, var(--red) 12%, transparent);
  color:var(--red);font-size:12.5px;line-height:1.45;text-align:left;
}
.login-sep{
  display:flex;align-items:center;gap:12px;margin:0 0 18px;
  color:var(--muted);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
}
.login-sep::before,.login-sep::after{content:"";flex:1;height:1px;background:var(--line)}

.signup-link{margin:22px 0 0;font-size:12.5px;color:var(--muted);text-align:center}
.signup-link button{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;padding:0;text-decoration:underline}

/* Bouton « afficher le mot de passe », logé dans le champ. */
.pass-wrap{position:relative;display:flex}
.pass-wrap .input{padding-right:40px}
.pass-reveal{
  position:absolute;top:0;bottom:0;right:0;width:38px;
  display:inline-flex;align-items:center;justify-content:center;
  background:none;border:none;padding:0;cursor:pointer;color:var(--muted);
  border-radius:0 var(--r-sm) var(--r-sm) 0;transition:color .14s;
}
.pass-reveal:hover{color:var(--text)}
.pass-reveal:focus-visible{outline:none;color:var(--text);box-shadow:0 0 0 3px var(--accent-soft)}
.pass-reveal svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------------------------------------------------------
   Lookout — un regard qui accompagne la saisie : il suit le
   curseur et le texte, se détourne du mot de passe, jette un
   oeil quand on le révèle, et s'assoupit si rien ne bouge.
   Purement décoratif : jamais focalisable, jamais dans le
   chemin du formulaire.
   Le blanc de l'oeil et la pupille ne suivent pas le thème : un
   oeil se lit clair à pupille sombre partout. En revanche la tête
   et la paupière doivent rester distinctes de ce blanc fixe, sans
   quoi le visage se dissout dans un disque uni en thème clair —
   d'où le mélange vers --text, qui les écarte du fond aussi bien
   en thème sombre qu'en thème clair.
   --------------------------------------------------------- */
.lookout{
  display:block;width:96px;height:96px;margin:2px auto 20px;
  pointer-events:none;user-select:none;
  /* 52 % : le seul dosage mesuré qui garde le blanc de l'oeil détaché de la
     tête (>= 3.4:1) dans les sept thèmes — en dessous, « Blanc » retombe
     sous 3:1 et le visage se dissout en disque uni. */
  --lk-face:color-mix(in srgb, var(--text) 52%, var(--surface-2));
}
.lookout svg{display:block;width:100%;height:100%;overflow:visible}
.lk-head{fill:var(--lk-face);stroke:var(--line);stroke-width:1.5}
.lk-sclera{fill:#f4f7f5;stroke:var(--muted);stroke-width:1.1}
.lk-iris{fill:var(--accent)}
.lk-pupil-dot{fill:#0b0f0d}
.lk-catch{fill:#fff;opacity:.95}
.lk-lid{fill:var(--lk-face)}
.lk-brow,.lk-mouth{fill:none;stroke:var(--text);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.lk-brow{transition:transform .2s cubic-bezier(.22,1,.36,1)}
.lk-mouth{transition:d .22s cubic-bezier(.22,1,.36,1)}
@media (prefers-reduced-motion:reduce){
  .lk-brow,.lk-mouth{transition:none}
}
@media (max-width:560px){
  .lookout{width:78px;height:78px;margin-bottom:14px}
}
/* En paysage sur mobile, la hauteur est comptée : le regard s'efface. */
@media (max-height:520px) and (orientation:landscape){
  .lookout{display:none}
}

/* Inscription commerciale, étape par étape */
.signup-box{position:relative;text-align:left;max-width:420px}
.signup-box h1{text-align:center;margin:0 0 20px}
.signup-close{position:absolute;top:0;right:0}
.signup-steps{display:flex;justify-content:center;gap:7px;margin-bottom:22px}
.signup-dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .15s,width .15s}
.signup-dot.on{background:var(--accent);width:20px;border-radius:4px}
.signup-dot.done{background:var(--accent-dim)}
.signup-step-title{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.signup-footer{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.signup-footer .ihb{flex:1}
.file-drop{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px dashed var(--line);
  border-radius:var(--r-md);cursor:pointer;color:var(--text-2);font-size:13px;
  transition:border-color .15s,background .15s;
}
.file-drop:hover{border-color:var(--accent-dim);background:var(--surface-2)}
.file-drop svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.8;flex:none}
.signup-done{text-align:center;padding:6px 0 4px}
.signup-done .check{
  width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;margin:0 auto 16px;font-size:22px;
}

/* Jauge de robustesse du mot de passe.
   Quatre cellules qui se remplissent, un libellé en fondu enchaîné et les
   critères cochés au fil de la frappe : la jauge conseille, elle ne bloque
   rien (le passage à l'étape suivante reste régi par validateSignupStep). */
.pstrength{margin-top:12px;--ps-tone:var(--muted)}
.pstrength[data-tone="danger"]{--ps-tone:var(--red)}
.pstrength[data-tone="caution"]{--ps-tone:var(--amber)}
.pstrength[data-tone="safe"]{--ps-tone:var(--accent)}
.ps-meter{display:grid;gap:6px}
.ps-cell{position:relative;height:6px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.ps-cell i{
  position:absolute;inset:0;border-radius:2px;background:var(--ps-tone);
  transform:scaleX(0);transform-origin:left;
  transition:transform .42s cubic-bezier(.2,1.25,.35,1),background-color .2s ease;
}
/* Les cellules se remplissent en cascade, mais se vident d'un bloc. */
.ps-cell.on i{transform:scaleX(1);transition-delay:calc(var(--i) * 30ms)}
.ps-line{display:flex;align-items:center;justify-content:space-between;gap:12px;height:20px;margin-top:8px}
.ps-labels{
  display:inline-grid;font-size:12.5px;font-weight:500;line-height:20px;
  color:var(--ps-tone);transition:color .2s ease;
}
.ps-labels span{grid-area:1/1;white-space:nowrap;opacity:0;transition:opacity .3s ease}
.ps-labels span.on{opacity:1}
.ps-guess{
  white-space:nowrap;font-size:11.5px;line-height:20px;color:var(--amber);
  opacity:0;transition:opacity .3s ease;
}
.pstrength.guessable .ps-guess{opacity:1}
.ps-rules{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.ps-rules li{
  display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:20px;
  color:var(--muted);transition:color .2s ease;
}
.ps-rules li.met{color:var(--text-2)}
.ps-box{
  position:relative;display:grid;place-items:center;width:14px;height:14px;flex:none;
  border:1px solid var(--line);border-radius:4px;color:var(--bg);
}
.ps-box i{
  position:absolute;inset:0;border-radius:3px;background:var(--accent);
  opacity:0;transition:opacity .3s ease;
}
.ps-box svg{
  position:relative;width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;
  opacity:0;transform:scale(.6);
  transition:opacity .3s ease,transform .42s cubic-bezier(.2,1.25,.35,1);
}
.ps-rules li.met .ps-box i{opacity:1}
.ps-rules li.met .ps-box svg{opacity:1;transform:scale(1)}
/* Réservé aux lecteurs d'écran */
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;
}
@media (prefers-reduced-motion:reduce){
  .ps-cell i,.ps-labels,.ps-labels span,.ps-guess,.ps-rules li,.ps-box i,.ps-box svg{
    transition:none
  }
}

/* Dossiers d'inscription (espace administrateur) */
.cand-def{display:grid;grid-template-columns:auto 1fr;gap:9px 20px;margin:0;font-size:13px;align-items:baseline}
.cand-def dt{color:var(--muted);white-space:nowrap}
.cand-def dd{margin:0;color:var(--text);word-break:break-word}
.cand-pieces{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.cand-piece{
  display:inline-flex;align-items:center;gap:7px;padding:5px 10px;
  border-radius:var(--r-sm);background:var(--surface-3);border:1px solid var(--line);
  font-size:12.5px;color:var(--text-2);
}
.cand-piece svg{width:14px;height:14px;fill:none;stroke:var(--accent);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cand-piece.manquant{color:var(--muted)}
.cand-piece.manquant svg{stroke:var(--red)}
.cand-sep{height:1px;background:var(--line);margin:16px 0}
@media (max-width:560px){
  .cand-def{grid-template-columns:1fr;gap:2px 0}
  .cand-def dd{margin-bottom:8px}
}

/* =========================================================
   Coquille de l'application
   ========================================================= */
#app{position:relative;z-index:1;display:flex;min-height:100dvh}

.sidebar{
  width:214px;flex:none;background:var(--surface);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 12px;
  position:sticky;top:0;height:100dvh;
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:4px 6px 22px}
.sb-brand span{font-weight:700;font-size:16.5px;letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:9px 11px;border-radius:var(--r-sm);
  color:var(--muted);font-size:13.5px;text-align:left;transition:all .14s;
}
.nav button:hover{background:var(--surface-2);color:var(--text-2)}
.nav button.on{background:var(--surface-3);color:var(--text);font-weight:500}
.nav button.on svg{stroke:var(--accent)}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sb-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-soft)}
.sb-user{display:flex;align-items:center;gap:9px;padding:7px 6px}
.sb-user .who{min-width:0;flex:1}
.sb-user .who b{display:block;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user .who small{display:block;font-size:11px;color:var(--muted)}

.avatar{
  width:29px;height:29px;border-radius:50%;flex:none;
  background:var(--surface-3);border:1px solid var(--line);
  display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--text-2);
}
.avatar.sm{width:26px;height:26px;font-size:10px}
.avatar.photo{background-size:cover;background-position:center;color:transparent}
.avatar.xl{width:76px;height:76px;font-size:26px;border-radius:50%}

/* Barre latérale repliable (bureau large uniquement) : repliée sur les
   icônes au repos, elle s'ouvre au survol ou au focus clavier. */
@media (min-width:1025px){
  .sidebar{width:68px;overflow:hidden;transition:width .2s cubic-bezier(.2,.8,.3,1)}
  .sidebar:hover,.sidebar:focus-within{width:214px}
  .nav-label,.sb-brand span,.sb-user .who{
    display:inline-block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;
    transition:max-width .16s ease,opacity .1s ease;
  }
  .sb-user .who{display:block}
  .sidebar:hover .nav-label,.sidebar:hover .sb-brand span,.sidebar:hover .sb-user .who,
  .sidebar:focus-within .nav-label,.sidebar:focus-within .sb-brand span,.sidebar:focus-within .sb-user .who{
    max-width:140px;opacity:1;transition:max-width .18s ease .06s,opacity .16s ease .08s;
  }
}
.photo-row{display:flex;align-items:center;gap:18px;margin-bottom:6px}
.toggle{
  display:flex;align-items:center;gap:12px;padding:13px 15px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
}
.toggle .txt{flex:1;min-width:0}
.toggle .txt b{display:block;font-weight:500;font-size:13.5px}
.toggle .txt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.switch{
  width:40px;height:23px;border-radius:99px;background:var(--surface-3);
  border:1px solid var(--line);position:relative;flex:none;transition:background .18s;
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
  background:var(--muted);transition:transform .18s,background .18s;
}
.switch[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent-dim)}
.switch[aria-checked="true"]::after{transform:translateX(17px);background:var(--accent)}
.toggle.off{opacity:.55;cursor:not-allowed}

/* Sélecteur de thème (Réglages) */
.theme-grid{display:flex;gap:14px;flex-wrap:wrap}
.theme-swatch{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:none;border:none;cursor:pointer;padding:0;width:74px;
}
.theme-preview{
  width:64px;height:64px;border-radius:var(--r-md);border:2px solid var(--line);
  display:grid;place-items:center;transition:border-color .15s,transform .15s;
}
.theme-swatch:hover .theme-preview{transform:translateY(-2px)}
.theme-swatch.on .theme-preview{border-color:var(--accent)}
.theme-swatch small{color:var(--text-2);font-size:12px}
.theme-swatch.on small{color:var(--text);font-weight:600}

.main{flex:1;min-width:0;padding:26px 30px 60px}
.page-head{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px;
}
.page-head h2{margin:0;font-size:27px;font-weight:600;letter-spacing:-.03em;flex:1}
.search{position:relative;flex:none}
.search svg{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;
}
.search input{
  width:236px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:8px 12px 8px 33px;
}
.search input:focus{outline:none;border-color:#33443c}

/* Champs de formulaire (inputs, menus déroulants, zones de texte).
   Une seule règle pour que tous les formulaires du site se ressemblent. */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:500;color:var(--text-2)}
.input,.select,.textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:9px 12px;color:var(--text);
  transition:border-color .14s,background .14s;
}
.input::placeholder,.textarea::placeholder{color:var(--muted)}
.input:hover,.select:hover,.textarea:hover{border-color:#2a332e}
.input:focus,.select:focus,.textarea:focus{
  outline:none;border-color:var(--accent-dim);background:var(--surface-3);
  box-shadow:0 0 0 3px var(--accent-soft);
}
.input:disabled,.select:disabled,.textarea:disabled{
  opacity:.55;cursor:not-allowed;background:var(--surface);
}
.textarea{resize:vertical;min-height:70px;line-height:1.5;font-family:inherit}
.select{
  appearance:none;cursor:pointer;padding-right:32px;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%237e8b85" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>');
  background-repeat:no-repeat;background-position:right 10px center;background-size:14px;
}
.select:disabled{cursor:not-allowed}
.select option{background:var(--surface-2);color:var(--text)}

/* Cartes */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--sh);
}
.card + .card{margin-top:20px}
.card-head{
  display:flex;align-items:center;gap:12px;
  padding:15px 18px;border-bottom:1px solid var(--line-soft);
}
.card-head h3{margin:0;font-size:15px;font-weight:600;flex:1;letter-spacing:-.01em}

/* Statistiques */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:1px;background:var(--line-soft)}
.stat{background:var(--surface);padding:16px 18px}
.stat .k{font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.stat .v{font-size:27px;font-weight:600;letter-spacing:-.03em;margin:5px 0 3px;font-variant-numeric:tabular-nums}
.stat .d{font-size:12px;color:var(--muted)}
.stat .d.up{color:var(--accent)}

/* ---------------------------------------------------------
   Chiffres animés : un compteur qui fait défiler ses chiffres
   quand la valeur monte ou descend. Seule la transition est
   décorative — la valeur finale reste le texte exact rendu par
   la vue, réécrit tel quel en fin de course.
   --------------------------------------------------------- */
.nf{display:inline-flex;align-items:baseline;white-space:pre}
.nf-s{display:inline-block;white-space:pre}
.nf-d{display:inline-block;height:1em;line-height:1;overflow:hidden}
.nf-col{display:flex;flex-direction:column;will-change:transform}
.nf-col>span{height:1em;line-height:1;display:block}
@media (prefers-reduced-motion:reduce){
  .nf-col{transition:none !important}
}

/* Tableau */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;padding:11px 16px;font-size:11.5px;font-weight:500;
  color:var(--muted);letter-spacing:.04em;white-space:nowrap;
  border-bottom:1px solid var(--line-soft);
}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text-2)}
th .arrow{opacity:.55;font-size:9px;margin-left:3px}
td{padding:11px 16px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr{transition:background .13s}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
.cell-name{display:flex;align-items:center;gap:11px;min-width:190px}
.cell-name b{font-weight:500}
.cell-name small{display:block;color:var(--muted);font-size:11.5px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.dim{color:var(--muted)}

/* Ligne d'enregistrement des Réglages : le bouton seul ne disait rien de
   l'état du formulaire — on nomme donc ce qui est en attente et ce qui
   est acquis. */
/* Mention sous une cellule d'Équipe : « voici ce que l'équipe voit de vous ». */
.row-note{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:3px;line-height:1.25}
.save-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.save-state{font-size:12.5px;color:var(--muted);transition:color .2s ease}
.save-state[data-etat="modifie"]{color:var(--text-2)}
.save-state[data-etat="enregistre"]{color:var(--accent)}
.save-state .sv-dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:currentColor;margin-right:7px;vertical-align:1px;opacity:0;transition:opacity .2s ease}
.save-state[data-etat="modifie"] .sv-dot,
.save-state[data-etat="enregistre"] .sv-dot{opacity:1}

/* Pastilles de statut */
.pill{
  display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;
  font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid transparent;
}
.pill.a_contacter{background:var(--grey-soft);color:#98a49e}
.pill.contacte{background:rgba(63,111,181,.16);color:#7ba7e8}
.pill.conclu{background:rgba(36,217,122,.2);color:#5ce89f;border-color:rgba(36,217,122,.3)}
.pill.refuse{background:var(--red-soft);color:var(--red)}
/* Vente signée mais pas encore encaissée */
.pill.attente{background:var(--violet-soft);color:var(--violet);border-color:rgba(167,139,250,.32)}
select.pill{
  appearance:none;cursor:pointer;padding-right:10px;
  border:1px solid transparent;
}
select.pill:hover{filter:brightness(1.22)}
select.pill option{background:#121613;color:var(--text)}

.tag{
  display:inline-block;padding:2px 8px;border-radius:5px;font-size:11.5px;
  background:var(--surface-3);color:var(--text-2);border:1px solid var(--line);
}
.tag.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.tag.late{background:var(--red-soft);color:var(--red);border-color:transparent}

/* Message d'information dans un formulaire ou une modale. */
.alert{
  padding:11px 14px;border-radius:var(--r-md);font-size:13px;line-height:1.5;
  background:var(--amber-soft);color:var(--amber);border:1px solid rgba(224,163,58,.28);
}
.alert.ok{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-dim)}
.alert b{font-weight:600}

.icon-btn{
  width:27px;height:27px;border-radius:6px;display:grid;place-items:center;
  color:var(--muted);transition:all .14s;
}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

.tbl-foot{
  padding:11px 18px;font-size:12.5px;color:var(--muted);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.pager{display:flex;align-items:center;gap:3px;margin-left:auto}
.pg{
  min-width:30px;height:30px;padding:0 7px;border-radius:7px;
  display:grid;place-items:center;color:var(--text-2);font-size:12.5px;
  border:1px solid transparent;transition:all .13s;
}
.pg:hover:not(:disabled){background:var(--surface-3);color:var(--text)}
.pg.on{background:var(--accent-soft);color:var(--accent);border-color:rgba(36,217,122,.35);font-weight:600}
.pg:disabled{opacity:.3;cursor:not-allowed}
.pg svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.pg-gap{padding:0 3px;color:var(--muted)}

.empty{padding:52px 22px;text-align:center}
.empty h4{margin:0 0 5px;font-size:15px;font-weight:500}
.empty p{margin:0 0 16px;color:var(--muted);font-size:13px}

/* ---------- Bouton CTA à effet de survol (pastille qui se déploie) ---------- */
.ihb{
  position:relative;isolation:isolate;overflow:hidden;
  display:inline-grid;place-items:center;padding:11px 24px;
  border:1px solid var(--line);border-radius:999px;background:var(--surface);
  color:var(--text);font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;
  transition:border-color .2s ease;
}
.ihb:hover{border-color:var(--line-soft)}
.ihb-label,.ihb-fly{grid-area:1/1;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:transform .3s ease,opacity .3s ease}
.ihb-label{transform:translateX(4px)}
.ihb-label svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-linecap:round}
.ihb:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.ihb.ihb-ghost .ihb-dot{background:var(--surface-3)}
.ihb.ihb-ghost .ihb-fly{color:var(--text)}
.ihb.ihb-danger .ihb-dot{background:var(--red)}
.ihb.ihb-danger .ihb-fly{color:#2a0705}
.ihb-mini{padding:5px 11px;font-size:12.5px}
.ihb-mini .ihb-fly svg{width:13px;height:13px}
.ihb-fly{gap:8px;justify-self:center;z-index:2;opacity:0;color:#04150c;transform:translateX(140%)}
.ihb-fly svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ihb:hover .ihb-label,.ihb:focus-visible .ihb-label{transform:translateX(140%);opacity:0}
.ihb:hover .ihb-fly,.ihb:focus-visible .ihb-fly{transform:translateX(-4px);opacity:1}
.ihb-dot{
  position:absolute;left:20%;top:40%;width:8px;height:8px;z-index:1;
  border-radius:8px;background:var(--accent);transform:scale(1);
  transition:all .3s ease;
}
.ihb:hover .ihb-dot,.ihb:focus-visible .ihb-dot{left:0;top:0;width:100%;height:100%;transform:scale(1.8)}

/* Modale */
.overlay{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);
  backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;
  animation:fade .16s ease;
}
@keyframes fade{from{opacity:0}}
.modal{
  width:100%;max-width:540px;max-height:88dvh;overflow:auto;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:0 30px 70px -20px #000;
  animation:rise .18s cubic-bezier(.2,.8,.3,1);
}
@keyframes rise{from{transform:translateY(9px);opacity:0}}
.modal-head{
  display:flex;align-items:center;gap:12px;padding:17px 20px;
  border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--surface);
}
.modal-head h3{margin:0;font-size:16px;font-weight:600;flex:1;letter-spacing:-.01em}
.modal-body{padding:20px}
.modal-foot{
  display:flex;gap:9px;justify-content:flex-end;padding:15px 20px;
  border-top:1px solid var(--line-soft);
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.section-label{
  font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em;
  text-transform:uppercase;margin:22px 0 12px;padding-bottom:7px;
  border-bottom:1px solid var(--line-soft);
}
.section-label:first-child{margin-top:0}


/* Carte Google Maps dans la fiche prospect */
.map-card{margin-top:16px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.map-card-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
.map-card-head>div{flex:1;min-width:0}
.map-card-head b{display:block;font-size:13px;font-weight:500}
.map-card-head small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.map-frame{display:block;width:100%;height:240px;border:0}
.map-empty{margin-top:16px;padding:13px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);color:var(--muted);font-size:12px}

/* Carte de localisation animée (remplace l'iframe Google Maps) */
/* ---------- Carte de localisation (MapLibre GL + geocodage OSM) ---------- */
.pmap{position:relative;height:270px;border-radius:0 0 var(--r-md) var(--r-md);overflow:hidden;background:var(--surface-2)}
.pmap .maplibregl-canvas{border-radius:inherit}
.pmap .maplibregl-ctrl-attrib{font-size:9.5px}
.pmap-status{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--muted);font-size:12.5px;background:var(--surface-2)}
.pmap-pin{width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--surface-2);box-shadow:0 0 0 4px rgba(36,217,122,.25);cursor:pointer}
.pmap-tooltip{
  position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%) translateY(4px);
  padding:6px 10px;border-radius:var(--r-sm);background:var(--surface-3);border:1px solid var(--line);
  font-size:11.5px;white-space:nowrap;color:var(--text);opacity:0;pointer-events:none;
  transition:opacity .15s ease,transform .15s ease;box-shadow:var(--sh);
}
.pmap-pin:hover .pmap-tooltip{opacity:1;transform:translateX(-50%) translateY(0)}

/* Historique */
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:12px;padding:9px 0;font-size:13px}
.tl-dot{
  width:7px;height:7px;border-radius:50%;background:var(--line);
  margin-top:6px;flex:none;position:relative;
}
.tl-dot::after{
  content:"";position:absolute;left:3px;top:11px;width:1px;height:26px;background:var(--line-soft);
}
.tl-item:last-child .tl-dot::after{display:none}
.tl-body{flex:1;min-width:0}
.tl-body time{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}

/* Notifications */
#toasts{position:fixed;bottom:20px;right:20px;z-index:90;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100vw - 40px))}
.toast{
  display:grid;grid-template-columns:32px minmax(0,1fr) 28px;align-items:start;gap:10px;
  background:color-mix(in srgb,var(--surface-3) 92%,transparent);border:1px solid var(--line);color:var(--text);
  padding:13px;border-radius:12px;font-size:13.5px;backdrop-filter:blur(16px);
  box-shadow:0 18px 50px rgba(0,0,0,.28);animation:slide .32s cubic-bezier(.2,.8,.3,1);max-width:none;
}
.toast.ok{--toast-accent:var(--accent)}
.toast.err{--toast-accent:var(--red)}
.toast-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:color-mix(in srgb,var(--toast-accent) 14%,transparent);color:var(--toast-accent);font-weight:800}
.toast-copy{display:flex;flex-direction:column;gap:2px;min-width:0}
.toast-title{font-size:12px;font-weight:750;letter-spacing:.02em;color:var(--toast-accent)}
.toast-message{color:var(--text);line-height:1.42;overflow-wrap:anywhere}
.toast-close{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;color:var(--muted);font-size:18px;line-height:1;transition:background .2s,color .2s}
.toast-close:hover{background:var(--surface-2);color:var(--text)}
.toast.leaving{opacity:0;transform:translateX(16px);transition:opacity .25s ease,transform .25s ease}
@keyframes slide{from{transform:translateX(18px) scale(.97);opacity:0}}

.bar{height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

.loading{padding:48px;text-align:center;color:var(--muted);font-size:13px}
.spinner{
  width:19px;height:19px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 11px;
}
@keyframes spin{to{transform:rotate(360deg)}}

.mobile-bar{display:none}

/* =========================================================
   Adaptatif
   ========================================================= */
@media (max-width:880px){
  .sidebar{
    position:fixed;left:0;top:0;z-index:70;transform:translateX(-100%);
    transition:transform .22s cubic-bezier(.2,.8,.3,1);
  }
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.7)}
  .sidebar{padding-left:calc(12px + env(safe-area-inset-left));padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .mobile-bar{
    display:flex;align-items:center;gap:11px;
    padding:11px 15px;border-bottom:1px solid var(--line);
    background:var(--surface);position:sticky;top:0;z-index:40;
  }
  .mobile-bar span{font-weight:700;letter-spacing:-.02em}
  .main{padding:16px 15px 50px}
  .page-head h2{font-size:22px;width:100%;flex:none}
  .search input{width:100%}
  .search{flex:1}
  .grid2{grid-template-columns:1fr}
  .scrim{position:fixed;inset:0;z-index:69;background:rgba(0,0,0,.6)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* =========================================================
   Adaptation aux écrans
   Quatre paliers : bureau large, bureau étroit, tablette, mobile.
   ========================================================= */

/* Réglages généraux, tous appareils */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* clip et non hidden : hidden force overflow-y à auto, ce qui fait du body
   un second conteneur de défilement imbriqué dans celui de la page — au
   doigt, les deux se disputent le geste et on n'atteint plus le bas. */
body{overflow-x:clip}
img,svg,video{max-width:100%}
.tbl-wrap{-webkit-overflow-scrolling:touch}

/* Colonnes repliables : on retire d'abord l'accessoire, puis le secondaire. */
@media (max-width:1240px){ .opt-lg{display:none} }
@media (max-width:900px){  .opt-md{display:none} }
@media (max-width:560px){  .opt-sm{display:none} }

/* ---------- Bureau étroit et petites fenêtres ---------- */
@media (max-width:1240px){
  .main{padding:22px 22px 60px}
  .grid-3.wide-first{grid-template-columns:1fr 1fr}
  .grid-3.wide-first > *:nth-child(3){grid-column:1 / -1}
}

/* ---------- Tablette ---------- */
@media (max-width:1024px){
  .sidebar{width:190px}
  .main{padding:20px 18px 56px}
  .kpi-row{grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
  .kpi-body .v{font-size:22px}
  .grid-3,.grid-3.wide-first,.grid-2,.suivi-grid{grid-template-columns:1fr 1fr}
  .grid-3 > *:nth-child(3),.grid-3.wide-first > *:nth-child(3){grid-column:1 / -1}
  .suivi-grid > .stack{grid-column:auto}
  .perf{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .page-head h2,.dash-head h2{font-size:24px}
  .chat-shell{height:calc(100dvh - 190px)}
}

/* ---------- Tablette portrait et grands mobiles ---------- */
@media (max-width:880px){
  /* La barre latérale devient un tiroir. */
  .sidebar{width:250px}
  .main{padding:16px 14px calc(52px + env(safe-area-inset-bottom))}
  .mobile-bar{padding-left:calc(15px + env(safe-area-inset-left))}

  .grid-3,.grid-3.wide-first,.grid-2,.suivi-grid,.stack{grid-template-columns:1fr;display:grid}
  .stack{gap:18px}
  .grid-3 > *,.grid-2 > *,.suivi-grid > *{grid-column:auto !important}

  .kpi-row{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:13px;gap:10px}
  .kpi-icon{width:34px;height:34px}
  .kpi-body .v{font-size:20px}
  .kpi-foot{font-size:11px}

  .card + .card{margin-top:16px}
  .card-head{padding:13px 15px}
  .card-head h3{font-size:14.5px}

  /* Les cibles tactiles ne descendent pas sous 36 px. */
  .ihb{padding:10px 15px;min-height:40px}
  .ihb-mini{padding:8px 12px;min-height:36px}
  .icon-btn,.round-btn{min-width:38px;min-height:38px}
  .quick .q{width:34px;height:34px}
  /* La case reste discrète, mais sa zone tactile déborde à 38 px. */
  input[type=checkbox]{width:20px;height:20px;position:relative}
  input[type=checkbox]::before{content:"";position:absolute;inset:-9px}
  td.sel,th.sel{padding:10px 4px 10px 14px}
  select.pill{padding:7px 12px;font-size:12.5px}
  .bt{width:32px;height:32px}
  .react{padding:6px 11px;min-height:32px}

  /* iOS agrandit la page si la police descend sous 16 px dans un champ. */
  .input,.select,.textarea,.composer-box textarea,.search input{font-size:16px}

  th,td{padding:10px 12px}
  th{font-size:11px}
  table{font-size:13px}
  .cell-name{min-width:0}

  .stats{grid-template-columns:1fr 1fr}
  .reminders{grid-template-columns:1fr;padding:14px}
  .chips{grid-template-columns:1fr 1fr}

  /* Les modales deviennent des panneaux glissants par le bas. */
  .overlay{padding:0;align-items:flex-end}
  .modal{
    max-width:none;width:100%;max-height:92dvh;
    border-radius:20px 20px 0 0;border-bottom:none;
    padding-bottom:env(safe-area-inset-bottom);
    animation:sheet .22s cubic-bezier(.2,.8,.3,1);
  }
  .modal-foot{flex-direction:column-reverse;gap:8px}
  .modal-foot .ihb{width:100%}
  .modal-foot .ihb-danger{margin-right:0 !important}

  #toasts{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom))}
  .toast{max-width:none}
}
@keyframes sheet{from{transform:translateY(28px);opacity:0}}

/* ---------- Mobile ---------- */
@media (max-width:560px){
  .main{padding:14px 12px calc(48px + env(safe-area-inset-bottom))}
  .page-head{gap:9px}
  .page-head h2,.dash-head h2,.chat-title h2{font-size:21px}
  .dash-head p,.chat-title p{font-size:12.5px}

  .kpi-row{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr}
  .chips{grid-template-columns:1fr}
  .perf{grid-template-columns:1fr}
  .rail-legend{gap:4px 12px;font-size:11px}

  /* Le calendrier passe en pile pour éviter le défilement latéral. */
  .cal-item{flex-wrap:wrap;gap:8px}
  .cal-body{flex-basis:100%;order:-1}
  .cal-btn{flex:1}
  .cal-date{width:40px}

  .goal-wrap{flex-direction:column;align-items:stretch;gap:14px}
  .donut{align-self:center;width:110px;height:110px}
  .goal-rows{flex-direction:row;flex-wrap:wrap;gap:14px}
  .goal-rows > div{flex:1 1 120px;min-width:0}
  .goal-rows b{white-space:normal;overflow-wrap:anywhere}

  .pager{margin-left:0;width:100%;justify-content:center}
  .tbl-foot{justify-content:center;text-align:center}
  .bulk{flex-direction:column;align-items:stretch;gap:10px}
  .bulk-actions{width:100%}
  .bulk-actions .select,.bulk-actions .ihb{flex:1;min-width:120px}

  .todo-row{flex-wrap:wrap}
  .todo-when{order:3}
  .search input{width:100%}
  .date-pill{font-size:12px;padding:7px 12px}

  /* Chat : bulles plus larges, barre d'outils toujours visible. */
  .chat-msg{gap:9px}
  .msg-main{max-width:88%}
  .bubble{padding:10px 13px}
  .bubble p{font-size:13.5px}
  .chat-shell{height:calc(100dvh - 158px);border-radius:14px}
  .chat-scroll{padding:14px 12px 6px}
  .composer{padding:11px 12px calc(12px + env(safe-area-inset-bottom))}
  .composer-row{gap:7px}
  .composer-row > .ihb,.composer-row > .select{flex:1 1 100%;max-width:none}
  .composer-right{width:100%;gap:7px}
  .composer-right .ihb{flex:1}
  .emoji-grid{grid-template-columns:repeat(5,1fr);width:200px}

  .modal-body{padding:16px}
  .modal-head{padding:15px 16px}
  .section-label{margin:18px 0 10px}
}

/* ---------- Très petits écrans ---------- */
@media (max-width:380px){
  .main{padding:12px 10px 44px}
  .card-head{flex-wrap:wrap;gap:8px}
  .ihb{font-size:13px}
  .avatar{width:26px;height:26px;font-size:10px}
}

/* ---------- Écrans très larges ---------- */
@media (min-width:1700px){
  .main{max-width:1560px;margin:0 auto}
}

/* ---------- Paysage sur mobile ---------- */
@media (max-height:520px) and (orientation:landscape){
  .chat-shell{height:calc(100dvh - 120px);min-height:260px}
  .modal{max-height:96dvh}
}

/* ---------- Appareils tactiles ---------- */
@media (hover:none){
  /* Sans survol, les actions rapides restent visibles en permanence. */
  .quick .q{opacity:1;transform:none}
  .bubble-tools{opacity:1;transform:none;pointer-events:auto}
  tbody tr:hover{background:none}
}

/* =========================================================
   Pied de page : simple bloc en flux normal, juste apres le
   contenu de la page -- pas de position fixe, pas d'etirement
   force de la hauteur (la taille de chaque page reste naturelle
   et s'adapte a tous les formats d'ecran).
   ========================================================= */
.site-footer{
  margin:60px -30px 0;padding:40px 30px 30px;width:calc(100% + 60px);
  border-top:1px solid var(--line);background:var(--bg);
  display:flex;flex-direction:column;align-items:center;gap:22px;
  text-align:center;
}
.sf-logo,.sf-tagline,.sf-nav,.sf-contact,.sf-copy{
  opacity:0;transform:translateY(16px);
  transition:opacity .5s cubic-bezier(.2,.8,.3,1),transform .5s cubic-bezier(.2,.8,.3,1);
}
.site-footer.in-view .sf-logo{opacity:1;transform:none;transition-delay:.05s}
.site-footer.in-view .sf-tagline{opacity:1;transform:none;transition-delay:.1s}
.site-footer.in-view .sf-nav{opacity:1;transform:none;transition-delay:.15s}
.site-footer.in-view .sf-contact{opacity:1;transform:none;transition-delay:.2s}
.site-footer.in-view .sf-copy{opacity:1;transform:none;transition-delay:.25s}
.sf-logo{display:flex;align-items:center;gap:10px}
.sf-logo span{font-weight:700;font-size:16.5px;letter-spacing:-.02em}
.sf-tagline{margin:-8px 0 0;max-width:420px;color:var(--muted);font-size:13px;line-height:1.55}
.sf-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:640px}
.sf-link{
  position:relative;padding:9px 15px;border-radius:var(--r-sm);
  font-size:13.5px;font-weight:500;color:var(--text-2);z-index:0;
  transition:color .25s ease;
}
.sf-link::before{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;
  background:var(--accent-soft);transform:scale(.6);opacity:0;
  transition:transform .3s cubic-bezier(.2,.8,.3,1),opacity .3s ease;
}
.sf-link:hover{color:var(--text)}
.sf-link:hover::before{transform:scale(1);opacity:1}
.sf-contact{
  display:inline-flex;align-items:center;gap:8px;padding:10px 18px;
  border:1px solid var(--line);border-radius:99px;color:var(--text-2);
  font-size:13px;font-weight:600;transition:color .25s ease,border-color .25s ease,background .25s ease;
}
.sf-contact svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sf-contact:hover{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-soft)}
.sf-copy{font-size:12px;color:var(--muted)}

/* Pages du pied de page */
.legal-block h4{margin:18px 0 6px;font-size:13.5px;font-weight:600}
.legal-block h4:first-child{margin-top:0}
.legal-block p{margin:0;color:var(--text-2);font-size:13.5px;line-height:1.62}

@media (max-width:880px){
  .site-footer{margin:48px -15px 0;width:calc(100% + 30px);padding:34px 20px 24px}
}
@media (prefers-reduced-motion:reduce){
  .sf-logo,.sf-tagline,.sf-nav,.sf-contact,.sf-copy{opacity:1;transform:none;transition:none}
}

/* ---------- Impression ---------- */
@media print{
  .sidebar,.mobile-bar,.composer,.bulk,#toasts,.quick,.card-link,.site-footer{display:none !important}
  body{background:#fff;color:#000}
  .card{border:1px solid #ccc;box-shadow:none;break-inside:avoid}
}
